<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free, unofficial revision app for the CITB Health, Safety and Environment test for Operatives.">
<meta name="theme-color" content="#16233a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Site Ready">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Site Ready – HS&amp;E Operatives Revision</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --text: #16202e;
  --muted: #5b6676;
  --line: #d9dde4;
  --brand: #16233a;
  --accent: #f2b705;
  --accent-ink: #16233a;
  --primary: #1f4fa3;
  --primary-ink: #ffffff;
  --good: #1d7a46;
  --good-bg: #e4f4ea;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --warn: #8a5a00;
  --warn-bg: #fff3d6;
  --focus: #f2b705;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520;
    --surface: #182130;
    --surface-2: #202b3d;
    --text: #e8edf4;
    --muted: #9aa6b8;
    --line: #2d3a50;
    --brand: #0b111b;
    --primary: #6f9cf0;
    --primary-ink: #0b111b;
    --good: #5cc98c;
    --good-bg: #16301f;
    --bad: #ff8a80;
    --bad-bg: #3a1b1a;
    --warn: #ffcf66;
    --warn-bg: #3a2e12;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1520; --surface: #182130; --surface-2: #202b3d; --text: #e8edf4; --muted: #9aa6b8;
  --line: #2d3a50; --brand: #0b111b; --primary: #6f9cf0; --primary-ink: #0b111b;
  --good: #5cc98c; --good-bg: #16301f; --bad: #ff8a80; --bad-bg: #3a1b1a; --warn: #ffcf66; --warn-bg: #3a2e12; --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
  background: var(--brand); color: #fff;
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; color: #fff; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 800; letter-spacing: .5px; }
.brand-text { font-weight: 700; line-height: 1.1; }
.brand-text small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.topnav { display: flex; gap: 4px; }
.topnav button { background: none; border: 0; color: #fff; padding: 8px 10px; border-radius: 8px; cursor: pointer; opacity: .85; }
.topnav button:hover, .topnav button[aria-current="page"] { background: rgba(255,255,255,.12); opacity: 1; }

main:focus, main:focus-visible { outline: none; }
main { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; outline: none; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 4px 0 8px; }
h2 { font-size: 1.2rem; margin: 24px 0 10px; }
h3 { font-size: 1rem; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 12px; }
.grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.four { grid-template-columns: repeat(4, 1fr); } }
.grid.four { grid-template-columns: 1fr 1fr; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }

.mode {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.mode:hover { border-color: var(--primary); }
.mode h3 { font-size: 1.05rem; }
.mode p { margin: 0; color: var(--muted); font-size: .92rem; }
.mode .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); margin-bottom: 6px; }

.stat { text-align: center; padding: 12px 8px; }
.stat b { display: block; font-size: 1.5rem; line-height: 1.2; }
.stat span { font-size: .8rem; color: var(--muted); }

.banner { border-radius: var(--radius); padding: 12px 14px; font-size: .92rem; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.good { background: var(--good-bg); color: var(--good); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }

/* Choice chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

/* Question */
.qhead { position: sticky; top: var(--tb, 56px); z-index: 4; background: var(--bg); padding: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .9rem; color: var(--muted); }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text); padding: 4px 10px; border-radius: 8px; background: var(--surface-2); }
.timer.low { background: var(--bad-bg); color: var(--bad); }
.progressbar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.progressbar > i { display: block; height: 100%; background: var(--accent); }
.qtext { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
.qhint { font-size: .9rem; color: var(--muted); margin-bottom: 12px; }
.qimg { display: block; width: 140px; height: 140px; object-fit: contain; margin: 8px auto 16px; background: #fff; border-radius: 8px; padding: 6px; }
.options { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; cursor: pointer;
  min-height: 52px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface);
}
.opt:hover:not([disabled]) { border-color: var(--primary); }
.opt .key { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--surface-2); font-weight: 700; font-size: .85rem; }
.opt[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); }
.opt[aria-pressed="true"] .key { background: var(--primary); color: var(--primary-ink); }
.opt.correct { border-color: var(--good); background: var(--good-bg); }
.opt.correct .key { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.feedback { margin-top: 16px; border-radius: var(--radius); padding: 14px; }
.feedback.good { background: var(--good-bg); }
.feedback.bad { background: var(--bad-bg); }
.feedback h3 { margin-bottom: 6px; }
.feedback .src { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }
.feedback .src a { color: inherit; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 16px; }

/* Mock navigator */
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.navgrid button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .85rem; font-variant-numeric: tabular-nums; }
.navgrid button.answered { background: var(--surface-2); font-weight: 700; }
.navgrid button.flagged { border: 2px solid var(--accent); }
.navgrid button.current { outline: 2px solid var(--primary); }
.navgrid button.r-good { background: var(--good-bg); border-color: var(--good); }
.navgrid button.r-bad { background: var(--bad-bg); border-color: var(--bad); }
details.nav summary { cursor: pointer; font-weight: 600; padding: 8px 0; }

/* Progress bars */
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.bar-row .label { font-size: .92rem; overflow-wrap: anywhere; }
.bar-row .val { font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
.bar-row .track { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar-row .track i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--muted); }
.bar-row .track i.s-strong { background: var(--good); }
.bar-row .track i.s-ok { background: var(--accent); }
.bar-row .track i.s-weak { background: var(--bad); }
.bar-row .track .pass { position: absolute; top: -2px; bottom: -2px; left: 90%; width: 2px; background: var(--text); opacity: .5; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
.pill.s-strong { background: var(--good-bg); color: var(--good); }
.pill.s-ok { background: var(--warn-bg); color: var(--warn); }
.pill.s-weak { background: var(--bad-bg); color: var(--bad); }
.pill.s-none { background: var(--surface-2); color: var(--muted); }

table.hist { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.hist th, table.hist td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.hist td.num, table.hist th.num { text-align: right; font-variant-numeric: tabular-nums; }

.review-item { border-left: 4px solid var(--line); padding: 8px 12px; margin: 10px 0; background: var(--surface); border-radius: 0 8px 8px 0; }
.review-item.good { border-color: var(--good); }
.review-item.bad { border-color: var(--bad); }
.review-item p { margin: 4px 0; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal[hidden] { display: none; }
.modal-card { background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 20px; max-width: 420px; width: 100%; }
.modal-card h2 { margin-top: 0; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

.noscript { padding: 16px; text-align: center; }

@media (max-width: 520px) {
  .brand-text small { display: none; }
  .topnav button { padding: 8px 7px; font-size: .9rem; }
  h1 { font-size: 1.35rem; }
  .qtext { font-size: 1.05rem; }
}
/* Phones: keep the answer buttons within thumb reach */
@media (max-width: 640px) {
  .actions.sticky {
    position: sticky; bottom: 0; z-index: 5;
    margin: 16px -16px 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .actions.sticky .btn { flex: 1 1 auto; }
  .actions.sticky .row { flex: 1 1 100%; flex-wrap: nowrap; }
  .actions.sticky .btn { min-height: 44px; padding: 8px 10px; font-size: .95rem; white-space: nowrap; }
}
@media (max-width: 360px) {
  .brand-text { display: none; }
}
main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
@media print { .topbar, .actions { display: none; } }

</style>
</head>
<body>
<header class="topbar">
  <button class="brand" data-go="home" aria-label="Site Ready home">
    <span class="brand-mark" aria-hidden="true">SR</span>
    <span class="brand-text">Site Ready <small>HS&amp;E Operatives revision</small></span>
  </button>
  <nav class="topnav" aria-label="Main">
    <button data-go="home">Home</button>
    <button data-go="progress">Progress</button>
    <button data-go="about">About</button>
  </nav>
</header>

<main id="app" tabindex="-1" aria-live="polite"></main>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <h2 id="modal-title"></h2>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost">Cancel</button>
      <button id="modal-ok" class="btn primary">OK</button>
    </div>
  </div>
</div>

<noscript><p class="noscript">This app needs JavaScript switched on.</p></noscript>
<script>
/*
 * Site Ready – question bank (Operatives HS&E revision)
 * All questions are ORIGINAL, written from primary sources (UK legislation and HSE guidance).
 * They are not taken from CITB or any third-party question bank.
 *
 * Schema:
 *   id        unique id (section prefix + number)
 *   section   we | oh | sa | hr
 *   topic     topic tag used for strength/weakness analysis
 *   type      "single" (one answer) or "multi" (pick exactly answer.length)
 *   q         question text
 *   img       optional image path (relative to index.html)
 *   options   answer options (shuffled at run time)
 *   answer    indexes of correct options
 *   why       explanation shown after answering
 *   src       primary source {t: title, u: url}
 *   status    "draft" until checked by a qualified reviewer, then "reviewed"
 */
window.SECTIONS = {
  we: "Working environment",
  oh: "Occupational health",
  sa: "Safety",
  hr: "High-risk activities"
};

var L = {
  hswa: { t: "Health and Safety at Work etc. Act 1974", u: "https://www.legislation.gov.uk/ukpga/1974/37" },
  cdm: { t: "Construction (Design and Management) Regulations 2015", u: "https://www.legislation.gov.uk/uksi/2015/51" },
  riddor: { t: "RIDDOR 2013 / HSE RIDDOR guidance", u: "https://www.hse.gov.uk/riddor/" },
  ppe: { t: "Personal Protective Equipment at Work Regulations 1992", u: "https://www.legislation.gov.uk/uksi/1992/2966" },
  fa: { t: "Health and Safety (First-Aid) Regulations 1981 / HSE first aid guidance", u: "https://www.hse.gov.uk/firstaid/" },
  wca: { t: "Wildlife and Countryside Act 1981", u: "https://www.legislation.gov.uk/ukpga/1981/69" },
  epa: { t: "Environmental Protection Act 1990, s.34 (waste duty of care)", u: "https://www.legislation.gov.uk/ukpga/1990/43/section/34" },
  hsg150: { t: "HSE HSG150 Health and safety in construction", u: "https://www.hse.gov.uk/pubns/books/hsg150.htm" },
  coshh: { t: "COSHH Regulations 2002 / HSE COSHH guidance", u: "https://www.hse.gov.uk/coshh/" },
  asb: { t: "Control of Asbestos Regulations 2012 / HSE asbestos guidance", u: "https://www.hse.gov.uk/asbestos/" },
  noise: { t: "Control of Noise at Work Regulations 2005 / HSE noise guidance", u: "https://www.hse.gov.uk/noise/" },
  vib: { t: "Control of Vibration at Work Regulations 2005 / HSE vibration guidance", u: "https://www.hse.gov.uk/vibration/" },
  mh: { t: "Manual Handling Operations Regulations 1992 / HSE guidance", u: "https://www.hse.gov.uk/msd/manual-handling/" },
  lepto: { t: "HSE guidance on leptospirosis (Weil's disease)", u: "https://www.hse.gov.uk/construction/healthrisks/hazardous-substances/harmful-micro-organisms/leptospirosis-weils-disease.htm" },
  signs: { t: "Health and Safety (Safety Signs and Signals) Regulations 1996 / HSE L64", u: "https://www.legislation.gov.uk/uksi/1996/341" },
  fire: { t: "Regulatory Reform (Fire Safety) Order 2005 / HSG150 (fire)", u: "https://www.legislation.gov.uk/uksi/2005/1541" },
  elec: { t: "Electricity at Work Regulations 1989 / HSE electrical safety in construction", u: "https://www.hse.gov.uk/electricity/" },
  puwer: { t: "Provision and Use of Work Equipment Regulations 1998", u: "https://www.legislation.gov.uk/uksi/1998/2306" },
  wah: { t: "Work at Height Regulations 2005 / HSE work at height guidance", u: "https://www.hse.gov.uk/work-at-height/" },
  ladder: { t: "HSE INDG455 Safe use of ladders and stepladders", u: "https://www.hse.gov.uk/work-at-height/ladders/" },
  hsg47: { t: "HSE HSG47 Avoiding danger from underground services", u: "https://www.hse.gov.uk/pubns/books/hsg47.htm" },
  cs: { t: "Confined Spaces Regulations 1997 / HSE confined spaces guidance", u: "https://www.hse.gov.uk/confinedspace/" },
  trans: { t: "HSE construction site transport safety guidance", u: "https://www.hse.gov.uk/construction/" },
  loler: { t: "Lifting Operations and Lifting Equipment Regulations 1998", u: "https://www.legislation.gov.uk/uksi/1998/2307" }
};

window.QUESTIONS = [
/* ===================== WORKING ENVIRONMENT ===================== */
{ id:"WE01", section:"we", topic:"Legal duties", type:"single",
  q:"Which statement best describes your own legal duty for health and safety while working on site?",
  options:[
    "Take reasonable care of yourself and anyone else affected by what you do, and co-operate with your employer",
    "Follow instructions from the site manager only; everything else is the employer's responsibility",
    "Look after your own safety; other people are responsible for themselves",
    "You only have legal duties if you are a supervisor or manager"],
  answer:[0],
  why:"Section 7 of the Health and Safety at Work Act places a duty on every employee to take reasonable care of their own and others' health and safety, and to co-operate with their employer.",
  src:L.hswa, status:"draft" },

{ id:"WE02", section:"we", topic:"Legal duties", type:"single",
  q:"A workmate takes the guard off a saw because it slows the job down. Which statement is correct?",
  options:[
    "It is against the law for anyone to intentionally or recklessly interfere with or misuse anything provided for health and safety",
    "It is acceptable if the workmate is experienced with the saw",
    "It is only a problem if a supervisor sees it",
    "It is acceptable for short jobs of less than ten minutes"],
  answer:[0],
  why:"Section 8 of the Health and Safety at Work Act makes it an offence for any person to intentionally or recklessly interfere with or misuse anything provided in the interests of health and safety.",
  src:L.hswa, status:"draft" },

{ id:"WE03", section:"we", topic:"Legal duties", type:"single",
  q:"Your job requires you to wear safety boots, gloves and eye protection. Who should pay for this PPE?",
  options:[
    "Your employer, free of charge to you",
    "You, because it is your personal equipment",
    "You and your employer share the cost",
    "The site client"],
  answer:[0],
  why:"Employers must provide suitable PPE where risks cannot be adequately controlled in other ways, and Section 9 of the Health and Safety at Work Act says they cannot charge workers for anything done or provided to meet a legal health and safety requirement.",
  src:L.ppe, status:"draft" },

{ id:"WE04", section:"we", topic:"Site rules & communication", type:"single",
  q:"You have been given a method statement for a task, but one of the steps does not seem to match the conditions on site. What should you do?",
  options:[
    "Stop and speak to your supervisor before continuing",
    "Carry on and do the job the way you think is best",
    "Skip the step that does not match",
    "Ask another operative to sign the method statement for you"],
  answer:[0],
  why:"A method statement sets out the agreed safe way of working. If it does not fit the conditions, the risks may not have been controlled, so stop and get it checked rather than improvising.",
  src:L.hsg150, status:"draft" },

{ id:"WE05", section:"we", topic:"Site rules & communication", type:"single",
  q:"What is the main purpose of a site induction?",
  options:[
    "To tell you about the site's hazards, rules, emergency arrangements and welfare facilities before you start work",
    "To check that your CSCS card is in date and nothing else",
    "To give you your work programme for the week",
    "To test your trade skills"],
  answer:[0],
  why:"Under CDM 2015 the principal contractor must make sure every worker receives a suitable site induction covering site-specific risks, rules and emergency procedures.",
  src:L.cdm, status:"draft" },

{ id:"WE06", section:"we", topic:"Accident reporting", type:"single",
  q:"A worker is injured on site and, as a result, cannot do their normal work for more than seven days in a row (not counting the day of the accident). Under RIDDOR, what must happen?",
  options:[
    "The injury must be reported to the enforcing authority within 15 days of the accident",
    "Nothing, as long as it is written in the accident book",
    "It must be reported only if the worker goes to hospital",
    "The worker must report it themselves to the police"],
  answer:[0],
  why:"Under RIDDOR 2013, injuries that stop a worker doing their normal duties for more than seven consecutive days (excluding the day of the accident) must be reported by the responsible person within 15 days of the accident.",
  src:L.riddor, status:"draft" },

{ id:"WE07", section:"we", topic:"Accident reporting", type:"multi",
  q:"Which TWO of these injuries to a worker are 'specified injuries' that must be reported under RIDDOR?",
  options:[
    "A broken arm",
    "Amputation of a finger",
    "A small cut to the hand treated with a plaster",
    "A bruised knee after a trip",
    "A mild headache after working in the sun"],
  answer:[0,1],
  why:"Specified injuries include bone fractures (other than to fingers, thumbs and toes) and amputation of an arm, hand, finger, thumb, leg, foot or toe. Minor cuts and bruises are not reportable, but should still be recorded.",
  src:L.riddor, status:"draft" },

{ id:"WE08", section:"we", topic:"Accident reporting", type:"single",
  q:"A pallet of blocks falls from a forklift and lands where people often walk, but nobody is hurt. Why should this near miss be reported?",
  options:[
    "So the cause can be found and fixed before someone is injured next time",
    "So that someone can be blamed and disciplined",
    "It does not need reporting because nobody was hurt",
    "Only so the insurance company can be informed"],
  answer:[0],
  why:"Near misses show where controls have failed. Reporting them allows the cause to be investigated and put right before the same event injures someone.",
  src:L.hsg150, status:"draft" },

{ id:"WE09", section:"we", topic:"Accident reporting", type:"single",
  q:"You cut your hand on a sharp edge. A first aider cleans and dresses it and you go back to work. What else should happen?",
  options:[
    "The injury should be recorded in the site accident book",
    "Nothing, because the injury was minor",
    "You should go home for the rest of the day",
    "You should report it directly to HSE"],
  answer:[0],
  why:"Even minor injuries should be recorded. The record helps identify recurring hazards and protects your interests if the injury later turns out to be more serious.",
  src:L.riddor, status:"draft" },

{ id:"WE10", section:"we", topic:"Welfare & first aid", type:"multi",
  q:"Which TWO of the following must be provided on a construction site as welfare facilities?",
  options:[
    "An adequate supply of drinking water",
    "Washing facilities with running hot and cold, or warm, water, plus soap and a way of drying hands",
    "A hot meal at lunchtime",
    "A covered smoking shelter",
    "A vending machine"],
  answer:[0,1],
  why:"Schedule 2 of CDM 2015 requires toilets, washing facilities (with hot and cold or warm running water, soap and drying), drinking water, changing and storage facilities, and rest facilities.",
  src:L.cdm, status:"draft" },

{ id:"WE11", section:"we", topic:"Welfare & first aid", type:"single",
  q:"You find a workmate lying unconscious on the floor of the site cabin. You are not a trained first aider. What should you do first?",
  options:[
    "Check it is safe, then call for the site first aider and the emergency services",
    "Move them to a more comfortable position straight away",
    "Give them a drink of water",
    "Leave them to recover and tell your supervisor at the end of the day"],
  answer:[0],
  why:"Make sure there is no danger to yourself, then get help quickly: call the first aider and emergency services. Do not move a casualty unless they are in immediate danger, and never give an unconscious person anything to drink.",
  src:L.fa, status:"draft" },

{ id:"WE12", section:"we", topic:"Environment & waste", type:"single",
  q:"Diesel is leaking from a generator and is heading towards a surface water drain. What should you do?",
  options:[
    "If it is safe, stop the leak, use the spill kit to contain it and stop it reaching the drain, then report it",
    "Wash the diesel into the drain with plenty of water",
    "Cover it with soil and carry on working",
    "Leave it, because drains go to a treatment works"],
  answer:[0],
  why:"Surface water drains usually run straight to rivers and streams without treatment. Contain the spill with the spill kit, protect the drain and report it so it can be cleaned up properly.",
  src:L.hsg150, status:"draft" },

{ id:"WE13", section:"we", topic:"Environment & waste", type:"single",
  q:"Where should the chute of a concrete lorry be washed out?",
  options:[
    "Only in the designated washout area",
    "Into the nearest drain",
    "Onto any grassed area",
    "Into a nearby ditch or stream"],
  answer:[0],
  why:"Concrete washwater is highly alkaline and harmful to wildlife. It must never go into drains or watercourses; use the designated washout area.",
  src:L.hsg150, status:"draft" },

{ id:"WE14", section:"we", topic:"Environment & waste", type:"single",
  q:"While preparing to clear a hedge, you find a bird's nest that is being used. What should you do?",
  options:[
    "Stop work in that area and tell your supervisor",
    "Move the nest to another hedge and carry on",
    "Carry on, because the site has planning permission",
    "Remove the nest carefully and put it in a skip"],
  answer:[0],
  why:"Under the Wildlife and Countryside Act 1981 it is an offence to intentionally take, damage or destroy the nest of a wild bird while it is in use or being built. Work must stop so advice can be taken.",
  src:L.wca, status:"draft" },

{ id:"WE15", section:"we", topic:"Environment & waste", type:"single",
  q:"Why do sites have separate skips for different types of waste?",
  options:[
    "So more waste can be reused or recycled and less goes to landfill",
    "To make the site look tidier for visitors",
    "Because every skip company insists on it",
    "So that hazardous waste can be mixed in safely with general waste"],
  answer:[0],
  why:"Segregating waste makes reuse and recycling possible, reduces costs and landfill, and helps the site meet its waste duty of care. Hazardous waste must always be kept separate.",
  src:L.epa, status:"draft" },

/* ===================== OCCUPATIONAL HEALTH ===================== */
{ id:"OH01", section:"oh", topic:"Dust & fumes", type:"multi",
  q:"You need to cut concrete paving slabs with a petrol disc cutter. Which TWO are the best ways of controlling the dust at source?",
  options:[
    "Use water suppression on the cutter",
    "Use a cutter fitted with on-tool dust extraction",
    "Sweep up the dust at the end of the day",
    "Work with your back to the wind",
    "Wear a thin nuisance dust mask"],
  answer:[0,1],
  why:"HSE guidance is to control silica dust at source using water suppression or on-tool extraction, supported by suitable RPE. Dry sweeping and nuisance masks do not adequately control the risk.",
  src:L.coshh, status:"draft" },

{ id:"OH02", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Breathing in fine dust from cutting concrete, bricks or stone over a long period can cause which serious lung disease?",
  options:[
    "Silicosis",
    "Dermatitis",
    "Tinnitus",
    "Leptospirosis"],
  answer:[0],
  why:"Respirable crystalline silica from concrete, brick, stone and mortar can cause silicosis, lung cancer and COPD. The damage builds up over time and cannot be reversed.",
  src:L.coshh, status:"draft" },

{ id:"OH03", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Why might you be asked to be clean-shaven when wearing a tight-fitting disposable dust mask?",
  options:[
    "Stubble stops the mask sealing to your face, so dust can leak in",
    "Beards are against site rules for appearance reasons",
    "It makes the mask more comfortable",
    "Stubble makes the filter wear out faster"],
  answer:[0],
  why:"Tight-fitting RPE only works if it seals against the skin. Facial hair where the mask seals lets contaminated air leak in, which is why face-fit testing is carried out clean-shaven.",
  src:L.coshh, status:"draft" },

{ id:"OH04", section:"oh", topic:"Asbestos", type:"single",
  q:"While removing an old ceiling you uncover material you think might contain asbestos. What should you do?",
  options:[
    "Stop work immediately, keep people away and tell your supervisor",
    "Dampen it down and carry on carefully",
    "Put it in a normal skip with other waste",
    "Sweep it up so no one else is exposed"],
  answer:[0],
  why:"If you suspect asbestos, stop work straight away so you do not disturb it further, keep others away, and report it. It must be identified and, if necessary, removed by people trained to do so.",
  src:L.asb, status:"draft" },

{ id:"OH05", section:"oh", topic:"Asbestos", type:"single",
  q:"Which buildings could contain asbestos?",
  options:[
    "Any building built or refurbished before the year 2000",
    "Only buildings built before 1950",
    "Only industrial buildings such as factories",
    "Only buildings that already have an asbestos warning sign"],
  answer:[0],
  why:"Asbestos was widely used in buildings until it was banned in 1999. HSE advises that any building built or refurbished before 2000 may contain asbestos.",
  src:L.asb, status:"draft" },

{ id:"OH06", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Which of these is a sign that noise on site is likely to be loud enough to need controlling?",
  options:[
    "You have to raise your voice to be heard by someone about two metres away",
    "You can hear a radio playing in the site cabin",
    "You can hear traffic on the road outside the site",
    "Machines can be heard from the car park"],
  answer:[0],
  why:"HSE's rule of thumb is that if you have to raise your voice to have a normal conversation with someone about two metres away for at least part of the day, the noise probably needs to be assessed and controlled.",
  src:L.noise, status:"draft" },

{ id:"OH07", section:"oh", topic:"Noise & vibration", type:"single",
  q:"At what average daily noise exposure must your employer provide hearing protection and make sure it is worn?",
  options:[
    "85 dB(A)",
    "70 dB(A)",
    "75 dB(A)",
    "100 dB(A)"],
  answer:[0],
  why:"Under the Control of Noise at Work Regulations 2005, 85 dB(A) is the upper exposure action value. At this level hearing protection must be provided and worn, and hearing protection zones marked. At 80 dB(A) it must be made available.",
  src:L.noise, status:"draft" },

{ id:"OH08", section:"oh", topic:"Noise & vibration", type:"single",
  q:"After a day using a breaker you notice a ringing in your ears. What could this mean?",
  options:[
    "It may be an early sign of hearing damage, and you should report it",
    "It is normal and always goes away, so it can be ignored",
    "It means your hearing protection was working properly",
    "It is caused by tiredness, not noise"],
  answer:[0],
  why:"Ringing in the ears (tinnitus) can be a sign that your hearing is being damaged. Noise-induced hearing loss is permanent, so report it and check your hearing protection is suitable and worn correctly.",
  src:L.noise, status:"draft" },

{ id:"OH09", section:"oh", topic:"Noise & vibration", type:"multi",
  q:"Which TWO of these could be early signs of hand-arm vibration syndrome (HAVS)?",
  options:[
    "Tingling and numbness in the fingers",
    "Fingertips going white, then red and painful, especially in the cold",
    "Ringing in the ears",
    "A dry, itchy rash on the arms",
    "Aching knees"],
  answer:[0,1],
  why:"Early HAVS symptoms include tingling and numbness in the fingers and fingertips turning white (blanching) in cold or wet conditions. Report symptoms early; the damage can become permanent.",
  src:L.vib, status:"draft" },

{ id:"OH10", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Which of these helps reduce your risk from hand-arm vibration?",
  options:[
    "Using low-vibration, well-maintained tools and taking regular breaks",
    "Gripping the tool as tightly as possible",
    "Using the tool for as long as possible to finish the job quickly",
    "Wearing thin gloves only in the summer"],
  answer:[0],
  why:"Lower-vibration and well-maintained tools, limiting time on the tool, and keeping warm all reduce risk. A tight grip increases the vibration passed to the hands.",
  src:L.vib, status:"draft" },

{ id:"OH11", section:"oh", topic:"Manual handling", type:"single",
  q:"You need to move a heavy load. What should be considered first?",
  options:[
    "Whether the load needs to be moved by hand at all, or whether a lifting aid can be used",
    "How many people are available to help lift it",
    "Whether you are wearing gloves",
    "How quickly it can be moved"],
  answer:[0],
  why:"The Manual Handling Operations Regulations set out an order: avoid hazardous manual handling where reasonably practicable, assess what cannot be avoided, and reduce the risk. Mechanical aids should be considered first.",
  src:L.mh, status:"draft" },

{ id:"OH12", section:"oh", topic:"Manual handling", type:"multi",
  q:"When lifting a load by hand, which TWO of these are good practice?",
  options:[
    "Keep the load close to your waist",
    "Avoid twisting your back; move your feet instead",
    "Keep your legs straight and bend from the waist",
    "Jerk the load up quickly to get it moving",
    "Hold the load at arm's length so it does not touch your clothes"],
  answer:[0,1],
  why:"Keeping the load close to your body and avoiding twisting reduce the strain on your back. Bending from the waist, jerking and holding loads away from you all increase the risk of injury.",
  src:L.mh, status:"draft" },

{ id:"OH13", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"How can you catch leptospirosis (Weil's disease) on site?",
  options:[
    "Through contact with water or wet ground contaminated with rat urine, for example through cuts or by touching your mouth",
    "By breathing in cement dust",
    "By working in very noisy areas",
    "By lifting heavy loads"],
  answer:[0],
  why:"Leptospirosis is spread by the urine of infected animals, especially rats. Cover cuts, wear gloves, wash your hands before eating or smoking, and tell your doctor where you work if you get flu-like symptoms.",
  src:L.lepto, status:"draft" },

{ id:"OH14", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"What health problem can be caused by skin contact with wet cement?",
  options:[
    "Dermatitis and cement burns",
    "Hearing loss",
    "Hand-arm vibration syndrome",
    "Silicosis"],
  answer:[0],
  why:"Wet cement is strongly alkaline and can cause burns and dermatitis. Wear suitable gloves and clothing, and wash skin that has been in contact with it as soon as possible.",
  src:L.coshh, status:"draft" },

{ id:"OH15", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"You notice a workmate seems to be under the influence of alcohol at the start of the shift. What should you do?",
  options:[
    "Tell your supervisor",
    "Ignore it; it is none of your business",
    "Let them carry on as long as they avoid driving plant",
    "Give them some coffee and let them start work"],
  answer:[0],
  why:"Someone affected by drink or drugs puts themselves and others at risk. Tell your supervisor so that the situation can be dealt with properly.",
  src:L.hswa, status:"draft" },

    "First aid",

{ id:"SA05", section:"sa", topic:"Safety signs", type:"single",
  q:"What does a red square or rectangular sign usually show?",
  options:[
    "The location of fire-fighting equipment, such as an extinguisher or alarm call point",
    "A route to an emergency exit",
    "A hazard warning",
    "An instruction you must follow"],
  answer:[0],
  why:"Red square or rectangular signs identify fire equipment. Emergency exit and first aid signs are green; warning signs are yellow triangles.",
  src:L.signs, status:"draft" },

{ id:"SA06", section:"sa", topic:"Fire prevention", type:"multi",
  q:"A fire needs three things to start and keep burning. Which THREE?",
  options:[
    "Heat (a source of ignition)",
    "Fuel",
    "Oxygen",
    "Water",
    "Carbon dioxide"],
  answer:[0,1,2],
  why:"The 'fire triangle' is heat, fuel and oxygen. Removing any one of them will put out the fire, which is how different extinguishers work.",
  src:L.fire, status:"draft" },

{ id:"SA07", section:"sa", topic:"Fire prevention", type:"single",
  q:"Which type of fire extinguisher is suitable for a fire in electrical equipment?",
  options:[
    "Carbon dioxide (CO2), with a black label",
    "Water, with a red label",
    "Foam, with a cream label",
    "Wet chemical, with a yellow label"],
  answer:[0],
  why:"CO2 extinguishers (black band or label) are suitable for fires involving electrical equipment. Water and most foam extinguishers conduct electricity and should not be used on live electrical equipment.",
  src:L.fire, status:"draft" },

{ id:"SA08", section:"sa", topic:"Fire prevention", type:"single",
  q:"The fire alarm sounds while you are working. What should you do?",
  options:[
    "Stop work, leave by the nearest safe exit and go to the assembly point",
    "Finish what you are doing, then leave",
    "Go back to the cabin to collect your belongings first",
    "Wait for a supervisor to confirm there is a real fire"],
  answer:[0],
  why:"Treat every alarm as real. Stop work, leave by the nearest safe route, go to the assembly point so you can be accounted for, and do not return until told it is safe.",
  src:L.fire, status:"draft" },

{ id:"SA09", section:"sa", topic:"Fire prevention", type:"single",
  q:"Why is a 'fire watch' kept for a period after hot work, such as welding or cutting, has finished?",
  options:[
    "Hot sparks or smouldering material can start a fire some time after the work has stopped",
    "To make sure the equipment is not stolen",
    "Because the permit requires the area to be swept",
    "To allow the welder to take a break"],
  answer:[0],
  why:"Fires from hot work often start after the job finishes, from sparks that have landed in hidden places. Hot work permits normally require the area to be checked for a period afterwards.",
  src:L.hsg150, status:"draft" },

{ id:"SA10", section:"sa", topic:"Electrical safety", type:"single",
  q:"Why are 110 volt tools and extension leads (usually with yellow plugs and cables) used on construction sites?",
  options:[
    "They greatly reduce the risk of a serious electric shock",
    "They are more powerful than mains voltage tools",
    "They do not need to be inspected",
    "They cannot be damaged"],
  answer:[0],
  why:"HSE recommends reduced low voltage (110 V centre-tapped to earth) supplies for portable tools on site because the voltage to earth is limited, greatly reducing the severity of a shock.",
  src:L.elec, status:"draft" },

{ id:"SA11", section:"sa", topic:"Electrical safety", type:"single",
  q:"Before using a power tool you notice the cable is damaged. What should you do?",
  options:[
    "Do not use it; label it as faulty, take it out of use and report it",
    "Wrap insulating tape around the damage and carry on",
    "Use it carefully for the rest of the day",
    "Cut the damaged section out and rejoin the wires"],
  answer:[0],
  why:"Damaged electrical equipment can cause shocks, burns and fires. Take it out of use, label it and report it so it can be repaired or replaced by a competent person.",
  src:L.elec, status:"draft" },

{ id:"SA12", section:"sa", topic:"Electrical safety", type:"single",
  q:"What should you assume about overhead power lines near your work area?",
  options:[
    "That they are live, unless the owner has confirmed they are dead",
    "That they are safe if they are more than 10 metres up",
    "That they are insulated and cannot cause a shock",
    "That they are switched off during working hours"],
  answer:[0],
  why:"Overhead lines are usually uninsulated and electricity can arc across a gap. Always treat them as live unless the line owner confirms otherwise, and keep plant and materials well clear.",
  src:L.elec, status:"draft" },

{ id:"SA13", section:"sa", topic:"Tools & equipment", type:"single",
  q:"Who should change the cutting disc on a disc cutter?",
  options:[
    "Someone who has been trained and is competent to do it",
    "Anyone who has used a disc cutter before",
    "The first person to notice the disc is worn",
    "The site storeman only"],
  answer:[0],
  why:"Abrasive wheels and discs can shatter if fitted incorrectly. Under PUWER, work equipment must only be used, and discs changed, by people who have received adequate training.",
  src:L.puwer, status:"draft" },

{ id:"SA14", section:"sa", topic:"PPE", type:"single",
  q:"You notice a crack in the shell of your safety helmet. What should you do?",
  options:[
    "Stop using it and get it replaced",
    "Tape over the crack and keep using it",
    "Keep using it until the end of the job",
    "Wear it back to front so the crack is at the back"],
  answer:[0],
  why:"A damaged helmet may not protect you in an impact. PPE must be maintained in good condition, so report damage and get a replacement.",
  src:L.ppe, status:"draft" },

/* ===================== HIGH-RISK ACTIVITIES ===================== */
{ id:"HR01", section:"hr", topic:"Working at height", type:"single",
  q:"Under the Work at Height Regulations, what should be considered first?",
  options:[
    "Whether the work at height can be avoided altogether",
    "Which type of harness to use",
    "How many people will be needed",
    "Whether a ladder is available"],
  answer:[0],
  why:"The Regulations set a hierarchy: avoid work at height where reasonably practicable; if not, prevent falls (e.g. guard rails, scaffolds); and then minimise the distance and consequences of any fall.",
  src:L.wah, status:"draft" },

{ id:"HR02", section:"hr", topic:"Working at height", type:"single",
  q:"What is the correct angle for a leaning ladder?",
  options:[
    "One unit out at the base for every four units up (about 75°)",
    "One unit out for every two units up",
    "As close to vertical as possible",
    "One unit out for every eight units up"],
  answer:[0],
  why:"HSE guidance is to set leaning ladders at about 75°, using the 1-in-4 rule: one unit out at the base for every four units up.",
  src:L.ladder, status:"draft" },

{ id:"HR03", section:"hr", topic:"Working at height", type:"single",
  q:"When is a ladder likely to be acceptable for doing work (not just access)?",
  options:[
