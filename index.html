  options:[
    "First aid",
    "Hospital entrance only",
    "No entry",
    "Fire assembly point"],
  answer:[0],
  why:"Green square or rectangular signs are safe condition signs. A white cross on green shows where first aid equipment or facilities are.",
  src:L.signs, status:"reviewed" },

{ id:"SA05", section:"sa", topic:"Safety signs", type:"single", fact:true,
  q:"What does a red square or rectangular sign usually show?",
  options:[
    "The location of fire-fighting equipment, such as an extinguisher or alarm call point",
    "A route to an emergency exit or another safe place",
    "A warning of a hazard, such as flammable materials nearby",
    "An instruction you must follow"],
  answer:[0],
  why:"Red square or rectangular signs identify fire equipment. Emergency exit and first aid signs are green; warning signs are yellow triangles.",
  src:L.signs, status:"reviewed" },

{ id:"SA06", section:"sa", topic:"Fire prevention", type:"multi",
  q:"A fire needs three things to start and keep burning. Which THREE?",
  options:[
    "Heat (a source of ignition)",
    "Fuel",
    "Oxygen",
    "Water",
    "Carbon dioxide"],
  answer:[0,1,2],
  why:"The 'fire triangle' is heat, fuel and oxygen. Removing any one of them will put out the fire, which is how different extinguishers work.",
  src:L.fire, status:"reviewed" },

{ id:"SA07", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"Which type of fire extinguisher is suitable for a fire in electrical equipment?",
  options:[
    "Carbon dioxide (CO2), with a black label",
    "Water, with a red label",
    "Foam, with a cream label",
    "Wet chemical, with a yellow label or band"],
  answer:[0],
  why:"CO2 extinguishers (black band or label) are suitable for fires involving electrical equipment. Water and most foam extinguishers conduct electricity and should not be used on live electrical equipment.",
  src:L.fire, status:"reviewed" },

{ id:"SA08", section:"sa", topic:"Fire prevention", type:"single",
  q:"The fire alarm sounds while you are working. What should you do?",
  options:[
    "Stop work, leave by the nearest safe exit and go to the assembly point",
    "Finish what you are doing, then leave",
    "Go back to the cabin to collect your phone and belongings first, then leave",
    "Wait for a supervisor to confirm there is a real fire"],
  answer:[0],
  why:"Treat every alarm as real. Stop work, leave by the nearest safe route, go to the assembly point so you can be accounted for, and do not return until told it is safe.",
  src:L.fire, status:"reviewed" },

{ id:"SA09", section:"sa", topic:"Fire prevention", type:"single",
  q:"Why is a 'fire watch' kept for a period after hot work, such as welding or cutting, has finished?",
  options:[
    "Hot sparks or smouldering material can start a fire some time after the work has stopped",
    "To make sure the equipment is not stolen",
    "Because the permit requires the area to be swept",
    "To allow the welder to take a proper rest break before starting the next hot work job"],
  answer:[0],
  why:"Fires from hot work often start after the job finishes, from sparks that have landed in hidden places. Hot work permits normally require the area to be checked for a period afterwards.",
  src:L.hsg150, status:"reviewed" },

{ id:"SA10", section:"sa", topic:"Electrical safety", type:"single", fact:true,
  q:"Why are 110 volt tools and extension leads (usually with yellow plugs and cables) used on construction sites?",
  options:[
    "They greatly reduce the risk of a serious electric shock",
    "They are more powerful than mains voltage tools and cheaper to run",
    "They do not need to be inspected",
    "They cannot be damaged"],
  answer:[0],
  why:"HSE recommends reduced low voltage (110 V centre-tapped to earth) supplies for portable tools on site because the voltage to earth is limited, greatly reducing the severity of a shock.",
  src:L.elec, status:"reviewed" },

{ id:"SA11", section:"sa", topic:"Electrical safety", type:"single",
  q:"Before using a power tool you notice the cable is damaged. What should you do?",
  options:[
    "Do not use it; label it as faulty, take it out of use and report it",
    "Wrap insulating tape tightly around the damage and carry on using it",
    "Use it carefully for the rest of the day",
    "Cut the damaged section out and rejoin the wires"],
  answer:[0],
  why:"Damaged electrical equipment can cause shocks, burns and fires. Take it out of use, label it and report it so it can be repaired or replaced by a competent person.",
  src:L.elec, status:"reviewed" },

{ id:"SA12", section:"sa", topic:"Electrical safety", type:"single",
  q:"What should you assume about overhead power lines near your work area?",
  options:[
    "That they are live, unless the owner has confirmed they are dead",
    "That they are safe to work near if they are more than 10 metres up",
    "That they are insulated and cannot cause a shock",
    "That they are switched off during working hours"],
  answer:[0],
  why:"Overhead lines are usually uninsulated and electricity can arc across a gap. Always treat them as live unless the line owner confirms otherwise, and keep plant and materials well clear.",
  src:L.elec, status:"reviewed" },

{ id:"SA13", section:"sa", topic:"Tools & equipment", type:"single",
  q:"Who should change the cutting disc on a disc cutter?",
  options:[
    "Someone who has been trained and is competent to do it",
    "Anyone who has used a disc cutter before",
    "The first person on site to notice that the disc is worn down",
    "The site storeman only"],
  answer:[0],
  why:"Abrasive wheels and discs can shatter if fitted incorrectly. Under PUWER, work equipment must only be used, and discs changed, by people who have received adequate training.",
  src:L.puwer, status:"reviewed" },

{ id:"SA14", section:"sa", topic:"PPE", type:"single",
  q:"You notice a crack in the shell of your safety helmet. What should you do?",
  options:[
    "Stop using it and get it replaced",
    "Tape over the crack and keep using it",
    "Keep using it until the end of the job",
    "Wear it back to front so the crack is at the back"],
  answer:[0],
  why:"A damaged helmet may not protect you in an impact. PPE must be maintained in good condition, so report damage and get a replacement.",
  src:L.ppe, status:"reviewed" },

/* ===================== HIGH-RISK ACTIVITIES ===================== */
{ id:"HR01", section:"hr", topic:"Working at height", type:"single",
  q:"Under the Work at Height Regulations, what should be considered first?",
  options:[
    "Whether the work at height can be avoided altogether",
    "Which type of harness and lanyard to use",
    "How many people will be needed",
    "Whether a ladder, stepladder or trestle is available on site today"],
  answer:[0],
  why:"The Regulations set a hierarchy: avoid work at height where reasonably practicable; if not, prevent falls (e.g. guard rails, scaffolds); and then minimise the distance and consequences of any fall.",
  src:L.wah, status:"reviewed" },

{ id:"HR02", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"What is the correct angle for a leaning ladder?",
  options:[
    "One unit out at the base for every four units up (about 75°)",
    "One unit out for every two units up",
    "As close to vertical as possible",
    "One unit out for every eight units up"],
  answer:[0],
  why:"HSE guidance is to set leaning ladders at about 75°, using the 1-in-4 rule: one unit out at the base for every four units up.",
  src:L.ladder, status:"reviewed" },

{ id:"HR03", section:"hr", topic:"Working at height", type:"single",
  q:"When is a ladder likely to be acceptable for doing work (not just access)?",
  options:[
    "For low-risk, short-duration tasks where more suitable equipment is not justified",
    "For any task, as long as someone holds the bottom",
    "For heavy work that needs both hands and lots of force",
    "Never; ladders are banned on construction sites"],
  answer:[0],
  why:"Ladders are not banned, but HSE says they should only be used for low-risk, short-duration work where a risk assessment shows more suitable equipment (such as a tower or MEWP) is not justified.",
  src:L.ladder, status:"reviewed" },

{ id:"HR04", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"On a construction site, how often must a scaffold working platform be inspected by a competent person?",
  options:[
    "At least every 7 days, and after anything that could affect its safety (such as bad weather or alterations)",
    "Once a month, or sooner if the site manager asks for an inspection",
    "Only when it is first put up",
    "Every 14 days, and whenever a new trade starts using it"],
  answer:[0],
  why:"The Work at Height Regulations require working platforms used in construction to be inspected after installation, at intervals of no more than 7 days, and after any event likely to have affected their stability.",
  src:L.wah, status:"reviewed" },

{ id:"HR05", section:"hr", topic:"Working at height", type:"single",
  q:"You notice that a guard rail is missing from a scaffold you need to work on. What should you do?",
  options:[
    "Do not use that part of the scaffold, and report it",
    "Replace the guard rail yourself with a spare tube",
    "Work carefully, keeping away from the edge",
    "Put a strip of hazard tape across the gap and carry on"],
  answer:[0],
  why:"Only competent scaffolders should alter or repair a scaffold. Do not use it and report the defect so it can be put right.",
  src:L.wah, status:"reviewed" },

{ id:"HR06", section:"hr", topic:"Working at height", type:"single",
  q:"When a harness is required in a boom-type mobile elevating work platform (MEWP), where should the lanyard be attached?",
  options:[
    "To the anchor point provided inside the basket",
    "To the guard rail of the basket",
    "To a nearby part of the building",
    "It does not need to be attached if you stay in the middle of the basket"],
  answer:[0],
  why:"In a boom-type MEWP, a harness with a short restraint lanyard should be attached to the designated anchor point in the basket, to stop you being thrown out.",
  src:L.wah, status:"reviewed" },

{ id:"HR07", section:"hr", topic:"Working at height", type:"multi",
  q:"Which TWO of these roof materials should be treated as fragile?",
  options:[
    "Plastic rooflights",
    "Old asbestos cement sheets",
    "A reinforced concrete roof slab",
    "A steel deck supported by beams",
    "A timber deck on joists with a close-boarded surface"],
  answer:[0,1],
  why:"Rooflights and old asbestos cement or fibre cement sheets are common fragile materials that will not bear a person's weight. Never walk on them; use staging and protection.",
  src:L.wah, status:"reviewed" },

{ id:"HR08", section:"hr", topic:"Excavations & services", type:"single",
  q:"When must an excavation be inspected by a competent person?",
  options:[
    "At the start of each shift, and after any event likely to affect its strength or stability",
    "Once a week, and whenever the site manager requests it",
    "Only when it is first dug and again before it is backfilled",
    "Only if someone reports a problem"],
  answer:[0],
  why:"CDM 2015 requires excavations to be inspected by a competent person at the start of each shift, after any event likely to have affected their strength or stability, and after any accidental fall of rock or material.",
  src:L.cdm, status:"reviewed" },

{ id:"HR09", section:"hr", topic:"Excavations & services", type:"single",
  q:"Why must spoil and materials be kept back from the edge of an excavation?",
  options:[
    "The extra weight can cause the sides to collapse, and material can fall on people below",
    "So the excavation looks tidy",
    "So that vehicles can park next to the edge",
    "It does not matter if the excavation is less than 2 m deep"],
  answer:[0],
  why:"Loads near the edge increase the pressure on the sides and can cause collapse; material can also fall in. Even shallow excavations can collapse and kill.",
  src:L.hsg150, status:"reviewed" },

{ id:"HR10", section:"hr", topic:"Excavations & services", type:"single",
  q:"What is a cable avoidance tool (CAT) used for?",
  options:[
    "To help locate buried cables and some metal pipes before and during digging",
    "To test whether an extension lead or power tool is safe to use",
    "To cut through buried cables safely",
    "To measure the depth of an excavation accurately before the trench supports go in"],
  answer:[0],
  why:"HSG47 recommends using service plans plus a CAT (often with a signal generator) operated by a trained person to locate services, then careful hand digging. Treat all services as live.",
  src:L.hsg47, status:"reviewed" },

{ id:"HR11", section:"hr", topic:"Excavations & services", type:"single",
  q:"A workmate collapses at the bottom of a manhole. What should you do?",
  options:[
    "Do not go in; raise the alarm and follow the emergency rescue plan",
    "Climb straight in to pull them out",
    "Lower a colleague in on a rope to pull them out, without breathing apparatus",
    "Shout down to them and wait for them to recover"],
  answer:[0],
  why:"Many people who die in confined spaces are would-be rescuers. The air may be toxic or lack oxygen. Raise the alarm and let trained people with the right equipment carry out the rescue.",
  src:L.cs, status:"reviewed" },

{ id:"HR12", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"What is the most effective way to prevent people being struck by vehicles on site?",
  options:[
    "Keeping pedestrians and vehicles apart with separate, barriered routes",
    "Telling drivers to sound their horns more often",
    "Asking pedestrians to wear dark clothing",
    "Letting vehicles drive faster so they spend less time on site near people"],
  answer:[0],
  why:"Separating people from vehicles, for example with barriers and dedicated walkways, is the most effective control. Hi-vis clothing, signallers and horns are additional measures.",
  src:L.trans, status:"reviewed" },

{ id:"HR13", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"A dumper driver offers you a lift across site. The dumper has only the driver's seat. What should you do?",
  options:[
    "Refuse; never ride on plant unless there is a proper seat for passengers",
    "Accept, as long as you sit on the side and hold on tightly to the frame with both hands",
    "Accept, as long as the driver goes at walking pace",
    "Accept if it is only a short distance"],
  answer:[0],
  why:"People are killed falling from plant. Only ride on vehicles where a proper passenger seat is provided, and wear the seatbelt if one is fitted.",
  src:L.trans, status:"reviewed" },

{ id:"HR14", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"A crane is lifting a load near where you are working. Which statement is correct?",
  options:[
    "Never stand or walk under a suspended load",
    "It is safe to walk under a load if it is moving slowly",
    "Anyone can give signals to the crane operator",
    "You may guide the load by hand without being asked"],
  answer:[0],
  why:"Lifting operations must be planned and carried out by competent people (LOLER). Only the appointed signaller should direct the operator, and nobody should be under a suspended load.",
  src:L.loler, status:"reviewed" },

{ id:"HR15", section:"hr", topic:"Hazardous substances", type:"single",
  q:"You are asked to use a product that has hazard pictograms on the label. What should you do before using it?",
  options:[
    "Find out and follow the control measures in the COSHH assessment",
    "Just follow what the last person did",
    "Pour some into a clean drinks bottle so it is easier to carry around site",
    "Use it only if you cannot smell anything"],
  answer:[0],
  why:"COSHH requires the risks from hazardous substances to be assessed and controlled. Follow the assessment's precautions, including any PPE, and never put chemicals into unlabelled or food and drink containers.",
  src:L.coshh, status:"reviewed" },

{ id:"HR16", section:"hr", topic:"Hazardous substances", type:"single",
  q:"Why must hazardous substances never be decanted into unlabelled containers?",
  options:[
    "Someone may not know what it is or how dangerous it is, and could use it wrongly or even drink it",
    "Air gets in and makes the substance less effective",
    "Because labels are required only for insurance purposes",
    "It is fine as long as you remember what is in it"],
  answer:[0],
  why:"Labels tell users what a substance is and how to handle it safely. Unlabelled containers, especially drinks bottles, have led to poisonings and serious injuries.",
  src:L.coshh, status:"reviewed" },
/* ---------- v2: Working environment ---------- */
{ id:"WE16", section:"we", topic:"Legal duties", type:"single",
  q:"An HSE inspector sees work that could cause serious personal injury. What can they do?",
  options:["Issue a prohibition notice that stops the work until it is made safe","Only give advice; they cannot stop work","Fine the workers on the spot for each breach","Nothing unless someone has already been hurt"], answer:[0],
  why:"HSE inspectors can issue prohibition notices to stop work that risks serious personal injury, and improvement notices requiring breaches to be put right. They can also prosecute.", src:L.hswa, status:"reviewed" },
{ id:"WE17", section:"we", topic:"Legal duties", type:"multi",
  q:"Which TWO of these are duties your employer has towards you under the Health and Safety at Work Act?",
  options:["Provide the information, instruction, training and supervision you need to work safely","Provide and maintain safe equipment and a safe place of work","Provide free transport to and from site","Pay for your CSCS card in every case","Guarantee that no accidents will ever happen"], answer:[0,1],
  why:"Section 2 requires employers, so far as is reasonably practicable, to provide safe plant and systems of work, a safe workplace, and the information, instruction, training and supervision needed.", src:L.hswa, status:"reviewed" },
{ id:"WE18", section:"we", topic:"Legal duties", type:"single",
  q:"You believe a task you have been told to do puts you in serious and imminent danger. What should you do?",
  options:["Stop, move to a safe place and report your concern to your supervisor","Carry on, because refusing is against the law","Carry on but work more quickly","Walk off site without telling anyone"], answer:[0],
  why:"Employers must have procedures so workers can stop work and go to a place of safety if they face serious and imminent danger. Raise your concern straight away so it can be dealt with.", src:L.mhsw, status:"reviewed" },
{ id:"WE19", section:"we", topic:"Legal duties", type:"single",
  q:"You notice something on site that could be dangerous but it is not your job to fix it. What should you do?",
  options:["Report it to your supervisor so it can be dealt with","Ignore it; it is someone else's responsibility to deal with it","Tell your workmates but nobody else","Wait until someone is hurt, then report it"], answer:[0],
  why:"Employees must tell their employer about any work situation they consider a serious and immediate danger, and about shortcomings in health and safety arrangements.", src:L.mhsw, status:"reviewed" },
{ id:"WE20", section:"we", topic:"Legal duties", type:"single",
  q:"What is the main purpose of a risk assessment?",
  options:["To identify hazards and decide what must be done to control the risks","To decide in advance who will be to blame and disciplined if there is an accident","To satisfy the insurance company","To record how long the job will take"], answer:[0],
  why:"Employers must assess the risks from their work and put in place measures to control them. You should be told about the findings that affect you.", src:L.mhsw, status:"reviewed" },
{ id:"WE21", section:"we", topic:"Legal duties", type:"single",
  q:"What is the difference between a hazard and a risk?",
  options:["A hazard is something that could cause harm; risk is how likely it is to cause harm and how serious that harm could be","They mean exactly the same thing","A risk is something that could cause harm; a hazard is how likely it is","A hazard only applies to chemicals"], answer:[0],
  why:"For example, a trailing cable is a hazard. The risk is the chance of someone tripping on it and how badly they might be hurt.", src:L.mhsw, status:"reviewed" },
{ id:"WE22", section:"we", topic:"Legal duties", type:"single",
  q:"In health and safety terms, what makes someone a 'competent person'?",
  options:["Having the right mix of training, skills, knowledge and experience for the task","Being the oldest person on site","Holding any kind of CSCS card","Having worked for the company for more than a year"], answer:[0],
  why:"Competence means having sufficient training, experience, knowledge and other qualities to do a task safely, such as inspecting a scaffold or an excavation.", src:L.mhsw, status:"reviewed" },
{ id:"WE23", section:"we", topic:"Legal duties", type:"single",
  q:"Why must the principal contractor consult and engage with workers on health and safety?",
  options:["Workers know the real hazards of the job, and the law requires their views to be taken into account","So that responsibility can be passed to the workers","It is optional good practice only","To collect workers' views for the company's publicity and marketing"], answer:[0],
  why:"CDM 2015 requires the principal contractor to make arrangements for consulting and engaging with workers on matters affecting their health, safety and welfare.", src:L.cdm, status:"reviewed" },
{ id:"WE24", section:"we", topic:"Legal duties", type:"single",
  q:"Who has responsibilities for health and safety on a construction site?",
  options:["Everyone, from the client and managers to every worker on site","Only the site manager","Only the health and safety adviser","Only the client who is paying for the work"], answer:[0],
  why:"Clients, designers, contractors, managers and every worker have legal duties. Your own actions affect your safety and that of others.", src:L.cdm, status:"reviewed" },
{ id:"WE25", section:"we", topic:"Site rules & communication", type:"single",
  q:"What is a toolbox talk?",
  options:["A short briefing on a specific health and safety topic relevant to the work","A training course on how to use hand tools","A meeting to agree pay rates","An inspection to check your tools are safe and tested"], answer:[0],
  why:"Toolbox talks are short, focused briefings, often at the start of a shift, on hazards and safe working methods for the work being done.", src:L.hsg150, status:"reviewed" },
{ id:"WE26", section:"we", topic:"Site rules & communication", type:"single",
  q:"What is a permit to work?",
  options:["A formal written system that controls high-risk work, such as hot work or entry into confined spaces","A signed document from your employer that allows you to work overtime, late shifts or at the weekend","Your CSCS card","Written permission from the client that the project can start"], answer:[0],
  why:"Permits make sure hazards are checked and controls are in place before high-risk work starts. Work must not start until the permit has been issued and must follow its conditions.", src:L.hsg150, status:"reviewed" },
{ id:"WE27", section:"we", topic:"Site rules & communication", type:"single",
  q:"Why must you sign in when you arrive on site and sign out when you leave?",
  options:["So that everyone can be accounted for in an emergency","So that your pay can be worked out","It is only needed for visitors, delivery drivers and new starters","So security can check your bag"], answer:[0],
  why:"An accurate record of who is on site is essential in an evacuation. Otherwise, people may risk their lives searching for someone who has already gone home.", src:L.cdm, status:"reviewed" },
{ id:"WE28", section:"we", topic:"Site rules & communication", type:"single",
  q:"Scenario: It is your first morning on a new site. Your supervisor is short of people and asks you to start work straight away and 'do the induction later'. What should you do?",
  options:["Politely explain that you need the site induction before you start work","Start work as asked; the induction can wait","Start work but avoid anything dangerous","Leave site and go home until the site induction has been arranged for you"], answer:[0],
  why:"The induction tells you about the site's specific hazards, rules and emergency arrangements. Without it you do not know what could hurt you or what to do in an emergency.", src:L.cdm, status:"reviewed" },
{ id:"WE29", section:"we", topic:"Site rules & communication", type:"single",
  q:"You have been briefed on a method statement but did not understand part of it. What should you do?",
  options:["Ask for it to be explained again until you understand it","Sign it anyway; you will work out the rest as you go along","Ask a workmate to do that part for you","Ignore that part"], answer:[0],
  why:"You must understand the agreed safe method before you start. Asking questions is expected, and signing something you do not understand does not keep you safe.", src:L.hsg150, status:"reviewed" },
{ id:"WE30", section:"we", topic:"Site rules & communication", type:"single",
  q:"Why must site perimeter fencing and gates be kept secure?",
  options:["To stop unauthorised people, especially children, getting onto site and being hurt","Only to stop tools and materials being stolen overnight","So that delivery drivers know which entrance to use","It only matters at weekends"], answer:[0],
  why:"CDM 2015 requires sites to be secured against unauthorised access. Children in particular are attracted to sites and have been killed on them.", src:L.cdm, status:"reviewed" },
{ id:"WE31", section:"we", topic:"Site rules & communication", type:"single",
  q:"Your supervisor asks you to use a machine you have not been trained on. What should you do?",
  options:["Tell your supervisor you have not been trained, and do not use it until you have been","Use it carefully and learn as you go","Ask someone to show you for a minute, then use it","Use it only for a short time and very carefully, until the trained operator returns"], answer:[0],
  why:"PUWER requires people who use work equipment to have received adequate training. Using equipment you are not trained on puts you and others at risk.", src:L.puwer, status:"reviewed" },
{ id:"WE32", section:"we", topic:"Site rules & communication", type:"single",
  q:"On a project with more than one contractor, who plans, manages and monitors health and safety during the construction work?",
  options:["The principal contractor","The newest subcontractor on site","The architect only","The local council"], answer:[0],
  why:"Under CDM 2015, the principal contractor plans, manages, monitors and coordinates health and safety during the construction phase where there is more than one contractor.", src:L.cdm, status:"reviewed" },
{ id:"WE33", section:"we", topic:"Site rules & communication", type:"single",
  q:"After an evacuation, why must you go to the assembly point and not leave site?",
  options:["So a roll call can check everyone is out and nobody is put at risk searching for you","So the site manager can give out work instructions for the rest of the working day","So you can watch the fire service","It does not matter if you go home instead"], answer:[0],
  why:"If you are not accounted for, emergency services may enter a dangerous building to look for you.", src:L.hsg168, status:"reviewed" },
{ id:"WE34", section:"we", topic:"Site rules & communication", type:"single",
  q:"A member of the public walks onto site through an open gate. What should you do?",
  options:["Stop work if necessary, politely guide them to a safe place or the site office, and tell your supervisor","Ignore them; they will soon realise they should not be there","Shout at them to get out","Let them look around as long as they stay out of the way"], answer:[0],
  why:"Members of the public are not inducted and do not know the hazards. Get them to safety and report the open gate so the site can be secured.", src:L.cdm, status:"reviewed" },
{ id:"WE35", section:"we", topic:"Accident reporting", type:"single",
  q:"Under RIDDOR, who is responsible for reporting an injury to an employee?",
  options:["The 'responsible person', usually the employer","The injured worker, as soon as they are able to","The first aider who treated the injury","The worker's GP"], answer:[0],
  why:"RIDDOR places the duty to report on the 'responsible person', normally the employer of the injured worker, or the self-employed person or person in control of the premises.", src:L.riddor, status:"reviewed" },
{ id:"WE36", section:"we", topic:"Accident reporting", type:"single", fact:true,
  q:"How quickly must a death or specified injury be reported under RIDDOR?",
  options:["Without delay, followed by a written report within 10 days","Within one month of the accident","Only at the end of the project","Within 15 days of the accident, using the accident book entry"], answer:[0],
  why:"Deaths and specified injuries must be notified to the enforcing authority by the quickest practicable means without delay, with a report within 10 days.", src:L.riddor, status:"reviewed" },
{ id:"WE37", section:"we", topic:"Accident reporting", type:"single",
  q:"A mobile crane partly overturns while lifting. Nobody is hurt. Is this reportable under RIDDOR?",
  options:["Yes, it is a dangerous occurrence and must be reported","No, because nobody was injured","Only if the crane was damaged","Only if a member of the public saw it happen or it was reported in the news"], answer:[0],
  why:"The collapse or overturning of lifting equipment, or failure of a load-bearing part, is a reportable dangerous occurrence even if no one is hurt.", src:{ t:"HSE RIDDOR: dangerous occurrences", u:"https://www.hse.gov.uk/riddor/dangerous-occurences.htm" }, status:"reviewed" },
{ id:"WE38", section:"we", topic:"Accident reporting", type:"multi",
  q:"Which TWO of these can be reportable occupational diseases under RIDDOR when a doctor links them to the person's work?",
  options:["Hand-arm vibration syndrome","Occupational dermatitis","A common cold","Hay fever","A sprained ankle from playing football"], answer:[0,1],
  why:"Reportable diseases include hand-arm vibration syndrome, carpal tunnel syndrome, occupational dermatitis and occupational asthma, when diagnosed and linked to a work activity.", src:L.riddor, status:"reviewed" },
{ id:"WE39", section:"we", topic:"Accident reporting", type:"single", fact:true,
  q:"An injury keeps a worker off their normal duties for five days. What does RIDDOR require?",
  options:["The injury must be recorded, but it does not need to be reported","It must be reported to HSE within 24 hours by the injured worker themselves","Nothing at all","It must be reported to the police"], answer:[0],
  why:"Injuries causing more than three consecutive days' incapacity must be recorded. They only become reportable when the incapacity lasts more than seven days.", src:L.riddor, status:"reviewed" },
{ id:"WE40", section:"we", topic:"Accident reporting", type:"single",
  q:"Scenario: A workmate slips from a trestle and bangs their head. They say they feel fine and don't want a fuss. What should you do?",
  options:["Encourage them to get checked by the first aider, and make sure the accident is reported and recorded","Agree to keep it quiet, as long as they promise to tell you straight away if they start to feel any worse","Tell them to go home without telling anyone","Carry on working; it is their choice"], answer:[0],
  why:"Head injuries can get worse later. Getting the person checked and recording the accident protects them and helps stop it happening to someone else.", src:L.riddor, status:"reviewed" },
{ id:"WE41", section:"we", topic:"Accident reporting", type:"single",
  q:"After a serious accident, why should the scene be left undisturbed, except to help the injured or make the area safe?",
  options:["So the cause can be properly investigated","So the site looks worse for the insurance claim","To punish the people involved","It does not matter if things are moved"], answer:[0],
  why:"Investigators need to see the scene as it was to find out what went wrong and stop it happening again.", src:L.riddor, status:"reviewed" },
{ id:"WE42", section:"we", topic:"Welfare & first aid", type:"single",
  q:"Where should you eat your lunch on site?",
  options:["In the welfare or rest area, after washing your hands","At your workstation so you can keep an eye on your tools","Anywhere, as long as you are sitting down","In the cab of the plant you are operating"], answer:[0],
  why:"Eating in work areas or with dirty hands can mean swallowing harmful substances such as lead, cement or contaminated soil. Rest facilities are provided for this reason.", src:L.cdm, status:"reviewed" },
{ id:"WE43", section:"we", topic:"Welfare & first aid", type:"single",
  q:"Should medicines, such as painkillers, be kept in the site first aid box?",
  options:["No, first aid boxes should not contain tablets or medicines","Yes, painkillers should always be included for headaches and pain","Yes, but only headache tablets","Only if the first aider agrees"], answer:[0],
  why:"HSE guidance is that first aid kits should not contain tablets or medicines.", src:L.fa, status:"reviewed" },
{ id:"WE44", section:"we", topic:"Welfare & first aid", type:"single",
  q:"You use the last plaster in the first aid kit. What should you do?",
  options:["Tell the first aider or the person responsible so it can be restocked","Nothing; the kit will be fully checked and restocked at the end of the month","Buy your own plasters in future","Take plasters from another kit"], answer:[0],
  why:"First aid kits must be kept stocked so they are ready for the next person who needs them.", src:L.fa, status:"reviewed" },
{ id:"WE45", section:"we", topic:"Welfare & first aid", type:"single",
  q:"A chemical splashes into a workmate's eye. What is the right first aid action?",
  options:["Rinse the eye straight away with plenty of clean water or eyewash, and get medical help","Rub the eye gently with a clean cloth to remove the chemical","Cover the eye and wait to see if it gets better","Put eye drops from your own bag in it"], answer:[0],
  why:"Wash the eye out immediately and for a prolonged period, then get medical help. The product's safety data sheet gives specific first aid advice.", src:L.fa, status:"reviewed" },
{ id:"WE46", section:"we", topic:"Welfare & first aid", type:"single",
  q:"A workmate burns their hand on hot equipment. What is the correct first aid?",
  options:["Cool the burn under cool running water for 20 minutes and get medical advice if needed","Put butter or cream on it straight away to stop it drying out","Burst any blisters","Wrap it tightly in a dry cloth and carry on"], answer:[0],
  why:"NHS advice is to cool a burn under cool or lukewarm running water for 20 minutes, remove any jewellery nearby, then cover it loosely with cling film or a clean plastic bag.", src:{ t:"NHS: Burns and scalds", u:"https://www.nhs.uk/conditions/burns-and-scalds/" }, status:"reviewed" },
{ id:"WE47", section:"we", topic:"Welfare & first aid", type:"single",
  q:"There is a tap near the welfare cabin with no sign. Can you assume it is drinking water?",
  options:["No; drinking water should be clearly marked where needed, so check before drinking","Yes; all water supplied to a site must be drinking water","Yes, if it looks clear and has no smell","Only if it is cold"], answer:[0],
  why:"CDM 2015 requires a supply of wholesome drinking water, marked with a sign where necessary. Other water on site may be contaminated.", src:L.cdm, status:"reviewed" },
{ id:"WE48", section:"we", topic:"Welfare & first aid", type:"single",
  q:"Why are changing and drying facilities provided on site?",
  options:["So you can change out of wet or contaminated work clothing and keep it separate from your own clothes","So workers have somewhere to sleep if they are working late shifts","Only for visitors","To store tools and equipment securely overnight"], answer:[0],
  why:"CDM 2015 requires changing rooms and facilities for drying and storing clothing, helping to stop contamination being taken home and keeping workers dry and warm.", src:L.cdm, status:"reviewed" },
{ id:"WE49", section:"we", topic:"Welfare & first aid", type:"single",
  q:"Someone has a deep cut that is bleeding heavily. What should a first aider do first?",
  options:["Apply firm, direct pressure to the wound","Wash the wound under a tap for several minutes","Give the casualty a hot drink","Apply a tight tourniquet immediately in every case"], answer:[0],
  why:"Direct pressure on the wound is the first step in controlling severe bleeding while emergency help is called.", src:L.fa, status:"reviewed" },
{ id:"WE50", section:"we", topic:"Environment & waste", type:"single",
  q:"You find Japanese knotweed in an area due to be excavated. What should you do?",
  options:["Stop work in that area and report it; it must not be spread or moved with ordinary soil","Dig it out and put it in the general waste skip","Spread the soil thinly somewhere else on site so it dries out","Strim it and carry on"], answer:[0],
  why:"You can be prosecuted for causing Japanese knotweed to spread into the wild. Knotweed-contaminated soil must be managed and disposed of in specific ways.", src:L.knot, status:"reviewed" },
{ id:"WE51", section:"we", topic:"Environment & waste", type:"multi",
  q:"Which TWO of these are likely to be hazardous waste?",
  options:["Oily rags and used oil filters","Asbestos cement sheets","Clean timber offcuts","Uncontaminated bricks","Cardboard packaging"], answer:[0,1],
  why:"Hazardous waste includes oils, oily materials and asbestos. It must be kept separate and disposed of by authorised carriers and sites.", src:L.epa, status:"reviewed" },
{ id:"WE52", section:"we", topic:"Environment & waste", type:"single",
  q:"Someone offers to take away the site's waste cheaply in their own van, for cash. Why should this be refused?",
  options:["Waste must only be passed to an authorised (registered) waste carrier, or it may be fly-tipped and the site held responsible","It is fine as long as they give you a receipt for the cash","It is only a problem for hazardous waste; general waste can go with anyone","Only the client can refuse"], answer:[0],
  why:"The waste duty of care means waste must be transferred only to an authorised person, with the right paperwork. Producers can be prosecuted if their waste is fly-tipped.", src:L.epa, status:"reviewed" },
{ id:"WE53", section:"we", topic:"Environment & waste", type:"single",
  q:"Why should you switch off plant and vehicle engines when they are not in use?",
  options:["To reduce exhaust fumes, noise and fuel use","To stop them overheating in winter","Because engines wear out faster when running","It makes no difference"], answer:[0],
  why:"Idling engines create unnecessary fumes, noise and fuel costs, and affect workers and neighbours.", src:L.hsg150, status:"reviewed" },
{ id:"WE54", section:"we", topic:"Environment & waste", type:"single",
  q:"Why do some sites have a wheel wash at the exit?",
  options:["To stop mud and debris being carried onto public roads","To keep vehicles and plant looking clean for the client's visits","To check tyre pressures","To cool down brakes"], answer:[0],
  why:"Mud on public roads is a hazard to road users and a nuisance to neighbours, and can wash into drains.", src:L.hsg150, status:"reviewed" },
{ id:"WE55", section:"we", topic:"Environment & waste", type:"single",
  q:"Why are fuel tanks and mobile bowsers on site kept in a bund or drip tray?",
  options:["To contain leaks and spills so fuel does not escape into the ground or drains","To protect the fuel from frost and stop it freezing and gelling in the winter","To make refuelling faster","To keep the tank clean"], answer:[0],
  why:"Secondary containment such as a bund or drip tray catches leaks. For a single container it must be able to hold 110% of the container's capacity.", src:{ t:"GOV.UK Storing oil at a home or business", u:"https://www.gov.uk/guidance/storing-oil-at-a-home-or-business" }, status:"reviewed" },
{ id:"WE56", section:"we", topic:"Environment & waste", type:"single",
  q:"While stripping a roof you find bats roosting. What should you do?",
  options:["Stop work in that area, do not handle the bats, and report it","Carefully move them by hand to a nearby tree or bat box, then carry on","Carry on; bats will fly away","Block the gap so they cannot come back"], answer:[0],
  why:"All bat species and their roosts are legally protected. Disturbing them or damaging a roost can be an offence, so work must stop until advice is taken.", src:{ t:"Conservation of Habitats and Species Regulations 2017", u:"https://www.legislation.gov.uk/uksi/2017/1012" }, status:"reviewed" },
{ id:"WE57", section:"we", topic:"Environment & waste", type:"single",
  q:"Muddy water needs to be pumped out of an excavation. Where should it go?",
  options:["Only where it has been agreed and authorised, for example through a settlement tank; never straight into a drain or watercourse","Into the nearest road drain, as long as the water is pumped slowly to avoid flooding","Into a nearby stream, because running water will quickly dilute the silt","Onto a neighbour's land"], answer:[0],
  why:"Silty water can pollute rivers and harm wildlife. Discharges must be planned and authorised, often using settlement or treatment first.", src:L.hsg150, status:"reviewed" },
{ id:"WE58", section:"we", topic:"Environment & waste", type:"single",
  q:"How can you help reduce waste on site?",
  options:["Order and use only what is needed, protect materials from damage, and reuse offcuts where possible","Throw all offcuts into the nearest skip to keep the work area tidy","Leave materials uncovered in the rain","Order extra of everything just in case, and store the surplus outside"], answer:[0],
  why:"Good storage, careful ordering and reuse reduce waste, cost and landfill.", src:L.epa, status:"reviewed" },
{ id:"WE59", section:"we", topic:"Site rules & communication", type:"single",
  q:"Scenario: A new starter in your gang does not speak much English and seems unsure what to do. What is the best action?",
  options:["Tell your supervisor so arrangements can be made to make sure they understand instructions and safety information","Leave them to copy what others do; they will pick it up in time","Give them the easiest job and say nothing","Tell them to go home"], answer:[0],
  why:"Everyone must be given information and instruction they can understand. Supervisors can arrange translated material, interpreters or buddying.", src:L.cdm, status:"reviewed" },
{ id:"WE60", section:"we", topic:"Legal duties", type:"single",
  q:"Scenario: You are self-employed and working on a site. Do you have health and safety duties?",
  options:["Yes; you must work safely and not put yourself or others at risk","No; only employers and their employees have legal duties under the Act","Only if you employ other people","Only on large projects"], answer:[0],
  why:"Self-employed workers whose work may put others at risk have duties under health and safety law, and CDM 2015 applies to everyone doing construction work.", src:L.hswa, status:"reviewed" },
/* ---------- v2: Occupational health ---------- */
{ id:"OH16", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Which is the better way to clean up fine dust after cutting blocks indoors?",
  options:["Use a suitable dust-extracting vacuum (e.g. M- or H-class) or wet methods","Dry sweep it with a stiff broom, then bag it up","Blow it away with compressed air so the whole area clears of dust much more quickly","Leave it for the cleaners"], answer:[0],
  why:"Dry sweeping and compressed air throw fine silica dust back into the air you breathe. Use a suitable vacuum or wet cleaning.", src:L.coshh, status:"reviewed" },
{ id:"OH17", section:"oh", topic:"Dust & fumes", type:"single", fact:true,
  q:"What type of respiratory protection is normally recommended for high-dust tasks such as cutting concrete, where RPE is needed?",
  options:["A properly fitted FFP3 mask or equivalent, as specified in the risk assessment","A paper 'nuisance dust' mask, changed every hour","A scarf over the nose and mouth","No mask, if you hold your breath while cutting"], answer:[0],
  why:"HSE guidance for construction dust is usually FFP3 or equivalent RPE, face-fit tested for tight-fitting masks, alongside controls at source.", src:L.rpe, status:"reviewed" },
{ id:"OH18", section:"oh", topic:"Dust & fumes", type:"single",
  q:"What is a face-fit test?",
  options:["A test to check a tight-fitting mask seals properly on your face","A test of how well you can see clearly through your safety goggles or glasses","A medical examination of your lungs","A check that your mask is the right colour"], answer:[0],
  why:"Faces differ in shape and size. A face-fit test by a competent person checks that a particular tight-fitting mask model seals on your face.", src:L.rpe, status:"reviewed" },
{ id:"OH19", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Why should petrol-driven equipment (such as a generator or cut-off saw) never be run in an enclosed space?",
  options:["The exhaust contains carbon monoxide, a poisonous gas you cannot see or smell","It will overheat because there is not enough cool air to keep the engine running","The noise level becomes too high, even with hearing protection","It uses more fuel"], answer:[0],
  why:"Carbon monoxide builds up quickly in enclosed spaces and can kill without warning.", src:L.coshh, status:"reviewed" },
{ id:"OH20", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Breathing in hardwood dust over a long period can cause which serious illness?",
  options:["Nasal cancer","Hand-arm vibration syndrome","Tinnitus","Weil's disease"], answer:[0],
  why:"Hardwood dust can cause cancer of the nose and asthma. Use extraction and suitable RPE when cutting or sanding wood.", src:L.coshh, status:"reviewed" },
{ id:"OH21", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Which statement about welding fume is correct?",
  options:["All welding fume, including from mild steel, can cause lung cancer and needs to be controlled","Welding fume is harmless outdoors in all conditions","Only fume from stainless steel is harmful; mild steel fume is safe","A dust mask designed for sawdust is always enough"], answer:[0],
  why:"HSE advises that all welding fume can cause lung cancer. Indoors, local exhaust ventilation is usually needed, with suitable RPE where exposure remains.", src:L.coshh, status:"reviewed" },
{ id:"OH22", section:"oh", topic:"Dust & fumes", type:"single",
  q:"You are removing old paint that may contain lead. Which precaution is important?",
  options:["Avoid eating, drinking or smoking in the work area and wash before breaks","Dry sand the paint quickly to finish sooner","Burn it off in a confined space","Take your work clothes home each day to wash them with the family's laundry"], answer:[0],
  why:"Lead is mainly swallowed or breathed in. Good hygiene, controlled removal methods and keeping work clothing separate reduce exposure.", src:L.lead, status:"reviewed" },
{ id:"OH23", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Diesel exhaust fumes from site plant can be harmful. What is the best way to reduce exposure in a basement?",
  options:["Avoid running diesel engines there, or provide good ventilation and extraction","Open one door slightly and keep the engines running","Wear a nuisance dust mask, which filters out most of the harmful exhaust gases","Keep working until you feel unwell"], answer:[0],
  why:"Diesel exhaust can irritate the lungs and long-term exposure is linked to cancer. Keep engines out of enclosed areas where possible, or ventilate them well.", src:{ t:"HSE Construction: health risks", u:"https://www.hse.gov.uk/construction/healthrisks/" }, status:"reviewed" },
{ id:"OH24", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Before putting on a tight-fitting reusable respirator, what should you check?",
  options:["That it is clean, undamaged, has the correct filters, and seals properly when you do a fit check","Only that it is your size, as the filters last for months","That it has been used before","Nothing, as long as someone checked it yesterday"], answer:[0],
  why:"RPE must be checked before each use. Damaged parts, the wrong filters or a poor seal mean it will not protect you.", src:L.rpe, status:"reviewed" },
{ id:"OH25", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Why might your employer arrange health surveillance, such as lung function tests, for you?",
  options:["To detect early signs of work-related ill health so action can be taken","To decide which pay grade and which job role you should be given next year","To check whether you smoke","To check how physically fit you are for heavy work"], answer:[0],
  why:"Health surveillance helps spot early signs of ill health caused by work, so exposure can be reduced before the damage gets worse.", src:L.coshh, status:"reviewed" },
{ id:"OH26", section:"oh", topic:"Asbestos", type:"single",
  q:"Which diseases can be caused by breathing in asbestos fibres?",
  options:["Mesothelioma, asbestosis and lung cancer","Tinnitus and hearing loss","Dermatitis","Hand-arm vibration syndrome"], answer:[0],
  why:"Asbestos fibres can cause mesothelioma, asbestos-related lung cancer, asbestosis and pleural thickening. These diseases usually take decades to appear, and there is no cure.", src:L.asb, status:"reviewed" },
{ id:"OH27", section:"oh", topic:"Asbestos", type:"single",
  q:"Why is asbestos exposure so dangerous even if you feel fine at the time?",
  options:["The diseases it causes often take many years to develop, and by then it is too late","Asbestos causes immediate burns and breathing difficulties","Asbestos is only dangerous if you swallow it","It is not dangerous if you feel fine"], answer:[0],
  why:"You cannot see, smell or feel asbestos fibres, and illness typically appears decades later.", src:L.asb, status:"reviewed" },
{ id:"OH28", section:"oh", topic:"Asbestos", type:"multi",
  q:"Which TWO of these could contain asbestos in an older building?",
  options:["Textured decorative ceiling coatings","Pipe lagging","New plasterboard installed last year","Modern PVC window frames","Concrete poured last month"], answer:[0,1],
  why:"Asbestos was used in many products including textured coatings, pipe lagging, insulating board, cement sheets and floor tiles.", src:L.asb, status:"reviewed" },
{ id:"OH29", section:"oh", topic:"Asbestos", type:"single",
  q:"You have been asked to drill into walls in an office built in the 1980s. What should you check first?",
  options:["The asbestos register or survey, to find out whether asbestos is present where you will drill","Nothing, because offices were never built using asbestos","Whether the paint is dry and the wall is clean","Whether the wall is load-bearing only"], answer:[0],
  why:"Buildings built before 2000 may contain asbestos. The person managing the building should have information on where it is. Check before you disturb anything.", src:L.asb, status:"reviewed" },
{ id:"OH30", section:"oh", topic:"Asbestos", type:"single",
  q:"Who should remove damaged asbestos pipe lagging?",
  options:["A contractor licensed by HSE for asbestos work","Any worker wearing a dust mask","The site labourer, if they are careful and wear a mask","The building owner"], answer:[0],
  why:"Most work with high-risk asbestos materials, such as lagging and sprayed coatings, must be carried out by HSE-licensed contractors.", src:L.asb, status:"reviewed" },
{ id:"OH31", section:"oh", topic:"Asbestos", type:"single",
  q:"Why do workers who might disturb asbestos need asbestos awareness training?",
  options:["So they know where it may be found and what to do if they find it","So they can safely remove any type of asbestos themselves without a licence","Because it is needed for a driving licence","It is only required for managers"], answer:[0],
  why:"The Control of Asbestos Regulations require training for anyone liable to disturb asbestos, so they can avoid exposure and act correctly if they find it.", src:L.asb, status:"reviewed" },
{ id:"OH32", section:"oh", topic:"Asbestos", type:"single",
  q:"You accidentally break an old board and think it may contain asbestos. Dust has settled on your clothes. What should you do?",
  options:["Stop, keep others away, avoid spreading the dust, and report it immediately for advice on decontamination","Brush your clothes down outside and carry on with the job","Shake your clothes out in the fresh air","Go home and wash your clothes separately at a high temperature"], answer:[0],
  why:"Brushing or shaking contaminated clothing spreads fibres. Stop work, keep others away and get advice so decontamination can be done properly.", src:L.asb, status:"reviewed" },
{ id:"OH33", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Noise-induced hearing loss is:",
  options:["Permanent; it cannot be cured","Always temporary","Only caused by very sudden noises","Cured by rest"], answer:[0],
  why:"Damage from excessive noise builds up gradually and is permanent. Tinnitus can also be permanent.", src:L.noise, status:"reviewed" },
{ id:"OH34", section:"oh", topic:"Noise & vibration", type:"single",
  q:"How should foam earplugs be fitted?",
  options:["Roll them thin with clean hands and insert them well into the ear canal, holding them until they expand","Push them just into the entrance of the ear so they are easy to remove","Cut them in half so they fit more comfortably in the ear","Only put one in"], answer:[0],
  why:"Poorly fitted earplugs give much less protection. Follow the maker's instructions and use clean hands.", src:L.noise, status:"reviewed" },
{ id:"OH35", section:"oh", topic:"Noise & vibration", type:"single", fact:true,
  q:"If a noise level increases by 3 dB, what happens to the noise energy?",
  options:["It doubles","It increases by 3%","It stays about the same","It halves"], answer:[0],
  why:"The decibel scale is logarithmic. A 3 dB increase doubles the noise energy, so small increases in level make a big difference to risk.", src:L.noise, status:"reviewed" },
{ id:"OH36", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Why might your employer arrange regular hearing tests for you?",
  options:["As health surveillance to spot early hearing damage from noise at work","To check you can clearly hear instructions given over the site radio system","Because everyone must have one each week","To decide which job you get"], answer:[0],
  why:"Employers must provide health surveillance where workers are at risk from noise, to detect early damage so action can be taken.", src:L.noise, status:"reviewed" },
{ id:"OH37", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Your exposure to hand-arm vibration depends mainly on:",
  options:["How strongly the tool vibrates and how long you use it for","The colour of the tool","Whether it is battery or mains powered, and nothing else matters","How old you are"], answer:[0],
  why:"Daily vibration exposure depends on the vibration magnitude of the tool and the trigger time. Reducing either reduces risk.", src:L.vib, status:"reviewed" },
{ id:"OH38", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Why should drill bits and chisels be kept sharp?",
  options:["Blunt tools take longer and vibrate more, increasing your exposure","Sharp tools are lighter and easier to carry","It is only for a neater finish on the work","Blunt tools are quieter"], answer:[0],
  why:"Maintaining tools and consumables reduces vibration and the time needed to do the job.", src:L.vib, status:"reviewed" },
{ id:"OH39", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Regularly driving a dumper or roller over rough ground can cause which problem?",
  options:["Back pain from whole-body vibration","Vibration white finger affecting the feet","Tinnitus only","Dermatitis"], answer:[0],
  why:"Whole-body vibration and shocks from driving over rough ground are linked to back pain. Good seats, well-maintained ground and appropriate speeds help.", src:L.vib, status:"reviewed" },
{ id:"OH40", section:"oh", topic:"Noise & vibration", type:"single",
  q:"You have been using vibrating tools for years and have started to get tingling in your fingers at night. What should you do?",
  options:["Report it to your employer and see a doctor or occupational health","Keep quiet in case you lose your job","Wear thicker gloves and carry on as normal","Use the tools more to toughen up your hands"], answer:[0],
  why:"Tingling and numbness can be early signs of HAVS or carpal tunnel syndrome. Early reporting allows action before the condition becomes permanent.", src:L.vib, status:"reviewed" },
{ id:"OH41", section:"oh", topic:"Manual handling", type:"single", fact:true,
  q:"When assessing a manual handling task, what does TILE stand for?",
  options:["Task, Individual, Load, Environment","Time, Instruction, Lift, Effort","Training, Inspection, Lifting, Equipment","Tools, Injury, Location, Exposure"], answer:[0],
  why:"HSE uses TILE to help assess manual handling risks: the task, the individual doing it, the load and the environment.", src:L.mh, status:"reviewed" },
{ id:"OH42", section:"oh", topic:"Manual handling", type:"single",
  q:"Two people are carrying a long, heavy load together. What makes the lift safer?",
  options:["Planning the route and having one person give clear instructions so you lift and move together","Each person lifting when they feel ready, so nobody is rushed","The stronger person taking most of the weight at the heavier end","Moving as quickly as possible"], answer:[0],
  why:"Team lifts need planning, a clear route and one person coordinating, so the load is shared and moved together.", src:L.mh, status:"reviewed" },
{ id:"OH43", section:"oh", topic:"Manual handling", type:"single",
  q:"If you have to move a load on a trolley, is it usually better to push or pull?",
  options:["Push, as it is generally easier on the body and you can see where you are going","Pull, because you can use your whole body weight by leaning back into it as you go","It makes no difference","Carry the load instead of using a trolley"], answer:[0],
  why:"Pushing is generally preferable to pulling. Use a well-maintained trolley and keep routes clear and level.", src:L.mh, status:"reviewed" },
{ id:"OH44", section:"oh", topic:"Manual handling", type:"single",
  q:"Your back has been aching after lifting on site for a few weeks. What should you do?",
  options:["Report it early so the task and your health can be looked at","Ignore it; aches are part of the job","Take painkillers and lift heavier items to strengthen your back","Wait until it stops you working"], answer:[0],
  why:"Musculoskeletal disorders are among the most common work-related ill health in construction. Reporting early means the work can be changed before a serious injury develops.", src:L.mh, status:"reviewed" },
{ id:"OH45", section:"oh", topic:"Manual handling", type:"single",
  q:"Why should you avoid carrying heavy or awkward loads up ladders?",
  options:["You cannot keep a good handhold and could easily lose your balance and fall","Ladders are only rated for your body weight","It is slower than using a hoist or gin wheel","It damages the rungs"], answer:[0],
  why:"Carrying loads on ladders means you cannot maintain a safe handhold. Use a hoist, gin wheel or other lifting method.", src:L.ladder, status:"reviewed" },
{ id:"OH46", section:"oh", topic:"Manual handling", type:"single",
  q:"Which of these helps reduce the risk of manual handling injury?",
  options:["Breaking a load down into smaller parts, or ordering materials in smaller, lighter packs","Stacking materials at floor level so you have to bend down","Lifting from above shoulder height","Carrying loads over long distances"], answer:[0],
  why:"Reducing the weight or size of loads, and storing them at waist height, reduces strain on the body.", src:L.mh, status:"reviewed" },
{ id:"OH47", section:"oh", topic:"Manual handling", type:"single",
  q:"Before lifting a load you are unsure about, what should you do?",
  options:["Check its weight and condition, plan the route, and get help or a lifting aid if needed","Lift it quickly to test the weight, then put it straight down again if it feels too heavy","Kick it to see if it moves","Ask someone to watch you lift it in case you drop it"], answer:[0],
  why:"Planning a lift, knowing the weight, checking for sharp edges and making sure the route is clear all reduce the chance of injury.", src:L.mh, status:"reviewed" },
{ id:"OH48", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"A workmate has seemed withdrawn for weeks and says they are really struggling. What is a good first step?",
  options:["Find a quiet moment to talk, listen without judging, and encourage them to get support","Tell everyone on site so they know","Leave it; they will talk to a manager if they want help","Tell them to cheer up and keep busy to take their mind off it"], answer:[0],
  why:"Mental ill health is common in construction. Listening and encouraging someone to get help (for example a mental health first aider, their GP or an employee assistance line) can make a big difference.", src:L.stress, status:"reviewed" },
{ id:"OH49", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Why should you cover up and use sunscreen when working outside in summer?",
  options:["Exposure to UV from the sun can cause skin cancer","It is only about comfort","UV only affects you on very hot, cloudless summer days","Sunscreen stops dehydration"], answer:[0],
  why:"Outdoor workers are at higher risk of skin cancer. Cover up, use high-factor sunscreen, take breaks in the shade and check your skin for changes.", src:L.skin, status:"reviewed" },
{ id:"OH50", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Your doctor has prescribed medicine that may make you drowsy. You drive a dumper at work. What should you do?",
  options:["Tell your supervisor, so they can decide whether you can safely do that work","Keep quiet and drink strong coffee to stay alert","Stop taking the medicine","Carry on, but drive more slowly than usual"], answer:[0],
  why:"Some medicines affect your ability to work safely, especially in safety-critical work like operating plant. Tell your supervisor and follow medical advice.", src:L.drugs, status:"reviewed" },
{ id:"OH51", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"What is the best way to prevent work-related dermatitis?",
  options:["Avoid skin contact with harmful substances, protect your skin with suitable gloves, and check your skin regularly","Wash your hands with solvents","Only wear gloves once your hands are already sore or cracked","Use barrier cream instead of gloves, as it lasts all day"], answer:[0],
  why:"HSE's 'avoid, protect, check' approach reduces skin problems. Barrier creams are not a substitute for gloves.", src:L.skin, status:"reviewed" },
{ id:"OH52", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"On a very hot day, which of these helps prevent heat-related illness?",
  options:["Drinking water regularly and taking breaks in the shade","Removing your safety helmet and other PPE to keep cool","Working faster to finish before the hottest part of the day","Drinking energy drinks only"], answer:[0],
  why:"Heat can cause dehydration, heat exhaustion and heat stroke. Drink water, take breaks in the shade, and tell your supervisor if you feel unwell.", src:L.hsg150, status:"reviewed" },
{ id:"OH53", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Why is working very long hours without proper rest a health and safety risk?",
  options:["Fatigue slows reactions and affects judgement, increasing the chance of accidents","It is only a risk for people who work at a computer all day","It only matters for night shifts","It has no effect on safety as long as you are physically fit and used to the work"], answer:[0],
  why:"Tired workers make more mistakes. Fatigue is a particular risk for plant operators and drivers.", src:L.hsg150, status:"reviewed" },
{ id:"OH54", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Many sites carry out drug and alcohol testing. Why?",
  options:["Being under the influence puts the worker and others at serious risk, especially in safety-critical work","To catch people out for disciplinary reasons only","Because the law requires every worker in the UK to be tested","To check workers' general fitness and diet"], answer:[0],
  why:"Drugs and alcohol affect judgement and coordination. Employers have a duty to manage the risk, and many sites have testing policies.", src:L.drugs, status:"reviewed" },
{ id:"OH55", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Working near sewage or in drains can expose you to harmful micro-organisms. Which precaution is important?",
  options:["Wear suitable gloves, cover cuts, and wash your hands thoroughly before eating, drinking or smoking","Rinse your hands in the drain water before touching anything clean","Eat lunch at the work area to save time","Only wear gloves in summer, when bacteria are most active"], answer:[0],
  why:"Good hygiene and PPE prevent infections such as leptospirosis and hepatitis A.", src:L.lepto, status:"reviewed" },
{ id:"OH56", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Why is it important to report ill health you think is caused by work?",
  options:["So the cause can be controlled before it gets worse for you and others","It is not important unless you need time off work","Only so you can claim compensation","So you can have paid time off work while the problem is being looked into"], answer:[0],
  why:"Many work-related illnesses develop slowly. Early reporting allows changes to the work and support for you.", src:L.hswa, status:"reviewed" },
{ id:"OH57", section:"oh", topic:"Dust & fumes", type:"single",
  q:"Which order of controls should be followed to protect you from construction dust?",
  options:["Stop or reduce dust at source first (e.g. different methods, water, extraction), then use RPE for any remaining risk","Wear a mask first, and add other controls only if the mask is uncomfortable","Only work outdoors","Open a window and carry on, as fresh air removes most of the dust"], answer:[0],
  why:"COSHH requires exposure to be prevented or controlled at source before relying on RPE, which is the last line of defence.", src:L.coshh, status:"reviewed" },
{ id:"OH58", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Which of these may be signs that someone is suffering from stress?",
  options:["Changes in mood or behaviour, poor sleep and difficulty concentrating","Being cheerful, sociable and always keen to take on extra work and overtime","Arriving on time","Asking for training and arriving early every day"], answer:[0],
  why:"Stress can show as changes in behaviour, mood, sleep and concentration. It should be taken seriously and talked about.", src:L.stress, status:"reviewed" },
{ id:"OH59", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"You cut your hand at work. What should you do to reduce the risk of infection?",
  options:["Clean and cover it with a waterproof dressing and report it","Leave it open to the air so it heals faster while you work in mud","Wait until the end of the shift","Rub cement dust into it to seal it"], answer:[0],
  why:"Open cuts let in bacteria from soil, water and sewage. Clean and cover cuts, and record the injury.", src:L.fa, status:"reviewed" },
{ id:"OH60", section:"oh", topic:"Noise & vibration", type:"single",
  q:"Why should you keep your hands warm and dry when using vibrating tools?",
  options:["Cold reduces blood flow and can make HAVS symptoms worse","It makes the tool quieter and easier to control","It stops the tool slipping only","It only matters for comfort and grip, not for your long-term health"], answer:[0],
  why:"Keeping warm helps maintain blood circulation and can reduce the risk and effects of HAVS. Warm clothing and gloves help.", src:L.vib, status:"reviewed" },

  options:["This sign bans forklifts; the yellow triangle warns that forklifts are operating","They mean the same thing","This sign warns of forklifts; the yellow triangle bans them","This red sign is for drivers only; the yellow triangle sign is for pedestrians only"], answer:[0],

/* ---------- v2: Safety (fire, electrical, tools, PPE, housekeeping) ---------- */
{ id:"SA45", section:"sa", topic:"Fire prevention", type:"single",
  q:"Why must LPG cylinders never be stored in basements, excavations or near drains?",
  options:["LPG is heavier than air, so leaking gas collects in low places where it can ignite or suffocate people","LPG is lighter than air and would escape upwards before anyone noticed","Cold, damp ground makes the cylinder walls corrode and crack","It makes the cylinders harder to count"], answer:[0],
  why:"LPG vapour is heavier than air and sinks into low-lying areas such as basements, drains and excavations, where it can build up to an explosive level. Store cylinders upright, outdoors, in a secure, well-ventilated place.", src:L.hsg168, status:"reviewed" },
{ id:"SA46", section:"sa", topic:"Fire prevention", type:"single",
  q:"A fire exit route in the building you are working in is being used to store materials. What should you do?",
  options:["Report it so the route can be cleared straight away; escape routes must be kept clear","Leave it; it will only be there for a few days","Put a sign on the materials saying 'fire exit'","Move the fire exit sign to another nearby door that is still clear of stored materials"], answer:[0],
  why:"Escape routes and fire exits must be kept clear at all times so people can get out quickly in an emergency.", src:L.hsg168, status:"reviewed" },
{ id:"SA47", section:"sa", topic:"Fire prevention", type:"single",
  q:"Someone has wedged a fire door open to make it easier to carry materials through. Why is this a problem?",
  options:["Fire doors must close to stop fire and smoke spreading along escape routes","It is not a problem while people are working","It wastes heat and lets dust into other areas","It only matters at night"], answer:[0],
  why:"Fire doors protect escape routes by holding back fire and smoke. Wedging them open defeats their purpose.", src:L.hsg168, status:"reviewed" },
{ id:"SA48", section:"sa", topic:"Fire prevention", type:"single",
  q:"You discover a small fire in a waste bin. You have been trained to use an extinguisher. What should you do first?",
  options:["Raise the alarm","Try to put it out before telling anyone","Carry the bin outside","Go and find your supervisor"], answer:[0],
  why:"Always raise the alarm first. Only then tackle a small fire, and only if you are trained, it is safe and you have a clear escape route behind you.", src:L.hsg168, status:"reviewed" },
{ id:"SA49", section:"sa", topic:"Fire prevention", type:"single",
  q:"What is the purpose of a flashback arrestor on oxy-fuel (e.g. oxy-acetylene) welding and cutting equipment?",
  options:["To stop a flame travelling back into the hoses and cylinders","To make the flame hotter and easier to control when cutting thick steel","To show how much gas is left in each cylinder","To stop the hoses tangling"], answer:[0],
  why:"Flashback arrestors stop a flame front travelling back up the hoses towards the regulators and cylinders, which could cause an explosion.", src:L.hsg168, status:"reviewed" },
{ id:"SA50", section:"sa", topic:"Electrical safety", type:"single",
  q:"You are using a 230 V tool through a plug-in RCD (residual current device). What should you do before starting work?",
  options:["Press the RCD's test button to check it trips","Nothing; RCDs never fail","Tape over the test button so it cannot be pressed by accident","Use the tool without the RCD if it keeps tripping"], answer:[0],
  why:"An RCD can reduce the risk of a fatal shock, but only if it works. Check it with its test button before use, and do not use it if it fails to trip.", src:L.hsg141, status:"reviewed" },
{ id:"SA51", section:"sa", topic:"Electrical safety", type:"single",
  q:"What is the safest way to route extension leads across a work area?",
  options:["Keep them off the floor, for example along walls or overhead, away from walkways","Run them across the middle of walkways so that everyone can clearly see them there","Cover them with loose boards","Run them through puddles if they are waterproof"], answer:[0],
  why:"Trailing cables are a trip hazard and are easily damaged by traffic and materials. Route them where they are protected and out of the way.", src:L.hsg141, status:"reviewed" },
{ id:"SA52", section:"sa", topic:"Electrical safety", type:"single",
  q:"Why are battery-powered tools often a safer choice on site?",
  options:["There are no trailing mains cables, reducing trip hazards and the risk of electric shock","Batteries never need charging during a normal shift","They are always more powerful","They do not need to be checked before each use, because they only run at a low voltage"], answer:[0],
  why:"Cordless tools remove trailing leads and use low voltages, so the risks of tripping, cable damage and serious shock are reduced.", src:L.hsg141, status:"reviewed" },
{ id:"SA53", section:"sa", topic:"Electrical safety", type:"single",
  q:"While digging, you notice a colleague's excavator has struck a buried cable and sparks are coming from it. What should you do?",
  options:["Keep well away, keep others away and report it immediately; assume the cable is live","Pull the cable out of the way with your hands","Cover it with soil","Tell the driver to keep digging carefully around the cable"], answer:[0],
  why:"A damaged cable may still be live and can kill. Keep everyone clear and report it so the owner can make it safe.", src:L.hsg47, status:"reviewed" },
{ id:"SA54", section:"sa", topic:"Tools & equipment", type:"single",
  q:"What should you do before using any power tool?",
  options:["Check it is in good condition, with guards fitted and no visible damage","Only check it if it is brand new or has just come back from being repaired","Check it only if it has been dropped","Nothing, as the storeman checks all tools"], answer:[0],
  why:"PUWER requires work equipment to be maintained in a safe condition. A quick pre-use check spots damage, missing guards and faults before they cause injury.", src:L.puwer, status:"reviewed" },
{ id:"SA55", section:"sa", topic:"Tools & equipment", type:"single",
  q:"Every abrasive wheel or cutting disc is marked with a maximum speed. Why?",
  options:["The machine must never run the disc faster than this, or it may shatter","It shows the recommended cutting speed for beginners, trainees and apprentices","It shows the speed of the motor","It is only for recycling purposes"], answer:[0],
  why:"Discs can burst if run above their rated speed. The machine's speed must not exceed the maximum speed marked on the disc.", src:L.puwer, status:"reviewed" },
{ id:"SA56", section:"sa", topic:"Tools & equipment", type:"single",
  q:"Who may use a cartridge-operated fixing tool (a nail gun that uses cartridges)?",
  options:["Only people who have been trained and authorised to use it","Anyone over 18 who has used a nail gun before on another site","Anyone who has watched it being used","Anyone wearing eye protection"], answer:[0],
  why:"Cartridge tools can cause serious injury. Only trained, competent and authorised people should use them.", src:L.puwer, status:"reviewed" },
{ id:"SA57", section:"sa", topic:"Tools & equipment", type:"single",
  q:"When should you NOT wear loose gloves?",
  options:["When using machinery with rotating parts, such as a pillar drill, where they could get caught","When handling rough-sawn timber that could give you splinters","When mixing wet cement or mortar by hand","When using a shovel"], answer:[0],
  why:"Loose gloves can be caught by rotating parts and drag your hand in. Follow the risk assessment for the machine you are using.", src:L.puwer, status:"reviewed" },
{ id:"SA58", section:"sa", topic:"PPE", type:"single",
  q:"In the hierarchy of controls, where does personal protective equipment (PPE) come?",
  options:["Last, after risks have been removed or controlled in other ways","First, because it is the quickest control","It is used instead of a risk assessment","It is only needed after an accident has already happened on that task"], answer:[0],
  why:"PPE is a last resort. It only protects the wearer, and only if it is right for the job, fits and is worn properly. Eliminating or controlling the hazard at source comes first.", src:L.ppe, status:"reviewed" },
{ id:"SA59", section:"sa", topic:"PPE", type:"single",
  q:"You are wearing ear defenders in a noisy area. When is it acceptable to take them off?",
  options:["Only when you have left the noisy area","Whenever you need to talk to someone","For a few minutes every hour to rest your ears","When your supervisor is not around"], answer:[0],
  why:"Removing hearing protection even for short periods in a noisy area greatly reduces the protection it gives. Keep it on until you are out of the noise.", src:L.noise, status:"reviewed" },
{ id:"SA60", section:"sa", topic:"PPE", type:"multi",
  q:"Which TWO of these would make your high-visibility clothing less effective?",
  options:["It is dirty or faded","It is covered by a coat","It is the correct size and fastened","It is clean and in good condition","It meets the standard required on site"], answer:[0,1],
  why:"Hi-vis only works if it can be seen. Dirty, faded or covered hi-vis clothing does not make you visible to drivers and plant operators.", src:L.ppe, status:"reviewed" },
{ id:"SA61", section:"sa", topic:"PPE", type:"single",
  q:"You are about to use a chemical that can splash. Which eye protection is most suitable?",
  options:["Chemical splash goggles that seal around the eyes","Sunglasses","Ordinary prescription glasses","No eye protection is needed if you work slowly and carefully"], answer:[0],
  why:"Different tasks need different eye protection. Goggles that seal around the eyes protect against splashes; the safety data sheet and COSHH assessment should state what is needed.", src:L.coshh, status:"reviewed" },
{ id:"SA62", section:"sa", topic:"Tools & equipment", type:"single",
  q:"Slips and trips are one of the most common causes of injury on site. What is the most effective way to prevent them?",
  options:["Good housekeeping: keeping walkways clear and tidying as you go","Wearing gloves and safety boots at all times","Walking faster through cluttered areas","Putting up more warning signs around the site and at the main gate"], answer:[0],
  why:"Keeping access routes clear, storing materials properly, removing waste and cleaning up spills stop most slips and trips.", src:L.hsg150, status:"reviewed" },
/* ---------- v2: High-risk activities ---------- */
{ id:"HR17", section:"hr", topic:"Working at height", type:"single", fact:true,
