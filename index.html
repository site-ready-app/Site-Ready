  q:"On a working platform, what is the minimum height of the top guard rail required by the Work at Height Regulations?",
  options:["950 mm","500 mm","750 mm","1500 mm"], answer:[0],
  why:"The top guard rail must be at least 950 mm above the edge, with intermediate guard rails so that any unprotected gap is no more than 470 mm, plus toe boards.", src:L.wah, status:"reviewed" },
{ id:"HR18", section:"hr", topic:"Working at height", type:"single",
  q:"What is the purpose of toe boards on a scaffold platform?",
  options:["To stop tools and materials falling off the edge onto people below","To give you something to rest your feet on","To make the scaffold platform stronger and stiffer along the outer edges","To mark the edge in the dark"], answer:[0],
  why:"Toe boards, along with brick guards where needed, prevent objects falling from the platform.", src:L.wah, status:"reviewed" },
{ id:"HR19", section:"hr", topic:"Working at height", type:"single",
  q:"Who should put up, alter or take down a mobile access tower?",
  options:["Only people trained and competent to do so, following the manufacturer's instructions","Anyone who is going to work on it, as they know exactly what height they will need","The first person to arrive on site","Any two people working together, so one can hold it steady"], answer:[0],
  why:"Towers must be erected by competent, trained people using the manufacturer's instructions, with all required parts, braces and outriggers fitted.", src:L.wah, status:"reviewed" },
{ id:"HR20", section:"hr", topic:"Working at height", type:"single",
  q:"Someone wants to move a mobile tower while a worker is still on the platform. What is correct?",
  options:["Never move a tower with anyone or any materials on it","It is fine if they move it slowly on firm, level ground with a helper","It is fine if the worker holds on","It is fine on level ground"], answer:[0],
  why:"Moving a tower with people or materials on it can cause it to overturn. Everyone and everything must come off first.", src:L.wah, status:"reviewed" },
{ id:"HR21", section:"hr", topic:"Working at height", type:"single",
  q:"Before you climb a mobile tower, what should you check?",
  options:["That the wheels are locked, outriggers are fitted as required, and guard rails and toe boards are in place","Only that it reaches the height you need to work at","That it has been painted","Nothing, as long as someone else put it up earlier that day"], answer:[0],
  why:"Unlocked wheels, missing outriggers or missing edge protection are common causes of tower accidents. Check before use and look for an inspection record.", src:L.wah, status:"reviewed" },
{ id:"HR22", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"If a ladder's landing point has no other handhold, how far should the ladder extend above it?",
  options:["At least 1 metre","At least 10 cm","It should stop level with the landing","At least 3 metres"], answer:[0],
  why:"HSE guidance is that access ladders should extend at least 1 m above the landing point, unless there is another suitable handhold.", src:L.ladder, status:"reviewed" },
{ id:"HR23", section:"hr", topic:"Working at height", type:"single",
  q:"What should you do before using a ladder?",
  options:["Carry out a pre-use check of the stiles, rungs and feet for damage","Check only that it is long enough to reach the landing with a bit to spare","Paint it so damage is hidden","Nothing, if it was used without problems yesterday"], answer:[0],
  why:"Damaged stiles, bent or missing rungs and worn feet cause ladder accidents. Check before use and take damaged ladders out of service.", src:L.ladder, status:"reviewed" },
{ id:"HR24", section:"hr", topic:"Working at height", type:"single",
  q:"While working on a ladder, what does 'three points of contact' mean?",
  options:["Keeping two feet and one hand (or your body, where both hands are needed briefly) in contact with the ladder","Having three people nearby: one to foot the ladder and two to pass materials","Tying the ladder at the top, middle and bottom","Resting the ladder against three rungs"], answer:[0],
  why:"Maintaining three points of contact helps you keep your balance. Don't overreach; keep your belt buckle within the stiles.", src:L.ladder, status:"reviewed" },
{ id:"HR25", section:"hr", topic:"Working at height", type:"single",
  q:"What is the difference between a work restraint system and a fall arrest system?",
  options:["Restraint stops you reaching a point where you could fall; fall arrest stops you after you have fallen","They are the same thing","Fall arrest stops you reaching the edge; restraint catches you","Restraint is for ladders only"], answer:[0],
  why:"Preventing a fall (restraint) is better than arresting one. Fall arrest needs enough clearance below and a rescue plan.", src:L.wah, status:"reviewed" },
{ id:"HR26", section:"hr", topic:"Working at height", type:"single",
  q:"What should you do before putting on a safety harness?",
  options:["Check the harness and lanyard for damage, and make sure you have been trained to use them","Nothing, if it looks new and still has its label","Only check the buckle","Borrow any harness that is nearby, as they are all the same"], answer:[0],
  why:"Harnesses must be checked before each use and users must be trained in fitting and using them. Damaged equipment may fail when needed.", src:L.wah, status:"reviewed" },
{ id:"HR27", section:"hr", topic:"Working at height", type:"single",
  q:"There is an opening in a floor slab covered by a board. What should the cover be like?",
  options:["Strong enough to take any load placed on it, fixed in place, and clearly marked to show there is a hole below","Any sheet of plywood laid loosely so it can be lifted quickly","Covered with a tarpaulin only","Painted the same colour as the floor so it blends in"], answer:[0],
  why:"Covers over openings must be strong, secured against displacement and clearly marked so nobody removes them or steps through.", src:L.wah, status:"reviewed" },
{ id:"HR28", section:"hr", topic:"Working at height", type:"single",
  q:"How should waste be removed from an upper floor of a building under construction?",
  options:["Using an enclosed chute or lowering it in a controlled way","Throwing it over the edge when someone has checked nobody is below","Dropping it down the stairwell","Leaving it until the building is finished"], answer:[0],
  why:"Dropping materials from height can kill people below. Use chutes, hoists or other controlled methods.", src:L.wah, status:"reviewed" },
{ id:"HR29", section:"hr", topic:"Working at height", type:"single",
  q:"You are working in a MEWP basket and the item you need is just out of reach. What should you do?",
  options:["Lower the platform and reposition the MEWP","Climb carefully onto the guard rails, holding on, to reach it","Lean over the side","Stand on a bucket inside the basket"], answer:[0],
  why:"Never climb on the guard rails or use objects to gain extra height in a MEWP. Reposition the machine instead.", src:L.wah, status:"reviewed" },
{ id:"HR30", section:"hr", topic:"Working at height", type:"single",
  q:"Strong winds pick up while you are working at height. What should happen?",
  options:["Work should be stopped if the weather makes it unsafe, following the risk assessment and equipment limits","Carry on, but tie down loose materials and hold on to the guard rails","Only stop if it starts raining heavily or there is lightning","Wind does not affect work at height"], answer:[0],
  why:"The Work at Height Regulations require work at height to be done only when weather conditions do not put health and safety at risk. MEWPs and towers have wind speed limits.", src:L.wah, status:"reviewed" },
{ id:"HR31", section:"hr", topic:"Working at height", type:"single",
  q:"Why are safety nets or airbags sometimes used under work at height?",
  options:["To reduce the distance and consequences of a fall if one happens","To stop tools rusting","To replace the need for any edge protection or guard rails in all cases","To keep birds away"], answer:[0],
  why:"Where falls cannot be prevented, measures such as nets and airbags minimise the distance and consequences of a fall.", src:L.wah, status:"reviewed" },
{ id:"HR32", section:"hr", topic:"Excavations & services", type:"single",
  q:"How can the sides of an excavation be prevented from collapsing?",
  options:["By shoring or trench support systems, or by battering the sides back to a safe angle","By piling the spoil right at the edge of the trench to hold the sides firmly in place","By working quickly","By only digging in dry weather, when the soil is firm"], answer:[0],
  why:"Excavations must be supported or battered back to a safe angle to prevent collapse. The method should be decided before digging starts.", src:L.hsg150, status:"reviewed" },
{ id:"HR33", section:"hr", topic:"Excavations & services", type:"single",
  q:"Why are barriers placed around the edge of an excavation?",
  options:["To stop people, vehicles and materials falling in","To mark clearly where the site boundary and the public footpath are","To stop rainwater getting in","To keep the soil warm"], answer:[0],
  why:"Guard rails or barriers prevent people falling in. Stop blocks prevent vehicles over-running the edge when tipping.", src:L.hsg150, status:"reviewed" },
{ id:"HR34", section:"hr", topic:"Excavations & services", type:"single",
  q:"Why are stop blocks placed near the edge of an excavation where dumpers tip?",
  options:["To stop the dumper running over the edge into the excavation","To mark where the dumper should park and wait after tipping its load","To support the sides of the excavation","To slow down pedestrians"], answer:[0],
  why:"Securely placed stop blocks prevent vehicles over-running the edge while tipping.", src:L.hsg150, status:"reviewed" },
{ id:"HR35", section:"hr", topic:"Excavations & services", type:"single",
  q:"How should you get in and out of an excavation?",
  options:["Using a properly secured ladder or other safe means of access","By climbing up the trench supports, which are designed to be strong","By jumping in","By sliding down the side"], answer:[0],
  why:"A safe means of access and egress must be provided. Climbing supports can dislodge them and cause a collapse.", src:L.hsg150, status:"reviewed" },
{ id:"HR36", section:"hr", topic:"Excavations & services", type:"single",
  q:"Why can the air at the bottom of a deep excavation be dangerous?",
  options:["Gases heavier than air, or a lack of oxygen, can build up in low places","The air is always much colder and damper down there, which can cause chills","Smoke from nearby bonfires always settles in them","It is never dangerous"], answer:[0],
  why:"Gases such as carbon dioxide, and fumes from nearby plant, can collect in excavations. Some deep excavations may count as confined spaces.", src:L.cs, status:"reviewed" },
{ id:"HR37", section:"hr", topic:"Excavations & services", type:"single",
  q:"Before starting to dig, what should be available to help avoid underground services?",
  options:["Up-to-date service plans, plus a trained person to locate services on site","Only a spade and a tape measure","A map of the local roads","Nothing, if you are only digging a shallow trench"], answer:[0],
  why:"HSG47 sets out three steps: plan the work (including obtaining service plans), locate and identify services, and dig safely.", src:L.hsg47, status:"reviewed" },
{ id:"HR38", section:"hr", topic:"Excavations & services", type:"single",
  q:"Near a located underground cable, how should you dig?",
  options:["Carefully by hand, using suitable hand tools, to expose the cable","With a breaker as fast as possible","With a mechanical excavator right up to the line marked on the ground","By driving a spike in to find it"], answer:[0],
  why:"Once services are located, careful hand digging with suitable tools is used to expose them. Plans and detectors are not always accurate.", src:L.hsg47, status:"reviewed" },
{ id:"HR39", section:"hr", topic:"Excavations & services", type:"single",
  q:"What makes a space a 'confined space' in health and safety terms?",
  options:["It is substantially enclosed and there is a serious risk from things like toxic gas, lack of oxygen, fire or drowning","It is any room smaller than 10 square metres with the door closed","It is any space below ground level, such as a basement or cellar","It is any space with only one door"], answer:[0],
  why:"Confined spaces include manholes, tanks, sewers and some excavations. Entry must be avoided if possible and otherwise carried out under a safe system of work by trained people.", src:L.cs, status:"reviewed" },
{ id:"HR40", section:"hr", topic:"Excavations & services", type:"single",
  q:"Who should enter a confined space such as a sewer?",
  options:["Only trained people, following a safe system of work with emergency rescue arrangements in place","Anyone who is available, as long as someone waits at the top","Anyone who has a torch and a mobile phone to call for help","Only the youngest workers"], answer:[0],
  why:"The Confined Spaces Regulations require a safe system of work, suitable training and emergency arrangements before anyone enters.", src:L.cs, status:"reviewed" },
{ id:"HR41", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"Who may operate plant such as an excavator or telehandler on site?",
  options:["Only people who are trained, competent and authorised to operate that type of plant","Anyone who holds a full car driving licence","Anyone who has watched it being used","Anyone the foreman gives the keys to, if the usual trained operator is off sick that day"], answer:[0],
  why:"Plant operators must be trained, competent and authorised for the specific type of machine they use.", src:L.puwer, status:"reviewed" },
{ id:"HR42", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"Why should you try to make eye contact with the driver before passing near moving plant?",
  options:["So you know the driver has seen you; plant has large blind spots","It is good manners and helps build a good site atmosphere","So the driver can wave","It is not necessary if you are wearing clean high-visibility clothing"], answer:[0],
  why:"Drivers of large plant often cannot see people close to the machine. Never assume you have been seen.", src:L.trans, status:"reviewed" },
{ id:"HR43", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"Why is a trained vehicle marshal (signaller) used for reversing vehicles?",
  options:["Reversing vehicles cause many deaths and injuries, and the signaller can see what the driver cannot","To speed up deliveries so the lorry can leave site sooner","So the driver does not need to use mirrors or cameras","To check the delivery paperwork"], answer:[0],
  why:"Reversing accidents are a major cause of death on sites. Reducing reversing, using aids and trained signallers all help.", src:L.trans, status:"reviewed" },
{ id:"HR44", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"Why should plant operators wear the seat belt when one is fitted?",
  options:["If the machine overturns, the belt keeps them inside the protective cab or frame","It is only a legal formality","It stops the operator sliding about in the seat and accidentally knocking the controls","Only on public roads"], answer:[0],
  why:"Machines are fitted with roll-over protection. Without a seat belt, the operator can be thrown out and crushed.", src:L.trans, status:"reviewed" },
{ id:"HR45", section:"hr", topic:"Site transport & lifting", type:"single", fact:true,
  q:"How often must lifting accessories such as slings and shackles be thoroughly examined?",
  options:["At least every 6 months, or as set out in an examination scheme","Once every 5 years, or whenever they are moved to a new site","Only when new, as long as they are checked visually before each use","Only after an accident"], answer:[0],
  why:"Under LOLER, lifting accessories and equipment used to lift people must be thoroughly examined at least every 6 months, and other lifting equipment at least every 12 months, unless an examination scheme specifies otherwise.", src:L.loler, status:"reviewed" },
{ id:"HR46", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"What does the safe working load (SWL) or working load limit marked on lifting equipment tell you?",
  options:["The maximum load it is designed to lift safely","The minimum load it can lift","The total weight of the lifting equipment itself","How many lifts it can do per day"], answer:[0],
  why:"Lifting equipment must be clearly marked with its safe working load and must never be overloaded.", src:L.loler, status:"reviewed" },
{ id:"HR47", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"You notice that a lifting sling has a cut in it. What should you do?",
  options:["Take it out of use, label it as damaged and report it","Use it for light loads only","Tie a knot in it to shorten it past the damaged section","Use it carefully until a new one arrives"], answer:[0],
  why:"Damaged lifting accessories can fail suddenly. Remove them from use immediately.", src:L.loler, status:"reviewed" },
{ id:"HR48", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"What is a tag line used for during a crane lift?",
  options:["To control the swing of a load from a safe distance","To attach the load securely to the crane hook before lifting","To measure the height of the lift","To tie the crane down"], answer:[0],
  why:"Tag lines let people steady and guide a load without standing beneath or right next to it.", src:L.loler, status:"reviewed" },
{ id:"HR49", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"Who should plan a lifting operation?",
  options:["A competent person, so the lift is properly planned, supervised and carried out safely","Whoever is working closest to the crane on the day","The driver of the lorry delivering the load","The client"], answer:[0],
  why:"LOLER requires every lifting operation to be properly planned by a competent person, appropriately supervised and carried out safely.", src:L.loler, status:"reviewed" },
{ id:"HR50", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"A delivery lorry has arrived with its load shifted during the journey. What should happen before unloading?",
  options:["The load should be checked and a safe unloading method agreed, keeping people clear of any fall zone","The straps should be released immediately to see what falls","Someone should climb on the load to push it back","Unload it by hand as fast as possible before it moves further"], answer:[0],
  why:"Loads that have moved may fall when restraints are released. Plan the unloading and keep people out of the danger area.", src:L.trans, status:"reviewed" },
{ id:"HR51", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"What is the main cause of dumpers overturning on site?",
  options:["Driving on slopes or near excavation edges, and overloading","Driving too slowly on flat, firm ground so the engine stalls and cuts out","Using the seat belt","Having the lights and beacon on during daylight"], answer:[0],
  why:"Slopes, soft ground, edges and overloading cause overturns. Operators must be trained and wear a seat belt where fitted.", src:L.trans, status:"reviewed" },
{ id:"HR52", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"What should an operator do when leaving plant unattended?",
  options:["Lower any attachments to the ground, apply the brake, switch off and remove the key","Leave the engine running so it is ready for the next person","Leave the bucket raised up high so it is well out of the way of people walking past","Leave the key in so others can use it"], answer:[0],
  why:"Securing plant prevents it moving and stops unauthorised people using it.", src:L.trans, status:"reviewed" },
{ id:"HR53", section:"hr", topic:"Hazardous substances", type:"single",
  q:"Where can you find detailed information about a hazardous product's dangers and safe handling?",
  options:["On its safety data sheet and in the COSHH assessment","On the price label or in the supplier's printed catalogue","On the delivery note","From the colour of the container"], answer:[0],
  why:"Suppliers must provide safety data sheets. Your employer's COSHH assessment explains the controls you must use.", src:L.coshh, status:"reviewed" },
{ id:"HR54", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond containing a skull and crossbones. What does this mean?",
  options:["The product is acutely toxic; it can cause serious harm or death","The product is flammable and must be kept well away from any heat","It is harmful to the environment only","It is safe to use without precautions"], answer:[0],
  why:"Under the CLP labelling system, the skull and crossbones pictogram indicates acute toxicity.", src:L.coshh, status:"reviewed" },
{ id:"HR55", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond with a flame. What does this mean?",
  options:["The product is flammable","The product is hot","The product is corrosive","The product is toxic to aquatic life"], answer:[0],
  why:"The flame pictogram warns of a flammable product. Keep it away from sources of ignition.", src:L.coshh, status:"reviewed" },
{ id:"HR56", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond with liquid dripping onto a hand and a surface. What does this mean?",
  options:["The product is corrosive and can burn skin and eyes","The product is flammable","The product is an irritant only","The product is safe to wash off your skin at the end of the day"], answer:[0],
  why:"The corrosion pictogram shows that a product can cause severe skin burns and eye damage, or corrode metals.", src:L.coshh, status:"reviewed" },
{ id:"HR57", section:"hr", topic:"Hazardous substances", type:"single",
  q:"Why should you never mix different chemical products unless the instructions say so?",
  options:["They may react to produce heat or toxic gases","It makes them less effective only","It wastes product","It is fine to mix them if they are the same colour and brand"], answer:[0],
  why:"Some chemicals react dangerously when mixed, for example some cleaning products release toxic gas.", src:L.coshh, status:"reviewed" },
{ id:"HR58", section:"hr", topic:"Hazardous substances", type:"single",
  q:"How should hazardous substances be stored on site?",
  options:["In a designated, secure store with lids on, as the safety data sheet requires","Wherever there is space in the work area","In the welfare cabin, where it is warm and dry","In drinks bottles, clearly marked with a pen"], answer:[0],
  why:"Proper storage prevents spills, fires and unauthorised use, and keeps incompatible substances apart.", src:L.coshh, status:"reviewed" },
{ id:"HR59", section:"hr", topic:"Hazardous substances", type:"single",
  q:"You are using a solvent-based adhesive in a small room with no windows. What is the main risk?",
  options:["Build-up of vapour that can affect your health and may be flammable","The adhesive will not bond properly without fresh air","It will dry too slowly","There is no real risk, as long as the door is kept closed to keep dust out"], answer:[0],
  why:"Solvent vapours can cause dizziness and other health effects and can form a flammable atmosphere. Ventilate, and follow the COSHH assessment.", src:L.coshh, status:"reviewed" },
{ id:"HR60", section:"hr", topic:"Hazardous substances", type:"single",
  q:"Scenario: A container of an unknown liquid has been left on site with no label. What should you do?",
  options:["Leave it alone, keep others away and report it","Sniff it to find out what it is","Pour it down the drain","Use it if it looks like water"], answer:[0],
  why:"Unknown substances could be harmful or flammable. Do not handle them; report them so they can be identified and disposed of safely.", src:L.coshh, status:"reviewed" },
/* ---------- v2.1: key-fact questions (numbers, limits, colours, timescales) ---------- */
{ id:"WE61", section:"we", topic:"Accident reporting", type:"single", fact:true,
  q:"An employer normally has 10 or more people working on the same premises. What must they provide under social security law?",
  options:["An accident book (or electronic equivalent) where injuries can be recorded","A full-time nurse on site","A monthly written accident report sent to the local council and to HSE","Nothing, unless someone is seriously injured"], answer:[0],
  why:"Regulation 25 of the Social Security (Claims and Payments) Regulations 1979 requires employers with 10 or more people normally employed on the same premises to keep an accident book, which can be kept electronically.", src:{ t:"Social Security (Claims and Payments) Regulations 1979, reg. 25", u:"https://www.legislation.gov.uk/uksi/1979/628/regulation/25" }, status:"draft" },
{ id:"WE62", section:"we", topic:"Accident reporting", type:"single", fact:true,
  q:"Under RIDDOR, for how long must records of reportable incidents be kept?",
  options:["At least 3 years","At least 6 months","At least 12 months","Until the project finishes"], answer:[0],
  why:"RIDDOR requires records of reportable injuries, diseases and dangerous occurrences to be kept for at least three years.", src:L.riddor, status:"draft" },
{ id:"WE63", section:"we", topic:"Legal duties", type:"single", fact:true,
  q:"What is an HSE improvement notice?",
  options:["A formal notice requiring a breach of the law to be put right within a set time","An order that stops the work immediately until the inspector returns to site","A fine paid on the spot by the worker","A letter of advice with no legal force"], answer:[0],
  why:"An improvement notice requires the dutyholder to remedy a breach within a stated period (at least 21 days). A prohibition notice stops an activity that risks serious personal injury.", src:L.hswa, status:"draft" },
{ id:"WE64", section:"we", topic:"Legal duties", type:"single", fact:true,
  q:"An HSE inspector finds a material breach of health and safety law on site. Under 'Fee for Intervention', who pays for the inspector's time?",
  options:["The dutyholder who broke the law, such as the employer","The workers on site, shared equally between everyone named in the report","HSE pays in all cases","The local council"], answer:[0],
  why:"Under Fee for Intervention, dutyholders found to be in material breach of the law pay for the time HSE spends identifying and helping put it right. If there is no material breach, there is no fee.", src:{ t:"HSE: What is Fee for Intervention?", u:"https://www.hse.gov.uk/fee-for-intervention/what-is-ffi.htm" }, status:"draft" },
{ id:"WE65", section:"we", topic:"Legal duties", type:"single", fact:true,
  q:"Under CDM 2015, when must a construction project be notified to HSE?",
  options:["When it will last more than 30 working days with more than 20 workers at the same time, or exceed 500 person days","On every project, however small, before any work starts on site, including repairs","Only when the client is a public body","Only when demolition is involved"], answer:[0],
  why:"Regulation 6 of CDM 2015 requires notification (form F10) where the work will last longer than 30 working days and have more than 20 workers working simultaneously at any point, or exceed 500 person days.", src:{ t:"CDM 2015, regulation 6", u:"https://www.legislation.gov.uk/uksi/2015/51/regulation/6" }, status:"draft" },
{ id:"WE66", section:"we", topic:"Welfare & first aid", type:"single", fact:true,
  q:"How long is a First Aid at Work or Emergency First Aid at Work certificate normally valid for?",
  options:["3 years, with annual refresher training strongly recommended","1 year","5 years, after which a shorter refresher course is needed","For life"], answer:[0],
  why:"FAW and EFAW certificates are valid for three years. HSE strongly recommends annual refresher training, and there is no grace period once a certificate expires.", src:{ t:"HSE L74 First aid at work (guidance)", u:"https://www.hse.gov.uk/pubns/books/l74.htm" }, status:"draft" },
{ id:"WE67", section:"we", topic:"Environment & waste", type:"single", fact:true,
  q:"Drain covers on some sites are colour coded. What does a blue mark usually mean?",
  options:["Surface water drain, which usually flows straight to a river or stream","Foul drain, which flows to a sewage treatment works for cleaning","Drinking water supply","Gas main access"], answer:[0],
  why:"Environment Agency guidance is that drains can be marked by type: blue for surface water and red for foul. Never let anything but clean rainwater enter a surface water drain.", src:{ t:"Environment Agency Yellow Fish guidance (businesses and constructors)", u:"https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/823247/Yellow_Fish_Guidance_Manual_-_pollution_prevention__Businesses_and_Constructors.pdf" }, status:"draft" },
{ id:"WE68", section:"we", topic:"Environment & waste", type:"single", fact:true,
  q:"Drain covers on some sites are colour coded. What does a red mark usually mean?",
  options:["Foul drain, which flows to a sewage treatment works","Surface water drain","Fire hydrant","Do not use the drain in wet weather, as it may overflow onto the site"], answer:[0],
  why:"Drains can be marked red for foul and blue for surface water. Knowing which is which matters when dealing with spills and washwater.", src:{ t:"Environment Agency Yellow Fish guidance (businesses and constructors)", u:"https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/823247/Yellow_Fish_Guidance_Manual_-_pollution_prevention__Businesses_and_Constructors.pdf" }, status:"draft" },
{ id:"WE69", section:"we", topic:"Environment & waste", type:"single",
  q:"You have used absorbent granules from a spill kit to soak up a diesel spill. How should they be disposed of?",
  options:["As hazardous waste, in the container provided, following site arrangements","In the general waste skip","Swept into a surface water drain","Left spread on the ground to dry out, then swept into the general waste skip"], answer:[0],
  why:"Absorbents contaminated with oil or fuel become hazardous waste and must be bagged or contained and disposed of properly.", src:L.epa, status:"draft" },
{ id:"OH61", section:"oh", topic:"Noise & vibration", type:"single", fact:true,
  q:"At what average daily noise exposure must your employer carry out a risk assessment, give you information and training, and make hearing protection available if you ask for it?",
  options:["80 dB(A)","70 dB(A)","85 dB(A)","90 dB(A)"], answer:[0],
  why:"80 dB(A) is the lower exposure action value. At 85 dB(A) (the upper action value) hearing protection must be provided and worn.", src:L.noise, status:"draft" },
{ id:"OH62", section:"oh", topic:"Noise & vibration", type:"single", fact:true,
  q:"What is the daily noise exposure limit value that must not be exceeded, taking account of hearing protection?",
  options:["87 dB(A)","80 dB(A)","85 dB(A)","100 dB(A)"], answer:[0],
  why:"The Control of Noise at Work Regulations set an exposure limit value of 87 dB(A) daily (and 140 dB(C) peak), which takes account of hearing protection worn.", src:L.noise, status:"draft" },
{ id:"OH63", section:"oh", topic:"Noise & vibration", type:"single", fact:true,
  q:"What is the daily exposure action value for hand-arm vibration, above which employers must take action to reduce exposure?",
  options:["2.5 m/s² A(8)","5 m/s² A(8)","10 m/s² A(8)","0.5 m/s² A(8)"], answer:[0],
  why:"The Control of Vibration at Work Regulations set a daily exposure action value of 2.5 m/s² A(8) and a limit value of 5 m/s² A(8) for hand-arm vibration.", src:{ t:"Control of Vibration at Work Regulations 2005, reg. 4", u:"https://www.legislation.gov.uk/uksi/2005/1093/regulation/4" }, status:"draft" },
{ id:"OH64", section:"oh", topic:"Noise & vibration", type:"single", fact:true,
  q:"What is the daily exposure limit value for hand-arm vibration, which must not be exceeded?",
  options:["5 m/s² A(8)","2.5 m/s² A(8)","1.15 m/s² A(8)","25 m/s² A(8)"], answer:[0],
  why:"The hand-arm vibration exposure limit value is 5 m/s² A(8). The action value is 2.5 m/s² A(8).", src:{ t:"Control of Vibration at Work Regulations 2005, reg. 4", u:"https://www.legislation.gov.uk/uksi/2005/1093/regulation/4" }, status:"draft" },
{ id:"OH65", section:"oh", topic:"Asbestos", type:"single", fact:true,
  q:"Roughly how many people die each year in Great Britain from asbestos-related diseases?",
  options:["Around 5,000","Around 50","Around 500","Around 50,000"], answer:[0],
  why:"HSE states that asbestos causes around 5,000 deaths every year, more than any other single work-related cause.", src:L.asb, status:"draft" },
{ id:"OH66", section:"oh", topic:"Dust & fumes", type:"single", fact:true,
  q:"Why is the finest construction dust (respirable dust) the most dangerous?",
  options:["The particles are too small to see and can be breathed deep into the lungs","It is heavier and settles on your skin","It only causes eye irritation, which clears up quickly once you leave the dusty area","It is only dangerous if swallowed"], answer:[0],
  why:"Respirable dust particles are invisible to the naked eye and reach the deepest parts of the lungs, where they cause lasting damage such as silicosis.", src:L.coshh, status:"draft" },
{ id:"OH67", section:"oh", topic:"Health & wellbeing", type:"single", fact:true,
  q:"What is the UK Chief Medical Officers' low-risk drinking guideline for adults?",
  options:["No more than 14 units a week, spread over 3 or more days","No more than 2 units a day, every day","No more than 28 units a week","No more than 21 units a week for men and 14 units a week for women"], answer:[0],
  why:"The NHS advises men and women not to drink more than 14 units a week on a regular basis, spread over three or more days.", src:{ t:"NHS: Calculating alcohol units", u:"https://www.nhs.uk/live-well/alcohol-advice/calculating-alcohol-units/" }, status:"draft" },
{ id:"OH68", section:"oh", topic:"Health & wellbeing", type:"single", fact:true,
  q:"Roughly how long does it take the average adult body to process one unit of alcohol?",
  options:["About one hour","About ten minutes","About 24 hours","A good night's sleep removes it all"], answer:[0],
  why:"One unit is about the amount the average adult can process in an hour, so after a heavy night you may still be over the limit the next morning.", src:{ t:"NHS: Calculating alcohol units", u:"https://www.nhs.uk/live-well/alcohol-advice/calculating-alcohol-units/" }, status:"draft" },
{ id:"OH69", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"What is the role of a Mental Health First Aider at work?",
  options:["To spot signs of mental ill health, listen, and guide someone towards professional support","To diagnose and treat mental illness","To decide whether someone is fit to work","To report people's problems to management so their workload can be changed"], answer:[0],
  why:"Mental health first aiders are trained to recognise signs, offer initial support and signpost people to help. They are not therapists or doctors.", src:L.stress, status:"draft" },
{ id:"OH70", section:"oh", topic:"Health & wellbeing", type:"single",
  q:"Why can allergic (sensitisation) dermatitis, for example from cement, end a career in construction?",
  options:["Once sensitised, even tiny amounts can trigger a reaction for the rest of your life","It always clears up after a week","It only affects your hands in summer","It can be cured by a single course of cream from the chemist, after which you are immune"], answer:[0],
  why:"Some people become sensitised to substances such as chromium in cement. After that, even small exposures cause dermatitis, which can make it impossible to keep doing that work.", src:L.skin, status:"draft" },
{ id:"SA63", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"UK fire extinguishers have red bodies with a coloured band or label. Which colour identifies a foam extinguisher?",
  options:["Cream","Blue","Black","Yellow"], answer:[0],
  why:"Colour codes: water = red (no band), foam = cream, dry powder = blue, carbon dioxide (CO2) = black, wet chemical = yellow.", src:{ t:"BS EN 3 / BS 7863 extinguisher colour coding (summary)", u:"https://www.fireprotectiononline.co.uk/info/an-explanation-of-uk-fire-extinguisher-colour-coding/" }, status:"draft" },
{ id:"SA64", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"Which colour identifies a dry powder fire extinguisher?",
  options:["Blue","Cream","Black","Green"], answer:[0],
  why:"Dry powder extinguishers have a blue band or label. They can be used on many fire types but powder can be hard to see through and breathe in confined spaces.", src:{ t:"BS EN 3 / BS 7863 extinguisher colour coding (summary)", u:"https://www.fireprotectiononline.co.uk/info/an-explanation-of-uk-fire-extinguisher-colour-coding/" }, status:"draft" },
{ id:"SA65", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"A fire involves burning wood, paper and cardboard (a Class A fire). Which extinguisher is the most suitable?",
  options:["Water (red)","Carbon dioxide (black)","Wet chemical (yellow) only","None; it must be left to burn out"], answer:[0],
  why:"Class A fires involve solid materials such as wood and paper. Water (and foam) extinguishers are suitable. CO2 is mainly for electrical and flammable liquid fires.", src:{ t:"BS EN 2 fire classes / extinguisher guidance (summary)", u:"https://www.fireprotectiononline.co.uk/info/an-explanation-of-uk-fire-extinguisher-colour-coding/" }, status:"draft" },
{ id:"SA66", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"A Class B fire involves which type of material?",
  options:["Flammable liquids, such as petrol, paint or solvents","Solid materials, such as wood and paper","Flammable metals","Cooking oils and fats"], answer:[0],
  why:"Fire classes: A = solids, B = flammable liquids, C = flammable gases, D = metals, F = cooking oils and fats. Electrical fires are not given a class letter.", src:{ t:"BS EN 2 fire classes / extinguisher guidance (summary)", u:"https://www.fireprotectiononline.co.uk/info/an-explanation-of-uk-fire-extinguisher-colour-coding/" }, status:"draft" },
{ id:"SA67", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"According to HSE guidance, how long should a continuous fire watch be kept after hot work has finished?",
  options:["At least one hour, with a further check later","5 minutes","Until the welder has packed away","A fire watch is only needed if sparks were seen"], answer:[0],
  why:"HSG168 advises a continuous fire watch of the hot work area for at least an hour after hot work ends, followed by at least one more check later.", src:L.hsg168, status:"draft" },
{ id:"SA68", section:"sa", topic:"Fire prevention", type:"single", fact:true,
  q:"How should gas cylinders, such as acetylene and LPG, normally be stored and used?",
  options:["Upright and secured so they cannot fall","Lying on their side so they cannot roll","Upside down to keep the valve clean","Any way at all, as long as they are stored outdoors in a secure compound"], answer:[0],
  why:"HSG168 says cylinders should be secured in an upright position unless designed to be used in another position.", src:L.hsg168, status:"draft" },
{ id:"SA69", section:"sa", topic:"Fire prevention", type:"single",
  q:"How should petrol for site equipment be stored?",
  options:["In small, approved and labelled containers, kept in a secure, ventilated flammables store away from ignition sources","In any empty plastic drinks bottle","In the site cabin, where it is warm","Next to the generator for convenience, in its original jerry can with the lid loose to let fumes out"], answer:[0],
  why:"Petrol is highly flammable. Use approved containers, keep quantities to a minimum and store it in a designated, ventilated store away from sources of ignition.", src:L.hsg168, status:"draft" },
{ id:"SA70", section:"sa", topic:"Fire prevention", type:"single",
  q:"Why should halogen work lights be kept away from dust sheets, insulation and other combustible materials?",
  options:["They get very hot and can set nearby materials alight","They use too much electricity and can trip the site supply","The light fades the materials","They attract insects"], answer:[0],
  why:"Halogen lamps have very hot surfaces. Keep them clear of combustibles and never cover them.", src:L.hsg168, status:"draft" },
{ id:"SA71", section:"sa", topic:"Electrical safety", type:"single", fact:true,
  q:"On a UK construction site, what colour are the plugs and sockets for 110 V equipment?",
  options:["Yellow","Blue","Red","White"], answer:[0],
  why:"Industrial plugs and sockets are colour coded by voltage: yellow = 110 V, blue = 230 V, red = 400 V.", src:{ t:"BS EN / IEC 60309 industrial plug colour coding", u:"https://en.wikipedia.org/wiki/IEC_60309" }, status:"draft" },
{ id:"SA72", section:"sa", topic:"Electrical safety", type:"single", fact:true,
  q:"What colour are industrial plugs and sockets for 400 V (three-phase) supplies?",
  options:["Red","Yellow","Blue","Green"], answer:[0],
  why:"Yellow = 110 V, blue = 230 V, red = 400 V. Only competent people should connect equipment to 400 V supplies.", src:{ t:"BS EN / IEC 60309 industrial plug colour coding", u:"https://en.wikipedia.org/wiki/IEC_60309" }, status:"draft" },
{ id:"SA73", section:"sa", topic:"Electrical safety", type:"single", fact:true,
  q:"A 110 V site supply is 'centre-tapped to earth'. What is the maximum voltage to earth, and so the maximum shock voltage in most faults?",
  options:["55 V","110 V","230 V","12 V"], answer:[0],
  why:"With a centre-tapped transformer, each conductor is only 55 V from earth, which greatly reduces the severity of an electric shock.", src:L.hsg141, status:"draft" },
{ id:"SA74", section:"sa", topic:"PPE", type:"single",
  q:"How should a safety helmet be worn?",
  options:["Straight on the head with the harness adjusted to fit, peak at the front","Tilted back so you can see upwards more easily","Over a hood or thick hat that stops it fitting properly","Loose, with the harness fully slackened so it can be taken off quickly in an emergency"], answer:[0],
  why:"A helmet only protects you if it fits and is worn correctly. Adjust the harness to fit, wear it the right way round, and follow the manufacturer's instructions.", src:L.ppe, status:"draft" },
{ id:"HR61", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"HSE guidance says you should consider other equipment if a task needs you to stay up a ladder or stepladder for more than how long at a time?",
  options:["30 minutes","5 minutes","2 hours","A full shift"], answer:[0],
  why:"HSE recommends considering alternative equipment if a task would need you to stay on a ladder or stepladder for more than 30 minutes at a time. Risk assessment still comes first.", src:{ t:"HSE Work at height FAQs", u:"https://www.hse.gov.uk/work-at-height/faqs.htm" }, status:"draft" },
{ id:"HR62", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"When using a leaning ladder, which rungs should you not work from?",
  options:["The top three rungs","The bottom three rungs","The middle rungs","Any rung above head height of the person footing it"], answer:[0],
  why:"HSE guidance is not to work off the top three rungs, and to make sure the ladder extends at least 1 m (or three rungs) above where you are working, so you have a handhold.", src:{ t:"HSE Safe use of ladders and stepladders", u:"https://www.hse.gov.uk/work-at-height/ladders/types-of-ladder.htm" }, status:"draft" },
{ id:"HR63", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"On a stepladder, which steps should you not stand and work on unless there is a suitable handhold?",
  options:["The top three steps (including the very top)","The bottom step","Any step above the first two, whether or not there is a handhold","The middle step"], answer:[0],
  why:"HSE guidance: don't stand and work on the top three steps (including a step forming the very top) unless there is a suitable handhold.", src:{ t:"HSE Safe use of ladders and stepladders", u:"https://www.hse.gov.uk/work-at-height/ladders/types-of-ladder.htm" }, status:"draft" },
{ id:"HR64", section:"hr", topic:"Working at height", type:"single", fact:true,
  q:"On a working platform, what is the maximum unprotected gap allowed between guard rails (or between a guard rail and the toe board)?",
  options:["470 mm","950 mm","150 mm","1 metre"], answer:[0],
  why:"The Work at Height Regulations require a top guard rail at least 950 mm high, with intermediate protection so that no unprotected gap exceeds 470 mm.", src:{ t:"Work at Height Regulations 2005, Schedule 2", u:"https://www.legislation.gov.uk/uksi/2005/735/schedule/2" }, status:"draft" },
{ id:"HR65", section:"hr", topic:"Site transport & lifting", type:"single", fact:true,
  q:"How often must lifting equipment that is NOT used for lifting people (e.g. a crane or telehandler) be thoroughly examined, unless an examination scheme says otherwise?",
  options:["At least every 12 months","At least every 5 years","Only when new, provided the operator checks it visually every day","At least every week"], answer:[0],
  why:"LOLER requires thorough examination at least every 12 months for lifting equipment, and at least every 6 months for lifting accessories and equipment used to lift people, unless an examination scheme specifies otherwise.", src:L.loler, status:"draft" },
{ id:"HR66", section:"hr", topic:"Site transport & lifting", type:"single",
  q:"What is the difference between a LOLER 'thorough examination' and the routine checks you make before use?",
  options:["A thorough examination is a detailed, recorded examination by a competent person at set intervals; pre-use checks are quick visual checks by the user","They are the same thing","A thorough examination is done by the user every morning","Pre-use checks are only needed if the equipment is new; after that, the thorough examination covers everything"], answer:[0],
  why:"Thorough examinations are formal, recorded and carried out by a competent person. Users should still check equipment visually before each use.", src:L.loler, status:"draft" },
{ id:"HR67", section:"hr", topic:"Excavations & services", type:"single", fact:true,
  q:"HSE advises a safety zone at ground level around overhead power lines. How far should it extend horizontally from the nearest wire on either side?",
  options:["6 metres","1 metre","2 metres","50 metres"], answer:[0],
  why:"GS6 advises a safety zone extending 6 m horizontally from the nearest wire on either side, marked with barriers, and managing the risks for any work within 10 m.", src:{ t:"HSE GS6 Avoiding danger from overhead power lines", u:"https://www.hse.gov.uk/pubns/gs6.htm" }, status:"draft" },
{ id:"HR68", section:"hr", topic:"Excavations & services", type:"single",
  q:"Plant has to pass under overhead power lines. What are 'goalposts' used for?",
  options:["To mark a safe crossing point with a height limit, using non-conducting material, so plant cannot get too close to the wires","To mark the site's football pitch","To support the power lines","To stop pedestrians crossing under the lines while plant is working nearby"], answer:[0],
  why:"Where plant must pass under lines, fenced passageways with goalposts made of rigid, non-conducting material at each end act as height-limited gateways.", src:{ t:"HSE GS6 Avoiding danger from overhead power lines", u:"https://www.hse.gov.uk/pubns/gs6.htm" }, status:"draft" },
{ id:"HR69", section:"hr", topic:"Excavations & services", type:"single", fact:true,
  q:"Within roughly what distance of a located underground service should you stop using mechanical excavators and dig only with hand tools?",
  options:["0.5 metres","5 metres","10 metres","It's fine to dig with an excavator right up to it"], answer:[0],
  why:"HSG47 treats a zone of about 0.5 m around a located service as a no-machine zone. Only careful hand digging with suitable tools should be used there.", src:L.hsg47, status:"draft" },
{ id:"HR70", section:"hr", topic:"Excavations & services", type:"single",
  q:"A cable avoidance tool (CAT) is often used with a signal generator (a 'Genny'). Why?",
  options:["The Genny puts a signal onto a cable or pipe so it can be traced, even if it is not carrying current","It powers the CAT's batteries","It switches the buried cable off at the substation so it is safe to dig near","It measures the depth of the excavation"], answer:[0],
  why:"A CAT alone only detects services giving off a signal. A Genny applies a traceable signal so services that are dead or not radiating can be found.", src:L.hsg47, status:"draft" },
{ id:"HR71", section:"hr", topic:"Excavations & services", type:"single",
  q:"Is an excavation less than 1.2 metres deep always safe to work in without support?",
  options:["No; even shallow excavations can collapse and cause serious injury, so the risk must be assessed","Yes; collapses only happen in deep trenches","Yes, if the soil is dry","Yes, if you only work in it for a short time and someone stands at the edge watching you"], answer:[0],
  why:"There is no 'safe' depth. Even shallow trenches can collapse, especially when you are kneeling or bending. Support or batter the sides as the risk assessment requires.", src:L.hsg150, status:"draft" },
{ id:"HR72", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond with an exclamation mark. What does it mean?",
  options:["The product can cause less serious health effects such as irritation, skin sensitisation or harm if swallowed","The product is explosive","The product is safe to use without precautions","The product is under pressure and may burst if the container is dropped or heated"], answer:[0],
  why:"The CLP exclamation-mark pictogram warns of hazards such as skin or eye irritation, skin sensitisation, and harm if swallowed or inhaled.", src:{ t:"HSE: Hazard pictograms (CLP)", u:"https://www.hse.gov.uk/chemical-classification/labelling-packaging/hazard-symbols-hazard-pictograms.htm" }, status:"draft" },
{ id:"HR73", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond with the outline of a person and a star shape on their chest. What does it mean?",
  options:["Serious long-term health hazard, such as causing cancer or breathing problems","The product is flammable","First aid equipment inside","The product is harmful to fish and plants only, so must not go down drains"], answer:[0],
  why:"The CLP 'health hazard' pictogram warns of serious longer-term effects such as cancer, respiratory sensitisation or damage to organs.", src:{ t:"HSE: Hazard pictograms (CLP)", u:"https://www.hse.gov.uk/chemical-classification/labelling-packaging/hazard-symbols-hazard-pictograms.htm" }, status:"draft" },
{ id:"HR74", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond with a dead tree and a dead fish. What does it mean?",
  options:["The product is hazardous to the environment","The product is toxic only to plants","The product is biodegradable","The product must be stored outdoors, away from buildings and people"], answer:[0],
  why:"The CLP environment pictogram means the product is hazardous to the aquatic environment. It must never go down drains.", src:{ t:"HSE: Hazard pictograms (CLP)", u:"https://www.hse.gov.uk/chemical-classification/labelling-packaging/hazard-symbols-hazard-pictograms.htm" }, status:"draft" },
{ id:"HR75", section:"hr", topic:"Hazardous substances", type:"single", fact:true,
  q:"A product label shows a red-bordered diamond with a gas cylinder. What does it mean?",
  options:["The product is a gas under pressure, which may explode if heated","The product is flammable liquid","Empty containers can be refilled","The product contains compressed oxygen for breathing apparatus"], answer:[0],
  why:"The CLP gas cylinder pictogram indicates a gas under pressure; it may explode if heated, and some are refrigerated and can cause cold burns.", src:{ t:"HSE: Hazard pictograms (CLP)", u:"https://www.hse.gov.uk/chemical-classification/labelling-packaging/hazard-symbols-hazard-pictograms.htm" }, status:"draft" }
];

</script>
<script>
/* Site Ready – HS&E Operatives revision. Runs fully offline; no data leaves the device. */
(function () {
  "use strict";

  var APP_VERSION = "2.1";
  var STORE_KEY = "siteready.v1";
  var MOCK_QUESTIONS = 50;
  var MOCK_MINUTES = 45;
  var PASS_RATE = 0.9;           // 45 out of 50
  var WEAK_SET = 15;
  var MIN_ATTEMPTS_FOR_RATING = 3;

  var QS = window.QUESTIONS || [];
  var SECTIONS = window.SECTIONS || {};
  var BY_ID = {};
  QS.forEach(function (q) { BY_ID[q.id] = q; });

  var app = document.getElementById("app");
  var session = null;      // current quiz/mock session
  var timerHandle = null;

  /* ---------------- storage ---------------- */
  var memoryStore = null;  // fallback if storage is blocked
  function blankState() { return { q: {}, history: [], active: null, settings: { theme: "auto" } }; }
  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.q) { s.history = s.history || []; s.settings = s.settings || { theme: "auto" }; return s; } }
    } catch (e) { /* storage unavailable */ }
    return memoryStore || blankState();
  }
  var state = load();
  function save() {
    memoryStore = state;
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* keep in memory */ }
  }
  function storageWorks() {
    try { var k = STORE_KEY + ".t"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; } catch (e) { return false; }
  }

  /* ---------------- helpers ---------------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pct(c, t) { return t ? Math.round((c / t) * 100) : 0; }
  function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function fmtDate(ts) { var d = new Date(ts); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }
  function letter(i) { return String.fromCharCode(65 + i); }
  var NUMWORD = ["", "ONE", "TWO", "THREE", "FOUR", "FIVE"];
  function topicsOf(sec) { var t = []; QS.forEach(function (q) { if ((!sec || q.section === sec) && t.indexOf(q.topic) < 0) t.push(q.topic); }); return t; }
  function qstat(id) { return state.q[id] || { a: 0, c: 0, box: 0, last: 0 }; }

  function rating(c, a) {
    if (a < MIN_ATTEMPTS_FOR_RATING) return { cls: "s-none", label: a ? "Too few answers" : "Not started" };
    var p = c / a;
    if (p >= 0.9) return { cls: "s-strong", label: "Strong" };
    if (p >= 0.75) return { cls: "s-ok", label: "Getting there" };
    return { cls: "s-weak", label: "Weak" };
  }
  function aggregate(filter) {
    var a = 0, c = 0, seen = 0, n = 0;
    QS.forEach(function (q) { if (!filter(q)) return; n++; var s = qstat(q.id); a += s.a; c += s.c; if (s.a) seen++; });
    return { a: a, c: c, seen: seen, n: n };
  }

  /* Record an answer: Leitner-style box (1 = needs work … 5 = secure). */
  function record(id, correct) {
    var s = state.q[id] || { a: 0, c: 0, box: 0, last: 0 };
    s.a++; if (correct) s.c++;
    s.box = correct ? Math.min(5, (s.box || 1) + 1) : 1;
    s.last = Date.now();
    state.q[id] = s;
  }

  function isCorrect(item) {
    var q = BY_ID[item.id];
    var chosen = item.sel.map(function (i) { return item.order[i]; }).sort();
    var ans = q.answer.slice().sort();
    return chosen.length === ans.length && chosen.every(function (v, i) { return v === ans[i]; });
  }

  /* ---------------- question selection ---------------- */
  function makeItems(ids) {
    return ids.map(function (id) {
      var q = BY_ID[id];
      return { id: id, order: shuffle(q.options.map(function (_, i) { return i; })), sel: [], done: false, flag: false };
    });
  }
  function pickPractice(sections, count, factsOnly) {
    var pool = QS.filter(function (q) { return sections.indexOf(q.section) >= 0 && (!factsOnly || q.fact); });
    // favour questions seen less often, with randomness
    pool = pool.map(function (q) { return { q: q, k: qstat(q.id).a + Math.random() * 2 }; })
               .sort(function (x, y) { return x.k - y.k; }).map(function (x) { return x.q.id; });
    return shuffle(pool.slice(0, count || pool.length));
  }
  function topicAccuracy(topic) {
    var ag = aggregate(function (q) { return q.topic === topic; });
    return ag.a ? ag.c / ag.a : 0.5;
  }
  function pickWeak(count) {
    var scored = QS.map(function (q) {
      var s = qstat(q.id);
      var boxScore = s.a ? (6 - (s.box || 1)) : 3.5;       // wrong answers and unseen questions rank highest
      var topicScore = (1 - topicAccuracy(q.topic)) * 4;  // weak topics rank higher
      return { id: q.id, k: boxScore + topicScore + Math.random() };
    }).sort(function (x, y) { return y.k - x.k; });
    return shuffle(scored.slice(0, count).map(function (x) { return x.id; }));
  }
  function pickMock() {
    var keys = Object.keys(SECTIONS);
    var total = Math.min(MOCK_QUESTIONS, QS.length);
    var bySec = {}; keys.forEach(function (k) { bySec[k] = shuffle(QS.filter(function (q) { return q.section === k; }).map(function (q) { return q.id; })); });
    var chosen = [], i = 0, guard = 0, signs = 0, MAX_SIGNS = 5;  // keep sign questions to a realistic share
    while (chosen.length < total && guard < 10000) {
      var k = keys[i % keys.length];
      while (bySec[k].length && BY_ID[bySec[k][0]].topic === "Safety signs" && signs >= MAX_SIGNS) bySec[k].shift();
      if (bySec[k].length) { var id = bySec[k].shift(); if (BY_ID[id].topic === "Safety signs") signs++; chosen.push(id); }
      i++; guard++;
    }
    return shuffle(chosen);
  }

  /* ---------------- modal ---------------- */
  function confirmBox(title, body, okText, cancelText) {
    return new Promise(function (resolve) {
      var m = document.getElementById("modal");
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").textContent = body;
      var ok = document.getElementById("modal-ok"), cancel = document.getElementById("modal-cancel");
      ok.textContent = okText || "OK"; cancel.textContent = cancelText || "Cancel";
      cancel.hidden = cancelText === null;
      m.hidden = false; ok.focus();
      function done(v) { m.hidden = true; ok.onclick = cancel.onclick = null; document.removeEventListener("keydown", onKey); resolve(v); }
      function onKey(e) { if (e.key === "Escape") done(false); }
      ok.onclick = function () { done(true); };
      cancel.onclick = function () { done(false); };
      document.addEventListener("keydown", onKey);
    });
  }

  /* ---------------- theme ---------------- */
  function applyTheme() {
    var t = state.settings.theme;
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }

  /* ---------------- routing ---------------- */
  function go(view, arg) {
    stopTimer();
    document.querySelectorAll(".topnav button").forEach(function (b) {
      if (b.getAttribute("data-go") === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    (VIEWS[view] || VIEWS.home)(arg);
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]");
    if (t) { e.preventDefault(); leaveGuard(function () { go(t.getAttribute("data-go")); }); }
  });
  function leaveGuard(fn) {
    if (session && session.mode === "mock" && !session.finished) {
      confirmBox("Leave the mock exam?", "Your answers so far are saved. You can resume this mock from the home screen, but the timer keeps running.", "Leave", "Stay")
        .then(function (ok) { if (ok) { persistActive(); session = null; fn(); } });
    } else { session = null; fn(); }
  }

  /* ---------------- views ---------------- */
  var VIEWS = {};

  VIEWS.home = function () {
    var all = aggregate(function () { return true; });
    var mocks = state.history.filter(function (h) { return h.mode === "mock"; });
    var last3 = mocks.slice(-3);
    var mockAvg = last3.length ? Math.round(last3.reduce(function (s, h) { return s + pct(h.correct, h.total); }, 0) / last3.length) : null;
    var weakTopics = topicsOf().map(function (t) { var ag = aggregate(function (q) { return q.topic === t; }); return { t: t, ag: ag, r: rating(ag.c, ag.a) }; })
      .filter(function (x) { return x.r.cls === "s-weak"; });
    var active = state.active;

    var h = '<h1>HS&amp;E test revision for Operatives</h1>' +
      '<p class="muted">Practise questions, find your weak areas and sit timed mock exams. Everything is stored on this device only.</p>';

    if (active && active.mode === "mock") {
      var left = Math.max(0, Math.round((active.deadline - Date.now()) / 1000));
      h += '<div class="banner warn row spread"><span>You have a mock exam in progress (' + (left ? fmtTime(left) + ' left' : 'time is up') + ').</span>' +
        '<span class="row"><button class="btn" id="discard">Discard</button><button class="btn primary" id="resume">Resume</button></span></div>';
    }
    h += '<div id="install">' + installHtml() + '</div>';
    if (!storageWorks()) {
      h += '<div class="banner bad">Your browser is blocking storage, so progress will be lost when you close this page.</div>';
    }

    h += '<div class="grid four" style="margin:16px 0">' +
      stat(all.seen + "/" + all.n, "questions seen") +
      stat(all.a ? pct(all.c, all.a) + "%" : "–", "practice accuracy") +
      stat(mocks.length, "mocks taken") +
      stat(mockAvg === null ? "–" : mockAvg + "%", "last 3 mocks avg") + '</div>';

    h += '<div class="grid two">' +
      mode("practice", "Practice by topic", "Pick sections, answer questions and see the explanation straight away.") +
      mode("weak", "Work on weak areas", "Targets questions you got wrong and your weakest topics.", weakTopics.length ? weakTopics.length + " weak topic" + (weakTopics.length > 1 ? "s" : "") : "") +
      mode("mock", "Mock exam", MOCK_QUESTIONS + " questions, " + MOCK_MINUTES + " minutes, pass mark 90%. Results at the end, like the real test.") +
      mode("progress", "My progress", "Strengths and weaknesses by section and topic, and your mock history.") +
      '</div>';

    h += '<h2>How to use this app</h2><ol class="small">' +
      '<li>Work through each section in <b>Practice</b> until you have seen every question.</li>' +
      '<li>Use <b>Weak areas</b> daily. It brings back the questions you get wrong.</li>' +
      '<li>Sit a <b>Mock exam</b>. Aim to score 90% or more in at least three mocks in a row before booking the real test.</li></ol>' +
      '<p class="small muted">Unofficial revision aid. Not produced or endorsed by CITB or CSCS. Version ' + APP_VERSION + ', ' + QS.length + ' questions.</p>';

    app.innerHTML = h;
    bindModes();
    bindInstall();
    var r = document.getElementById("resume"); if (r) r.onclick = resumeMock;
    var d = document.getElementById("discard"); if (d) d.onclick = function () {
      confirmBox("Discard this mock?", "Your answers in this mock will be deleted and it won't count towards your progress.", "Discard", "Cancel")
        .then(function (ok) { if (ok) { state.active = null; save(); go("home"); } });
    };
  };
  function stat(v, l) { return '<div class="card stat"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }
  function mode(id, title, text, tag) {
    return '<button class="mode" data-mode="' + id + '">' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') +
      '<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></button>';
  }
  function bindModes() {
    app.querySelectorAll("[data-mode]").forEach(function (b) {
      b.onclick = function () {
        var m = b.getAttribute("data-mode");
        if (m === "practice") go("practiceSetup");
        else if (m === "weak") startSession("weak", pickWeak(WEAK_SET));
        else if (m === "mock") startMockConfirm();
        else go("progress");
      };
    });
  }

  VIEWS.practiceSetup = function () {
    var chosen = Object.keys(SECTIONS), count = 10, factsOnly = false;
    function render() {
      var avail = QS.filter(function (q) { return chosen.indexOf(q.section) >= 0 && (!factsOnly || q.fact); }).length;
      var h = '<h1>Practice by topic</h1><p class="muted">Choose the sections to practise. You get feedback after each question.</p>' +
        '<div class="card stack"><h3>Sections</h3><div class="chips">' +
        Object.keys(SECTIONS).map(function (k) {
          var ag = aggregate(function (q) { return q.section === k; });
          return '<button class="chip" data-sec="' + k + '" aria-pressed="' + (chosen.indexOf(k) >= 0) + '">' + esc(SECTIONS[k]) + ' <span class="small">(' + ag.n + ')</span></button>';
        }).join("") + '</div>' +
        '<h3>Questions</h3><div class="chips">' +
        '<button class="chip" data-facts="0" aria-pressed="' + !factsOnly + '">All questions</button>' +
        '<button class="chip" data-facts="1" aria-pressed="' + factsOnly + '">Key facts only</button></div>' +
        '<p class="small muted" style="margin-top:6px">Key facts are the numbers, limits, colours and timescales worth learning by heart, such as noise levels, ladder rules and extinguisher colours.</p>' +
        '<h3>Number of questions</h3><div class="chips">' +
        [10, 20, 0].map(function (n) { return '<button class="chip" data-n="' + n + '" aria-pressed="' + (count === n) + '">' + (n ? n : "All (" + avail + ")") + '</button>'; }).join("") +
        '</div></div>' +
        '<div class="actions"><button class="btn ghost" data-go="home">Back</button>' +
        '<button class="btn primary" id="start"' + (chosen.length && avail ? '' : ' disabled') + '>Start practice</button></div>';
      app.innerHTML = h;
      app.querySelectorAll("[data-sec]").forEach(function (b) {
        b.onclick = function () { var k = b.getAttribute("data-sec"); var i = chosen.indexOf(k); if (i >= 0) chosen.splice(i, 1); else chosen.push(k); render(); };
      });
      app.querySelectorAll("[data-n]").forEach(function (b) { b.onclick = function () { count = +b.getAttribute("data-n"); render(); }; });
      app.querySelectorAll("[data-facts]").forEach(function (b) { b.onclick = function () { factsOnly = b.getAttribute("data-facts") === "1"; render(); }; });
      document.getElementById("start").onclick = function () { startSession("practice", pickPractice(chosen, count, factsOnly)); };
    }
    render();
  };

  /* ---------------- practice / weak-area sessions ---------------- */
  function startSession(mode, ids) {
    if (!ids.length) { go("home"); return; }
    session = { mode: mode, items: makeItems(ids), idx: 0, started: Date.now(), finished: false };
    renderQuestion();
  }

  function renderQuestion() {
    var s = session, item = s.items[s.idx], q = BY_ID[item.id];
    var need = q.answer.length, isMock = s.mode === "mock";
    var showResult = !isMock && item.done;
    var title = { practice: "Practice", weak: "Weak areas", mock: "Mock exam" }[s.mode];

    var h = '<div class="qhead"><span>' + esc(title) + ' · Question ' + (s.idx + 1) + ' of ' + s.items.length + '</span>' +
      (isMock ? '<span class="timer" id="timer" aria-label="Time remaining"></span>' : '<span>' + esc(SECTIONS[q.section]) + '</span>') + '</div>' +
      '<div class="progressbar" aria-hidden="true"><i style="width:' + pct(s.idx + (item.done ? 1 : 0), s.items.length) + '%"></i></div>' +
      '<div class="card">' +
      '<div class="qtext" id="qtext">' + esc(q.q) + '</div>' +
      '<div class="qhint">' + (need > 1 ? 'Choose ' + NUMWORD[need] + ' answers.' : 'Choose ONE answer.') + '</div>' +
      (q.img ? '<img class="qimg" src="' + esc(q.img) + '" alt="Safety sign for this question">' : '') +
      '<div class="options" role="group" aria-labelledby="qtext">' +
      item.order.map(function (orig, i) {
        var cls = "opt", pressed = item.sel.indexOf(i) >= 0;
        if (showResult) {
          var right = q.answer.indexOf(orig) >= 0;
          if (right) cls += " correct"; else if (pressed) cls += " wrong";
        }
        return '<button class="' + cls + '" data-opt="' + i + '" aria-pressed="' + pressed + '"' + (showResult ? ' disabled' : '') + '>' +
          '<span class="key">' + letter(i) + '</span><span>' + esc(q.options[orig]) + '</span></button>';
      }).join("") + '</div>';

    if (showResult) {
      var ok = isCorrect(item);
      h += '<div class="feedback ' + (ok ? "good" : "bad") + '" role="status"><h3>' + (ok ? "Correct" : "Not quite") + '</h3>' +
        '<p>' + esc(q.why) + '</p>' +
        '<p class="src">Source: <a href="' + esc(q.src.u) + '" target="_blank" rel="noopener">' + esc(q.src.t) + '</a> · Question ID: <b>' + esc(q.id) + '</b></p></div>';
    }
    h += '</div>';

    // actions
    h += '<div class="actions sticky">';
    if (isMock) {
      h += '<span class="row"><button class="btn" id="prev"' + (s.idx ? '' : ' disabled') + '>Previous</button>' +
        '<button class="btn" id="flag" aria-pressed="' + item.flag + '">' + (item.flag ? "Unflag" : "Flag for review") + '</button></span>' +
        '<span class="row">' + (s.idx < s.items.length - 1 ? '<button class="btn primary" id="next">Next</button>' : '') +
        '<button class="btn accent" id="finish">Finish exam</button></span>';
    } else {
      h += '<button class="btn ghost" id="quit">End session</button>';
      if (!item.done) h += '<button class="btn primary" id="check"' + (item.sel.length === need ? '' : ' disabled') + '>Check answer</button>';
      else h += '<button class="btn primary" id="next">' + (s.idx < s.items.length - 1 ? "Next question" : "See results") + '</button>';
    }
    h += '</div>';

    if (isMock) {
      h += '<details class="nav card" style="margin-top:16px"' + (s.navOpen ? ' open' : '') + '><summary>Question list (' + s.items.filter(function (i) { return i.sel.length; }).length + ' answered, ' + s.items.filter(function (i) { return i.flag; }).length + ' flagged)</summary><div class="navgrid">' +
        s.items.map(function (it, i) {
          var c = (it.sel.length ? "answered " : "") + (it.flag ? "flagged " : "") + (i === s.idx ? "current" : "");
          return '<button class="' + c + '" data-jump="' + i + '" aria-label="Question ' + (i + 1) + (it.sel.length ? ", answered" : "") + (it.flag ? ", flagged" : "") + '">' + (i + 1) + '</button>';
        }).join("") + '</div></details>';
    }

    app.innerHTML = h;

    // bind options
    app.querySelectorAll("[data-opt]").forEach(function (b) {
      b.onclick = function () { toggle(+b.getAttribute("data-opt")); };
    });
    bind("check", checkAnswer);
    bind("next", function () { if (isMock || s.idx < s.items.length - 1) { s.idx++; afterMove(); } else finishPractice(); });
    bind("prev", function () { s.idx--; afterMove(); });
    bind("flag", function () { item.flag = !item.flag; persistActive(); renderQuestion(); });
    bind("finish", finishMockConfirm);
    bind("quit", function () {
      var answered = s.items.filter(function (i) { return i.done; }).length;
      if (!answered) { session = null; go("home"); return; }
      finishPractice();
    });
    var det = app.querySelector("details.nav");
    if (det) det.addEventListener("toggle", function () { s.navOpen = det.open; });
    app.querySelectorAll("[data-jump]").forEach(function (b) { b.onclick = function () { s.idx = +b.getAttribute("data-jump"); afterMove(); }; });
    if (isMock) tick();
  }
  function bind(id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; }
  function afterMove() { if (session.mode === "mock") persistActive(); renderQuestion(); window.scrollTo(0, 0); }

  function toggle(i) {
    var s = session, item = s.items[s.idx], q = BY_ID[item.id];
    if (s.mode !== "mock" && item.done) return;
    var need = q.answer.length, at = item.sel.indexOf(i);
    if (need === 1) item.sel = [i];
    else if (at >= 0) item.sel.splice(at, 1);
    else { item.sel.push(i); if (item.sel.length > need) item.sel.shift(); }
    if (s.mode === "mock") persistActive();
    renderQuestion();
  }

  function checkAnswer() {
    var s = session, item = s.items[s.idx], q = BY_ID[item.id];
    if (item.sel.length !== q.answer.length) return;
    item.done = true;
    record(item.id, isCorrect(item));
    save();
    renderQuestion();
    var fb = app.querySelector(".feedback"); if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest" });
  }

  function summarise(items) {
    var bySec = {};
    items.forEach(function (it) {
      var q = BY_ID[it.id]; var b = bySec[q.section] || (bySec[q.section] = [0, 0]);
      b[1]++; if (isCorrect(it)) b[0]++;
    });
    return bySec;
  }

  function finishPractice() {
    var s = session; s.finished = true;
    var done = s.items.filter(function (i) { return i.done; });
    var correct = done.filter(isCorrect).length;
    if (done.length) {
      state.history.push({ mode: s.mode, date: Date.now(), total: done.length, correct: correct, bySec: summarise(done), secs: Math.round((Date.now() - s.started) / 1000) });
      save();
    }
    renderResults(s, done, correct, false);
  }

  /* ---------------- mock exam ---------------- */
  function startMockConfirm() {
    var begin = function () {
      confirmBox("Start mock exam?", MOCK_QUESTIONS + " questions in " + MOCK_MINUTES + " minutes. You won't see answers until the end. You can flag questions and go back to them.", "Start", "Cancel")
        .then(function (ok) {
          if (!ok) return;
          session = { mode: "mock", items: makeItems(pickMock()), idx: 0, started: Date.now(), deadline: Date.now() + MOCK_MINUTES * 60000, finished: false };
          persistActive();
          renderQuestion();
          window.scrollTo(0, 0);
        });
    };
    if (state.active) {
      confirmBox("Replace mock in progress?", "You already have a mock exam in progress. Starting a new one will discard it.", "Start new", "Cancel")
        .then(function (ok) { if (ok) { state.active = null; save(); begin(); } });
    } else begin();
  }
  function resumeMock() {
    var a = state.active; if (!a) return;
    session = a; session.idx = session.idx || 0;
    if (Date.now() >= session.deadline) { finishMock(true); return; }
    renderQuestion();
  }
  function persistActive() {
    if (!session || session.mode !== "mock" || session.finished) return;
    state.active = { mode: "mock", items: session.items, idx: session.idx, started: session.started, deadline: session.deadline, finished: false };
    save();
  }
  function tick() {
    stopTimer();
    var el = document.getElementById("timer");
    function update() {
      if (!session || session.mode !== "mock") { stopTimer(); return; }
      var left = (session.deadline - Date.now()) / 1000;
      if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left <= 300); }
      if (left <= 0) { stopTimer(); finishMock(true); }
    }
    update();
    timerHandle = setInterval(update, 1000);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  function finishMockConfirm() {
    var s = session;
    var un = s.items.filter(function (i) { return !i.sel.length; }).length;
    var fl = s.items.filter(function (i) { return i.flag; }).length;
    var msg = (un ? un + " question" + (un > 1 ? "s" : "") + " not answered. " : "All questions answered. ") +
      (fl ? fl + " flagged for review. " : "") + "Once you finish you can't change your answers.";
    confirmBox("Finish the exam?", msg, "Finish", "Keep going").then(function (ok) { if (ok) finishMock(false); });
  }
  function finishMock(timedOut) {
    var s = session; if (!s || s.finished) return;
    stopTimer();
    s.finished = true;
    s.items.forEach(function (it) { it.done = true; record(it.id, isCorrect(it)); });
    var correct = s.items.filter(isCorrect).length;
    state.history.push({ mode: "mock", date: Date.now(), total: s.items.length, correct: correct, bySec: summarise(s.items), secs: Math.round((Math.min(Date.now(), s.deadline) - s.started) / 1000), timedOut: !!timedOut });
    state.active = null;
    save();
    renderResults(s, s.items, correct, timedOut);
  }

  /* ---------------- results ---------------- */
  function renderResults(s, items, correct, timedOut) {
    stopTimer();
    var total = items.length, p = pct(correct, total), isMock = s.mode === "mock";
    var passed = total && correct / total >= PASS_RATE;
    var bySec = summarise(items);
    var wrong = items.filter(function (i) { return !isCorrect(i); });

    var h = '<h1>' + (isMock ? "Mock exam result" : "Session complete") + '</h1>';
    if (isMock) {
      h += '<div class="banner ' + (passed ? "good" : "bad") + '"><b>' + (passed ? "Pass" : "Not yet a pass") + '</b>: you scored ' + correct + ' out of ' + total + ' (' + p + '%). ' +
        'The pass mark is ' + Math.ceil(total * PASS_RATE) + ' out of ' + total + '.' + (timedOut ? ' Time ran out.' : '') + '</div>';
    } else {
      h += '<div class="banner ' + (p >= 90 ? "good" : p >= 75 ? "warn" : "bad") + '">You got ' + correct + ' out of ' + total + ' right (' + p + '%).</div>';
    }
    h += '<h2>By section</h2><div class="card bars">' +
      Object.keys(SECTIONS).filter(function (k) { return bySec[k]; }).map(function (k) {
        var b = bySec[k], bp = pct(b[0], b[1]);
        return barRow(SECTIONS[k], b[0] + "/" + b[1] + " (" + bp + "%)", bp, bp >= 90 ? "s-strong" : bp >= 75 ? "s-ok" : "s-weak");
      }).join("") + '</div>';

    h += '<div class="actions">' + '<button class="btn" data-go="home">Home</button><span class="row">' +
      (wrong.length ? '<button class="btn" id="retry">Practise the ' + wrong.length + ' I got wrong</button>' : '') +
      '<button class="btn primary" data-go="progress">View progress</button></span></div>';

    if (isMock) {
      h += '<h2>Review your answers</h2>' + items.map(function (it, i) {
        var q = BY_ID[it.id], ok = isCorrect(it);
        var yours = it.sel.length ? it.sel.map(function (x) { return esc(q.options[it.order[x]]); }).join("; ") : "<i>Not answered</i>";
        var right = q.answer.map(function (x) { return esc(q.options[x]); }).join("; ");
        return '<div class="review-item ' + (ok ? "good" : "bad") + '"><p><b>' + (i + 1) + '. ' + esc(q.q) + '</b></p>' +
          (q.img ? '<img class="qimg" style="width:80px;height:80px;margin:4px 0" src="' + esc(q.img) + '" alt="Safety sign">' : '') +
