</script>
<script>
/* Site Ready – HS&E Operatives revision. Runs fully offline; no data leaves the device. */
(function () {
  "use strict";

  var APP_VERSION = "1.1 (for comment)";
  var STORE_KEY = "siteready.v1";
  var MOCK_QUESTIONS = 50;
  var MOCK_MINUTES = 45;
  var PASS_RATE = 0.9;           // 45 out of 50
  var WEAK_SET = 15;
  var MIN_ATTEMPTS_FOR_RATING = 3;

  var QS = window.QUESTIONS || [];
  var SECTIONS = window.SECTIONS || {};
  var BY_ID = {};
  QS.forEach(function (q) { BY_ID[q.id] = q; });

  var app = document.getElementById("app");
  var session = null;      // current quiz/mock session
  var timerHandle = null;

  /* ---------------- storage ---------------- */
  var memoryStore = null;  // fallback if storage is blocked
  function blankState() { return { q: {}, history: [], active: null, settings: { theme: "auto" } }; }
  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.q) { s.history = s.history || []; s.settings = s.settings || { theme: "auto" }; return s; } }
    } catch (e) { /* storage unavailable */ }
    return memoryStore || blankState();
  }
  var state = load();
  function save() {
    memoryStore = state;
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* keep in memory */ }
  }
  function storageWorks() {
    try { var k = STORE_KEY + ".t"; window.localStorage.setItem(k, "1"); window.localStorage.removeItem(k); return true; } catch (e) { return false; }
  }

  /* ---------------- helpers ---------------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pct(c, t) { return t ? Math.round((c / t) * 100) : 0; }
  function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function fmtDate(ts) { var d = new Date(ts); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }
  function letter(i) { return String.fromCharCode(65 + i); }
  var NUMWORD = ["", "ONE", "TWO", "THREE", "FOUR", "FIVE"];
  function topicsOf(sec) { var t = []; QS.forEach(function (q) { if ((!sec || q.section === sec) && t.indexOf(q.topic) < 0) t.push(q.topic); }); return t; }
  function qstat(id) { return state.q[id] || { a: 0, c: 0, box: 0, last: 0 }; }

  function rating(c, a) {
    if (a < MIN_ATTEMPTS_FOR_RATING) return { cls: "s-none", label: a ? "Too few answers" : "Not started" };
    var p = c / a;
    if (p >= 0.9) return { cls: "s-strong", label: "Strong" };
    if (p >= 0.75) return { cls: "s-ok", label: "Getting there" };
    return { cls: "s-weak", label: "Weak" };
  }
  function aggregate(filter) {
    var a = 0, c = 0, seen = 0, n = 0;
    QS.forEach(function (q) { if (!filter(q)) return; n++; var s = qstat(q.id); a += s.a; c += s.c; if (s.a) seen++; });
    return { a: a, c: c, seen: seen, n: n };
  }

  /* Record an answer: Leitner-style box (1 = needs work … 5 = secure). */
  function record(id, correct) {
    var s = state.q[id] || { a: 0, c: 0, box: 0, last: 0 };
    s.a++; if (correct) s.c++;
    s.box = correct ? Math.min(5, (s.box || 1) + 1) : 1;
    s.last = Date.now();
    state.q[id] = s;
  }

  function isCorrect(item) {
    var q = BY_ID[item.id];
    var chosen = item.sel.map(function (i) { return item.order[i]; }).sort();
    var ans = q.answer.slice().sort();
    return chosen.length === ans.length && chosen.every(function (v, i) { return v === ans[i]; });
  }

  /* ---------------- question selection ---------------- */
  function makeItems(ids) {
    return ids.map(function (id) {
      var q = BY_ID[id];
      return { id: id, order: shuffle(q.options.map(function (_, i) { return i; })), sel: [], done: false, flag: false };
    });
  }
  function pickPractice(sections, count) {
    var pool = QS.filter(function (q) { return sections.indexOf(q.section) >= 0; });
    // favour questions seen less often, with randomness
    pool = pool.map(function (q) { return { q: q, k: qstat(q.id).a + Math.random() * 2 }; })
               .sort(function (x, y) { return x.k - y.k; }).map(function (x) { return x.q.id; });
    return shuffle(pool.slice(0, count || pool.length));
  }
  function topicAccuracy(topic) {
    var ag = aggregate(function (q) { return q.topic === topic; });
    return ag.a ? ag.c / ag.a : 0.5;
  }
  function pickWeak(count) {
    var scored = QS.map(function (q) {
      var s = qstat(q.id);
      var boxScore = s.a ? (6 - (s.box || 1)) : 3.5;       // wrong answers and unseen questions rank highest
      var topicScore = (1 - topicAccuracy(q.topic)) * 4;  // weak topics rank higher
      return { id: q.id, k: boxScore + topicScore + Math.random() };
    }).sort(function (x, y) { return y.k - x.k; });
    return shuffle(scored.slice(0, count).map(function (x) { return x.id; }));
  }
  function pickMock() {
    var keys = Object.keys(SECTIONS);
    var total = Math.min(MOCK_QUESTIONS, QS.length);
    var bySec = {}; keys.forEach(function (k) { bySec[k] = shuffle(QS.filter(function (q) { return q.section === k; }).map(function (q) { return q.id; })); });
    var chosen = [], i = 0, guard = 0;
    while (chosen.length < total && guard < 10000) {
      var k = keys[i % keys.length]; if (bySec[k].length) chosen.push(bySec[k].shift()); i++; guard++;
    }
    return shuffle(chosen);
  }

  /* ---------------- modal ---------------- */
  function confirmBox(title, body, okText, cancelText) {
    return new Promise(function (resolve) {
      var m = document.getElementById("modal");
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").textContent = body;
      var ok = document.getElementById("modal-ok"), cancel = document.getElementById("modal-cancel");
      ok.textContent = okText || "OK"; cancel.textContent = cancelText || "Cancel";
      cancel.hidden = cancelText === null;
      m.hidden = false; ok.focus();
      function done(v) { m.hidden = true; ok.onclick = cancel.onclick = null; document.removeEventListener("keydown", onKey); resolve(v); }
      function onKey(e) { if (e.key === "Escape") done(false); }
      ok.onclick = function () { done(true); };
      cancel.onclick = function () { done(false); };
      document.addEventListener("keydown", onKey);
    });
  }

  /* ---------------- theme ---------------- */
  function applyTheme() {
    var t = state.settings.theme;
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
  }

  /* ---------------- routing ---------------- */
  function go(view, arg) {
    stopTimer();
    document.querySelectorAll(".topnav button").forEach(function (b) {
      if (b.getAttribute("data-go") === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    (VIEWS[view] || VIEWS.home)(arg);
    window.scrollTo(0, 0);
    app.focus({ preventScroll: true });
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]");
    if (t) { e.preventDefault(); leaveGuard(function () { go(t.getAttribute("data-go")); }); }
  });
  function leaveGuard(fn) {
    if (session && session.mode === "mock" && !session.finished) {
      confirmBox("Leave the mock exam?", "Your answers so far are saved. You can resume this mock from the home screen, but the timer keeps running.", "Leave", "Stay")
        .then(function (ok) { if (ok) { persistActive(); session = null; fn(); } });
    } else { session = null; fn(); }
  }

  /* ---------------- views ---------------- */
  var VIEWS = {};

  VIEWS.home = function () {
    var all = aggregate(function () { return true; });
    var mocks = state.history.filter(function (h) { return h.mode === "mock"; });
    var last3 = mocks.slice(-3);
    var mockAvg = last3.length ? Math.round(last3.reduce(function (s, h) { return s + pct(h.correct, h.total); }, 0) / last3.length) : null;
    var weakTopics = topicsOf().map(function (t) { var ag = aggregate(function (q) { return q.topic === t; }); return { t: t, ag: ag, r: rating(ag.c, ag.a) }; })
      .filter(function (x) { return x.r.cls === "s-weak"; });
    var active = state.active;

    var h = '<h1>HS&amp;E test revision for Operatives</h1>' +
      '<p class="muted">Practise questions, find your weak areas and sit timed mock exams. Everything is stored on this device only.</p>';

    if (active && active.mode === "mock") {
      var left = Math.max(0, Math.round((active.deadline - Date.now()) / 1000));
      h += '<div class="banner warn row spread"><span>You have a mock exam in progress (' + (left ? fmtTime(left) + ' left' : 'time is up') + ').</span>' +
        '<span class="row"><button class="btn" id="discard">Discard</button><button class="btn primary" id="resume">Resume</button></span></div>';
    }
    h += '<div id="install">' + installHtml() + '</div>';
    h += '<div class="banner warn" style="margin-bottom:12px"><b>Preview for comment.</b> This is an early version with ' + QS.length + ' questions. If a question looks wrong or unclear, note its <b>Question ID</b> (shown after you answer it) and send your comments to the person who shared the app with you.</div>';
    if (!storageWorks()) {
      h += '<div class="banner bad">Your browser is blocking storage, so progress will be lost when you close this page.</div>';
    }

    h += '<div class="grid four" style="margin:16px 0">' +
      stat(all.seen + "/" + all.n, "questions seen") +
      stat(all.a ? pct(all.c, all.a) + "%" : "–", "practice accuracy") +
      stat(mocks.length, "mocks taken") +
      stat(mockAvg === null ? "–" : mockAvg + "%", "last 3 mocks avg") + '</div>';

    h += '<div class="grid two">' +
      mode("practice", "Practice by topic", "Pick sections, answer questions and see the explanation straight away.") +
      mode("weak", "Work on weak areas", "Targets questions you got wrong and your weakest topics.", weakTopics.length ? weakTopics.length + " weak topic" + (weakTopics.length > 1 ? "s" : "") : "") +
      mode("mock", "Mock exam", MOCK_QUESTIONS + " questions, " + MOCK_MINUTES + " minutes, pass mark 90%. Results at the end, like the real test.") +
      mode("progress", "My progress", "Strengths and weaknesses by section and topic, and your mock history.") +
      '</div>';

    h += '<h2>How to use this app</h2><ol class="small">' +
      '<li>Work through each section in <b>Practice</b> until you have seen every question.</li>' +
      '<li>Use <b>Weak areas</b> daily. It brings back the questions you get wrong.</li>' +
      '<li>Sit a <b>Mock exam</b>. Aim to score 90% or more in at least three mocks in a row before booking the real test.</li></ol>' +
      '<p class="small muted">Unofficial revision aid. Not produced or endorsed by CITB or CSCS. Version ' + APP_VERSION + ', ' + QS.length + ' questions.</p>';

    app.innerHTML = h;
    bindModes();
    bindInstall();
    var r = document.getElementById("resume"); if (r) r.onclick = resumeMock;
    var d = document.getElementById("discard"); if (d) d.onclick = function () {
      confirmBox("Discard this mock?", "Your answers in this mock will be deleted and it won't count towards your progress.", "Discard", "Cancel")
        .then(function (ok) { if (ok) { state.active = null; save(); go("home"); } });
    };
  };
  function stat(v, l) { return '<div class="card stat"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }
  function mode(id, title, text, tag) {
    return '<button class="mode" data-mode="' + id + '">' + (tag ? '<span class="tag">' + esc(tag) + '</span>' : '') +
      '<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></button>';
  }
  function bindModes() {
    app.querySelectorAll("[data-mode]").forEach(function (b) {
      b.onclick = function () {
        var m = b.getAttribute("data-mode");
        if (m === "practice") go("practiceSetup");
        else if (m === "weak") startSession("weak", pickWeak(WEAK_SET));
        else if (m === "mock") startMockConfirm();
        else go("progress");
      };
    });
  }

  VIEWS.practiceSetup = function () {
    var chosen = Object.keys(SECTIONS), count = 10;
    function render() {
      var avail = QS.filter(function (q) { return chosen.indexOf(q.section) >= 0; }).length;
      var h = '<h1>Practice by topic</h1><p class="muted">Choose the sections to practise. You get feedback after each question.</p>' +
        '<div class="card stack"><h3>Sections</h3><div class="chips">' +
        Object.keys(SECTIONS).map(function (k) {
          var ag = aggregate(function (q) { return q.section === k; });
          return '<button class="chip" data-sec="' + k + '" aria-pressed="' + (chosen.indexOf(k) >= 0) + '">' + esc(SECTIONS[k]) + ' <span class="small">(' + ag.n + ')</span></button>';
        }).join("") + '</div>' +
        '<h3>Number of questions</h3><div class="chips">' +
        [10, 20, 0].map(function (n) { return '<button class="chip" data-n="' + n + '" aria-pressed="' + (count === n) + '">' + (n ? n : "All (" + avail + ")") + '</button>'; }).join("") +
        '</div></div>' +
        '<div class="actions"><button class="btn ghost" data-go="home">Back</button>' +
        '<button class="btn primary" id="start"' + (chosen.length ? '' : ' disabled') + '>Start practice</button></div>';
      app.innerHTML = h;
      app.querySelectorAll("[data-sec]").forEach(function (b) {
        b.onclick = function () { var k = b.getAttribute("data-sec"); var i = chosen.indexOf(k); if (i >= 0) chosen.splice(i, 1); else chosen.push(k); render(); };
      });
      app.querySelectorAll("[data-n]").forEach(function (b) { b.onclick = function () { count = +b.getAttribute("data-n"); render(); }; });
      document.getElementById("start").onclick = function () { startSession("practice", pickPractice(chosen, count)); };
    }
    render();
  };

  /* ---------------- practice / weak-area sessions ---------------- */
  function startSession(mode, ids) {
    if (!ids.length) { go("home"); return; }
    session = { mode: mode, items: makeItems(ids), idx: 0, started: Date.now(), finished: false };
    renderQuestion();
  }

  function renderQuestion() {
    var s = session, item = s.items[s.idx], q = BY_ID[item.id];
    var need = q.answer.length, isMock = s.mode === "mock";
    var showResult = !isMock && item.done;
    var title = { practice: "Practice", weak: "Weak areas", mock: "Mock exam" }[s.mode];

    var h = '<div class="qhead"><span>' + esc(title) + ' · Question ' + (s.idx + 1) + ' of ' + s.items.length + '</span>' +
      (isMock ? '<span class="timer" id="timer" aria-label="Time remaining"></span>' : '<span>' + esc(SECTIONS[q.section]) + '</span>') + '</div>' +
      '<div class="progressbar" aria-hidden="true"><i style="width:' + pct(s.idx + (item.done ? 1 : 0), s.items.length) + '%"></i></div>' +
      '<div class="card">' +
      '<div class="qtext" id="qtext">' + esc(q.q) + '</div>' +
      '<div class="qhint">' + (need > 1 ? 'Choose ' + NUMWORD[need] + ' answers.' : 'Choose ONE answer.') + '</div>' +
      (q.img ? '<img class="qimg" src="' + esc(q.img) + '" alt="Safety sign for this question">' : '') +
      '<div class="options" role="group" aria-labelledby="qtext">' +
      item.order.map(function (orig, i) {
        var cls = "opt", pressed = item.sel.indexOf(i) >= 0;
        if (showResult) {
          var right = q.answer.indexOf(orig) >= 0;
          if (right) cls += " correct"; else if (pressed) cls += " wrong";
        }
        return '<button class="' + cls + '" data-opt="' + i + '" aria-pressed="' + pressed + '"' + (showResult ? ' disabled' : '') + '>' +
          '<span class="key">' + letter(i) + '</span><span>' + esc(q.options[orig]) + '</span></button>';
      }).join("") + '</div>';

    if (showResult) {
      var ok = isCorrect(item);
      h += '<div class="feedback ' + (ok ? "good" : "bad") + '" role="status"><h3>' + (ok ? "Correct" : "Not quite") + '</h3>' +
        '<p>' + esc(q.why) + '</p>' +
        '<p class="src">Source: <a href="' + esc(q.src.u) + '" target="_blank" rel="noopener">' + esc(q.src.t) + '</a> · Question ID: <b>' + esc(q.id) + '</b></p></div>';
    }
    h += '</div>';

    // actions
    h += '<div class="actions sticky">';
    if (isMock) {
      h += '<span class="row"><button class="btn" id="prev"' + (s.idx ? '' : ' disabled') + '>Previous</button>' +
        '<button class="btn" id="flag" aria-pressed="' + item.flag + '">' + (item.flag ? "Unflag" : "Flag for review") + '</button></span>' +
        '<span class="row">' + (s.idx < s.items.length - 1 ? '<button class="btn primary" id="next">Next</button>' : '') +
        '<button class="btn accent" id="finish">Finish exam</button></span>';
    } else {
      h += '<button class="btn ghost" id="quit">End session</button>';
      if (!item.done) h += '<button class="btn primary" id="check"' + (item.sel.length === need ? '' : ' disabled') + '>Check answer</button>';
      else h += '<button class="btn primary" id="next">' + (s.idx < s.items.length - 1 ? "Next question" : "See results") + '</button>';
    }
    h += '</div>';

    if (isMock) {
      h += '<details class="nav card" style="margin-top:16px"' + (s.navOpen ? ' open' : '') + '><summary>Question list (' + s.items.filter(function (i) { return i.sel.length; }).length + ' answered, ' + s.items.filter(function (i) { return i.flag; }).length + ' flagged)</summary><div class="navgrid">' +
        s.items.map(function (it, i) {
          var c = (it.sel.length ? "answered " : "") + (it.flag ? "flagged " : "") + (i === s.idx ? "current" : "");
          return '<button class="' + c + '" data-jump="' + i + '" aria-label="Question ' + (i + 1) + (it.sel.length ? ", answered" : "") + (it.flag ? ", flagged" : "") + '">' + (i + 1) + '</button>';
        }).join("") + '</div></details>';
    }

    app.innerHTML = h;

    // bind options
    app.querySelectorAll("[data-opt]").forEach(function (b) {
      b.onclick = function () { toggle(+b.getAttribute("data-opt")); };
    });
    bind("check", checkAnswer);
    bind("next", function () { if (isMock || s.idx < s.items.length - 1) { s.idx++; afterMove(); } else finishPractice(); });
    bind("prev", function () { s.idx--; afterMove(); });
    bind("flag", function () { item.flag = !item.flag; persistActive(); renderQuestion(); });
    bind("finish", finishMockConfirm);
    bind("quit", function () {
      var answered = s.items.filter(function (i) { return i.done; }).length;
      if (!answered) { session = null; go("home"); return; }
      finishPractice();
    });
    var det = app.querySelector("details.nav");
    if (det) det.addEventListener("toggle", function () { s.navOpen = det.open; });
    app.querySelectorAll("[data-jump]").forEach(function (b) { b.onclick = function () { s.idx = +b.getAttribute("data-jump"); afterMove(); }; });
    if (isMock) tick();
  }
  function bind(id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; }
  function afterMove() { if (session.mode === "mock") persistActive(); renderQuestion(); window.scrollTo(0, 0); }

  function toggle(i) {
    var s = session, item = s.items[s.idx], q = BY_ID[item.id];
    if (s.mode !== "mock" && item.done) return;
    var need = q.answer.length, at = item.sel.indexOf(i);
    if (need === 1) item.sel = [i];
    else if (at >= 0) item.sel.splice(at, 1);
    else { item.sel.push(i); if (item.sel.length > need) item.sel.shift(); }
    if (s.mode === "mock") persistActive();
    renderQuestion();
  }

  function checkAnswer() {
    var s = session, item = s.items[s.idx], q = BY_ID[item.id];
    if (item.sel.length !== q.answer.length) return;
    item.done = true;
    record(item.id, isCorrect(item));
    save();
    renderQuestion();
    var fb = app.querySelector(".feedback"); if (fb && fb.scrollIntoView) fb.scrollIntoView({ block: "nearest" });
  }

  function summarise(items) {
    var bySec = {};
    items.forEach(function (it) {
      var q = BY_ID[it.id]; var b = bySec[q.section] || (bySec[q.section] = [0, 0]);
      b[1]++; if (isCorrect(it)) b[0]++;
    });
    return bySec;
  }

  function finishPractice() {
    var s = session; s.finished = true;
    var done = s.items.filter(function (i) { return i.done; });
    var correct = done.filter(isCorrect).length;
    if (done.length) {
      state.history.push({ mode: s.mode, date: Date.now(), total: done.length, correct: correct, bySec: summarise(done), secs: Math.round((Date.now() - s.started) / 1000) });
      save();
    }
    renderResults(s, done, correct, false);
  }

  /* ---------------- mock exam ---------------- */
  function startMockConfirm() {
    var begin = function () {
      confirmBox("Start mock exam?", MOCK_QUESTIONS + " questions in " + MOCK_MINUTES + " minutes. You won't see answers until the end. You can flag questions and go back to them.", "Start", "Cancel")
        .then(function (ok) {
          if (!ok) return;
          session = { mode: "mock", items: makeItems(pickMock()), idx: 0, started: Date.now(), deadline: Date.now() + MOCK_MINUTES * 60000, finished: false };
          persistActive();
          renderQuestion();
          window.scrollTo(0, 0);
        });
    };
    if (state.active) {
      confirmBox("Replace mock in progress?", "You already have a mock exam in progress. Starting a new one will discard it.", "Start new", "Cancel")
        .then(function (ok) { if (ok) { state.active = null; save(); begin(); } });
    } else begin();
  }
  function resumeMock() {
    var a = state.active; if (!a) return;
    session = a; session.idx = session.idx || 0;
    if (Date.now() >= session.deadline) { finishMock(true); return; }
    renderQuestion();
  }
  function persistActive() {
    if (!session || session.mode !== "mock" || session.finished) return;
    state.active = { mode: "mock", items: session.items, idx: session.idx, started: session.started, deadline: session.deadline, finished: false };
    save();
  }
  function tick() {
    stopTimer();
    var el = document.getElementById("timer");
    function update() {
      if (!session || session.mode !== "mock") { stopTimer(); return; }
      var left = (session.deadline - Date.now()) / 1000;
      if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left <= 300); }
      if (left <= 0) { stopTimer(); finishMock(true); }
    }
    update();
    timerHandle = setInterval(update, 1000);
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  function finishMockConfirm() {
    var s = session;
    var un = s.items.filter(function (i) { return !i.sel.length; }).length;
    var fl = s.items.filter(function (i) { return i.flag; }).length;
    var msg = (un ? un + " question" + (un > 1 ? "s" : "") + " not answered. " : "All questions answered. ") +
      (fl ? fl + " flagged for review. " : "") + "Once you finish you can't change your answers.";
    confirmBox("Finish the exam?", msg, "Finish", "Keep going").then(function (ok) { if (ok) finishMock(false); });
  }
  function finishMock(timedOut) {
    var s = session; if (!s || s.finished) return;
    stopTimer();
    s.finished = true;
    s.items.forEach(function (it) { it.done = true; record(it.id, isCorrect(it)); });
    var correct = s.items.filter(isCorrect).length;
    state.history.push({ mode: "mock", date: Date.now(), total: s.items.length, correct: correct, bySec: summarise(s.items), secs: Math.round((Math.min(Date.now(), s.deadline) - s.started) / 1000), timedOut: !!timedOut });
    state.active = null;
    save();
    renderResults(s, s.items, correct, timedOut);
  }

  /* ---------------- results ---------------- */
  function renderResults(s, items, correct, timedOut) {
    stopTimer();
    var total = items.length, p = pct(correct, total), isMock = s.mode === "mock";
    var passed = total && correct / total >= PASS_RATE;
    var bySec = summarise(items);
    var wrong = items.filter(function (i) { return !isCorrect(i); });

    var h = '<h1>' + (isMock ? "Mock exam result" : "Session complete") + '</h1>';
    if (isMock) {
      h += '<div class="banner ' + (passed ? "good" : "bad") + '"><b>' + (passed ? "Pass" : "Not yet a pass") + '</b>: you scored ' + correct + ' out of ' + total + ' (' + p + '%). ' +
        'The pass mark is ' + Math.ceil(total * PASS_RATE) + ' out of ' + total + '.' + (timedOut ? ' Time ran out.' : '') + '</div>';
    } else {
      h += '<div class="banner ' + (p >= 90 ? "good" : p >= 75 ? "warn" : "bad") + '">You got ' + correct + ' out of ' + total + ' right (' + p + '%).</div>';
    }
    h += '<h2>By section</h2><div class="card bars">' +
      Object.keys(SECTIONS).filter(function (k) { return bySec[k]; }).map(function (k) {
        var b = bySec[k], bp = pct(b[0], b[1]);
        return barRow(SECTIONS[k], b[0] + "/" + b[1] + " (" + bp + "%)", bp, bp >= 90 ? "s-strong" : bp >= 75 ? "s-ok" : "s-weak");
      }).join("") + '</div>';

    h += '<div class="actions">' + '<button class="btn" data-go="home">Home</button><span class="row">' +
      (wrong.length ? '<button class="btn" id="retry">Practise the ' + wrong.length + ' I got wrong</button>' : '') +
      '<button class="btn primary" data-go="progress">View progress</button></span></div>';

    if (isMock) {
      h += '<h2>Review your answers</h2>' + items.map(function (it, i) {
        var q = BY_ID[it.id], ok = isCorrect(it);
        var yours = it.sel.length ? it.sel.map(function (x) { return esc(q.options[it.order[x]]); }).join("; ") : "<i>Not answered</i>";
        var right = q.answer.map(function (x) { return esc(q.options[x]); }).join("; ");
        return '<div class="review-item ' + (ok ? "good" : "bad") + '"><p><b>' + (i + 1) + '. ' + esc(q.q) + '</b></p>' +
          (q.img ? '<img class="qimg" style="width:80px;height:80px;margin:4px 0" src="' + esc(q.img) + '" alt="Safety sign">' : '') +
          '<p class="small">Your answer: ' + yours + '</p>' + (ok ? '' : '<p class="small">Correct answer: <b>' + right + '</b></p>') +
          '<p class="small muted">' + esc(q.why) + ' (Question ID: ' + esc(q.id) + ')</p></div>';
      }).join("");
    }
    session = null;
    app.innerHTML = h;
    bind("retry", function () { startSession("practice", shuffle(wrong.map(function (i) { return i.id; }))); });
  }

  function barRow(label, val, p, cls) {
    return '<div class="bar-row"><span class="label">' + esc(label) + '</span><span class="val">' + esc(val) + '</span>' +
      '<span class="track"><i class="' + cls + '" style="width:' + p + '%"></i><span class="pass" title="90% pass mark"></span></span></div>';
  }

  /* ---------------- progress ---------------- */
  VIEWS.progress = function () {
    var all = aggregate(function () { return true; });
    var mocks = state.history.filter(function (h) { return h.mode === "mock"; });
    var h = '<h1>My progress</h1>';
    if (!all.a) {
      h += '<div class="card"><p>No answers yet. Start with <b>Practice by topic</b> and your strengths and weaknesses will show here.</p>' +
        '<button class="btn primary" data-go="practiceSetup">Start practising</button></div>';
      app.innerHTML = h; return;
    }
    // readiness
    var last3 = mocks.slice(-3), ready = last3.length === 3 && last3.every(function (m) { return m.correct / m.total >= PASS_RATE; });
    var cover = pct(all.seen, all.n);
    h += '<div class="banner ' + (ready ? "good" : "warn") + '">' +
      (ready ? "Ready: you passed your last three mocks. Keep revising your weak topics until test day."
             : "Not ready yet. Aim to see every question and pass three mocks in a row. So far: " + cover + "% of questions seen, " +
               (last3.length ? last3.filter(function (m) { return m.correct / m.total >= PASS_RATE; }).length + " of your last " + last3.length + " mocks passed." : "no mocks taken.")) + '</div>';

    h += '<div class="grid four" style="margin:16px 0">' + stat(cover + "%", "of questions seen") + stat(pct(all.c, all.a) + "%", "overall accuracy") +
      stat(QS.filter(function (q) { return qstat(q.id).box >= 3; }).length, "questions secure") + stat(mocks.length, "mocks taken") + '</div>';

    h += '<h2>Strengths and weaknesses</h2><p class="small muted">Bars show your accuracy across all answers. The line marks the 90% pass mark. A rating appears after ' + MIN_ATTEMPTS_FOR_RATING + ' answers.</p>';
    Object.keys(SECTIONS).forEach(function (k) {
      var ag = aggregate(function (q) { return q.section === k; }), r = rating(ag.c, ag.a);
      h += '<div class="card" style="margin-bottom:12px"><h3>' + esc(SECTIONS[k]) + '<span class="pill ' + r.cls + '">' + esc(r.label) + '</span></h3>' +
        '<p class="small muted">' + ag.seen + ' of ' + ag.n + ' questions seen · ' + (ag.a ? pct(ag.c, ag.a) + '% correct' : 'no answers yet') + '</p><div class="bars">' +
        topicsOf(k).map(function (t) {
          var tg = aggregate(function (q) { return q.topic === t; }), tr = rating(tg.c, tg.a);
          return barRow(t + " — " + tr.label, tg.a ? pct(tg.c, tg.a) + "% (" + tg.c + "/" + tg.a + ")" : "–", pct(tg.c, tg.a), tr.cls);
        }).join("") + '</div></div>';
    });

    if (mocks.length) {
      h += '<h2>Mock exam history</h2><div class="card"><table class="hist"><thead><tr><th>Date</th><th class="num">Score</th><th class="num">Time</th><th>Result</th></tr></thead><tbody>' +
        mocks.slice().reverse().map(function (m) {
          var pass = m.correct / m.total >= PASS_RATE;
          return '<tr><td>' + esc(fmtDate(m.date)) + '</td><td class="num">' + m.correct + '/' + m.total + ' (' + pct(m.correct, m.total) + '%)</td><td class="num">' + fmtTime(m.secs) + '</td><td>' +
            '<span class="pill ' + (pass ? "s-strong" : "s-weak") + '">' + (pass ? "Pass" : "Fail") + '</span></td></tr>';
        }).join("") + '</tbody></table></div>';
    }

    h += '<h2>Reset</h2><p class="small muted">Deletes all answers and mock results on this device.</p><button class="btn danger" id="reset">Reset all progress</button>';
    app.innerHTML = h;
    bind("reset", function () {
      confirmBox("Reset all progress?", "This deletes all your answers and mock results on this device. It can't be undone.", "Reset", "Cancel")
        .then(function (ok) { if (ok) { var theme = state.settings.theme; state = blankState(); state.settings.theme = theme; save(); go("progress"); } });
    });
  };

  /* ---------------- about ---------------- */
  VIEWS.about = function () {
    var t = state.settings.theme;
    var sources = {}; QS.forEach(function (q) { sources[q.src.u] = q.src.t; });
    var h = '<h1>About Site Ready</h1>' +
      '<div class="card stack"><p><b>Site Ready</b> is a free, unofficial revision aid for the CITB Health, Safety and Environment (HS&amp;E) test for Operatives. The test is usually needed to apply for a CSCS card. It was made to help service leavers moving into construction.</p>' +
      '<p><b>It is not produced, checked or endorsed by CITB or CSCS.</b> The questions are original. They are written from UK health and safety law and HSE guidance, and they are not copies of the real test questions. The real test also includes other question styles, such as behavioural case studies. For official material, see CITB\'s revision products.</p>' +
      '<p>Health and safety law and guidance change. Always follow your site rules and your employer\'s instructions.</p>' +
      '<p><b>Privacy:</b> the app works offline. Your answers are stored only in this browser on this device. Nothing is sent anywhere.</p>' +
      '<p class="small muted">Version ' + APP_VERSION + ' · ' + QS.length + ' questions · ' + QS.filter(function (q) { return q.status === "reviewed"; }).length + ' reviewed by a qualified person</p></div>' +
      '<h2>Appearance</h2><div class="chips">' +
      [["auto", "Match device"], ["light", "Light"], ["dark", "Dark"]].map(function (o) { return '<button class="chip" data-theme="' + o[0] + '" aria-pressed="' + (t === o[0]) + '">' + o[1] + '</button>'; }).join("") + '</div>' +
      '<h2>Sources</h2><ul class="small">' + Object.keys(sources).map(function (u) { return '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(sources[u]) + '</a></li>'; }).join("") + '</ul>' +
      '<p class="small muted">Contains public sector information licensed under the Open Government Licence v3.0. Safety sign shapes and colours follow the Health and Safety (Safety Signs and Signals) Regulations 1996 and BS EN ISO 7010.</p>';
    app.innerHTML = h;
    app.querySelectorAll("[data-theme]").forEach(function (b) {
      b.onclick = function () { state.settings.theme = b.getAttribute("data-theme"); save(); applyTheme(); VIEWS.about(); };
    });
  };

  /* ---------------- keyboard ---------------- */
  document.addEventListener("keydown", function (e) {
    if (!session || session.finished || !document.getElementById("modal").hidden) return;
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    var item = session.items[session.idx]; if (!item) return;
    var k = e.key.toUpperCase();
    var n = k.length === 1 ? (k >= "A" && k <= "F" ? k.charCodeAt(0) - 65 : (k >= "1" && k <= "6" ? +k - 1 : -1)) : -1;
    if (n >= 0 && n < item.order.length) { e.preventDefault(); toggle(n); return; }
    if (e.key === "Enter" && !(e.target && e.target.tagName === "BUTTON")) {
      var btn = document.getElementById("check") || document.getElementById("next");
      if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    }
  });

  /* ---------------- start ---------------- */
  /* ---------------- phone / installed-app support ---------------- */
  var deferredPrompt = null;
  function isHosted() { return /^https?:$/.test(location.protocol); }
  function isStandalone() { return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
  function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function isAndroid() { return /android/i.test(navigator.userAgent); }
  function installHtml() {
    if (!isHosted() || isStandalone() || state.settings.hideInstall) return "";
    var body;
    if (deferredPrompt) body = '<b>Install Site Ready on this device.</b> It then opens like an app, works offline and keeps your progress safe.<div class="row" style="margin-top:8px"><button class="btn primary" id="install-btn">Install app</button></div>';
    else if (isIOS()) body = '<b>Add Site Ready to your Home Screen.</b> In Safari, tap the <b>Share</b> button (the square with an arrow), then <b>Add to Home Screen</b>. It then opens like an app, works offline, and your progress is kept. Without this, iPhones can delete your progress if you don\'t use the app for a week.';
    else if (isAndroid()) body = '<b>Install Site Ready on your phone.</b> Open the browser menu (<b>&#8942;</b>) and choose <b>Install app</b> or <b>Add to Home screen</b>. It then opens like an app and works offline.';
    else return "";
    return '<div class="banner good" style="margin-bottom:12px">' + body + '<div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn ghost" id="install-hide">Hide this tip</button></div></div>';
  }
  function bindInstall() {
    bind("install-hide", function () { state.settings.hideInstall = true; save(); var el = document.getElementById("install"); if (el) el.innerHTML = ""; });
    bind("install-btn", function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () { deferredPrompt = null; var el = document.getElementById("install"); if (el) { el.innerHTML = installHtml(); bindInstall(); } });
    });
  }
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferredPrompt = e;
    var el = document.getElementById("install"); if (el) { el.innerHTML = installHtml(); bindInstall(); }
  });
  if (isHosted()) {
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    }
    if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  }

  function setTopbarHeight() {
    var tb = document.querySelector(".topbar");
    if (tb) document.documentElement.style.setProperty("--tb", tb.offsetHeight + "px");
  }
  window.addEventListener("resize", setTopbarHeight);
  setTopbarHeight();

  applyTheme();
  go("home");

  // Test hook (used by automated checks only)
  window.__siteReady = { version: APP_VERSION, state: function () { return state; } };
})();

</script>
</body>
</html>
